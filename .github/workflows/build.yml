name: Build and verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Build with a JDK 21 toolchain (the shaded output still targets release 17 via
          # maven-compiler-plugin's <release> setting, so the shipped jar's bytecode and
          # supported server runtimes are unchanged). A real JDK 17 javac cannot read the
          # bluemap-api dependency jar, which the BlueMap maven repo currently publishes
          # compiled with Java 21 (class file version 65) under the 2.x coordinates this
          # project depends on; JDK 21 can read both old and new class file versions.
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode clean verify
      - name: Upload standard server JAR
        uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-1.2.7
          path: aegisguard-modern/target/AegisGuard-1.2.7.jar
          if-no-files-found: error
