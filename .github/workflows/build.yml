name: Build and verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AegisGuard 1.3.0 uses Java 21 as its supported server and build baseline.
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode clean verify
      - name: Upload standard server JAR
        uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-1.4.0
          path: aegisguard-modern/target/AegisGuard-1.4.0.jar
          if-no-files-found: error
