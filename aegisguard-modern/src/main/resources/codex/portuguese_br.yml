codex_root_welcome_lore:
- '&7Abra qualquer capítulo abaixo para ler um'
- '&7guia focado em reclamações, viagens,'
- '&7segurança, economia e muito mais.'
- ' '
- '&eCada capítulo abre seu próprio menu de ajuda.'
codex_claim_lore:
- '&7Aprenda como reivindicar terras,'
- '&7selecione cantos e crie'
- '&7reivindicações de grupo compartilhadas.'
codex_travel_lore:
- '&7Revisar casas, geração de lotes,'
- '&7visite viagens e servidor'
- '&7movimento estilo warp.'
codex_menus_lore:
- '&7Saiba o que cada especialização'
- '&7AegisGuard menu faz e'
- '&7onde gerenciar seu lote.'
codex_security_lore:
- '&7Veja como confiança, proibições,'
- '&7sinalizadores e regras de proteção'
- '&7mantenha seu terreno seguro.'
codex_economy_lore:
- '&7Leia sobre ClaimBlocks,'
- '&7manutenção, custos de expansão,'
- '&7e sistemas de mercado.'
codex_identity_lore:
- '&7Personalizar nomes de plotagens,'
- '&7descrições, cosméticos,'
- '&7e apresentação.'
codex_advanced_lore:
- '&7Explore nivelamento, zonas,'
- '&7aluguéis, TradeStalls, e'
- '&7outros sistemas avançados.'
codex_start_menu_lore:
- '&7Use o menu &b/ag &7para abrir o menu principal'
- '&7AegisGuard painel de controle a qualquer momento.'
- ' '
- '&7Esse menu é o caminho mais rápido para'
- '&7configurações, viagens, mercados, nivelamento,'
- '&7o códice e a maioria das ferramentas diárias.'
codex_start_wand_lore:
- '&7Use &b/ag wand &7para receber o'
- '&7Aegis Scepter para seleção de terreno.'
- ' '
- '&7Clique com o botão direito no primeiro bloco de canto.'
- '&7Clique com o botão esquerdo no bloco do canto oposto.'
codex_start_claim_lore:
- '&7Depois de selecionar ambos os cantos, use'
- '&b/ag reivindicação &7para criar seu enredo.'
- ' '
- '&7O plugin verifica sobreposição, mundo'
- '&7limites e custos necessários antes'
- '&7confirmando o terreno.'
codex_start_group_lore:
- '&7Quer terreno compartilhado? Crie um grupo com'
- 'O grupo &b/ag cria <nome>&7 primeiro.'
- ' '
- '&7Convide jogadores, financie o tesouro,'
- '&7então use &b/ag group Claim&7 quando'
- '&7sua equipe está pronta.'
codex_start_travel_lore:
- '&7Use &b/ag home &7para retornar ao seu'
- '&7plot e &b/ag visite &7para alcançar confiança'
- '&7ou destinos listados no servidor.'
- ' '
- '&7Se você tiver dúvidas, tente'
- '&b/ag preso &7para recuperação.'
codex_start_settings_lore:
- '&7Abra Configurações de plotagem no menu principal'
- '&7para revisar entradas, contêineres, mobs,'
- '&7redstone e outras proteções.'
- ' '
- '&7Abra membros e funções para amigos de confiança'
- '&7ou remova visitantes indesejados.'
codex_start_codex_lore:
- '&7Cada capítulo deste guia explica'
- '&7uma parte diferente de AegisGuard.'
- ' '
- '&7Volte aqui sempre que esquecer'
- '&7um comando, um menu ou como um dos'
- '&7os sistemas mais recentes funcionam.'
codex_start_help_lore:
- 'Menu &b/ag &7- abre o menu principal'
- '&b/ag varinha &7- pegue a varinha de reivindicação'
- '&b/ag reivindicação &7- confirme seu enredo'
- '&b/ag visita &7- abrir opções de viagem'
- '&b/ag help &7- visualizar ajuda do comando'
codex_claim_step1_lore:
- '&7Execute &b/ag wand &7para receber'
- '&7o Aegis Scepter.'
- ' '
- '&eEtapa 1:&7 Segure a varinha em sua mão.'
- '&eEtapa 2:&7 Clique com o botão direito no primeiro bloco de canto.'
- '&eEtapa 3:&7 Clique com o botão esquerdo no bloco do canto oposto.'
- '&8A varinha deve marcar o terreno, não se posicionar.'
codex_claim_step2_lore:
- '&7Escolha dois cantos no mesmo mundo'
- '&7para delinear a área desejada.'
- ' '
- '&eClique com o botão direito:&7 primeiro canto'
- '&eClique com o botão esquerdo:&7 segundo canto'
- '&eDica:&7 Mantenha espaço suficiente para caminhos,'
- '&7armazenamento, fazendas e crescimento futuro.'
- ' '
- '&8AegisGuard mostrará o tamanho selecionado'
- '&8no chat antes de confirmar a reivindicação.'
codex_claim_step3_lore:
- '&7Depois que ambos os cantos estiverem marcados, use'
- '&a/ag reivindicação &7para criar o gráfico.'
- ' '
- '&eComando:&7 /ag reivindicação'
- '&7O plugin verifica sobreposição, limites,'
- '&7e custo antes de criar o lote.'
- '&8Se falhar, leia o erro vermelho do chat'
- 'Linha &8 para ver o que bloqueou a reclamação.'
codex_claim_group_lore:
- '&7As parcelas compartilhadas começam com um grupo real,'
- '&7não é uma reivindicação pessoal normal.'
- ' '
- '&eCriar:&7 /ag grupo criar <nome>'
- '&eConvite:&7 /ag convite de grupo <jogador>'
- '&eDepósito:&7 /ag depósito de grupo <valor>'
- '&eReivindicação:&7 /ag reivindicação de grupo'
- ' '
- '&8Melhor para cidades, guild halls, mercados,'
- '&8e projetos compartilhados de longo prazo.'
codex_claim_limits_lore:
- '&7Uma reclamação deve caber com segurança no mundo'
- '&7antes AegisGuard permitirá isso.'
- ' '
- '&7Não pode se sobrepor a outras parcelas,'
- '&7quebre os limites do raio mundial ou entre'
- '&7terra protegida de plug-ins suportados.'
- ' '
- '&8Isso protege você e as pessoas próximas'
- '&8jogadores de conflitos fronteiriços complicados.'
codex_claim_starter_lore:
- '&7Muitos servidores oferecem uma reivindicação inicial'
- '&7ou terreno do grupo inicial com base em'
- '&7as regras de primeira reivindicação configuradas.'
- ' '
- '&7Alguns servidores oferecem terrenos grátis primeiro.'
- '&7Outros exigem ClaimBlocks, dinheiro,'
- '&7ou financiamento do tesouro do grupo primeiro.'
codex_claim_group_money_lore:
- '&7A tesouraria do grupo é um financiamento compartilhado para'
- '&7reivindicações e expansões de grupo.'
- ' '
- '&eDepósito:&7 /ag depósito de grupo <valor>'
- '&eStatus:&7 /ag status do grupo'
- ' '
- '&8Isso ajuda todo o grupo a pagar'
- '&8crescimento em vez de um jogador sozinho.'
codex_claim_fail_lore:
- '&7Verifique sobreposição, limites mundiais,'
- '&7regras de tamanho de reivindicação, fundos necessários,'
- '&7ou conflitos de proteção externa.'
- ' '
- '&7Experimente uma área menor, afaste-se'
- '&7reivindicações próximas ou ganhe mais recursos'
- '&7antes de tentar novamente.'
codex_claim_commands_lore:
- '&e/ag varinha &7- pegue o cetro'
- '&e/ag reivindicação &7- crie um enredo pessoal'
- '&e/ag reivindicação de grupo &7- criar um lote compartilhado'
- '&e/ag não reivindicar &7- remova seu lote atual'
codex_travel_home_lore:
- '&7Sua casa é o principal ponto de retorno'
- '&7para seu terreno pessoal.'
- ' '
- '&eVá para casa:&7 /ag casa'
- '&eSet Spawn:&7 /ag setspawn'
- ' '
- '&7Defina seu spawn após construir um'
- '&7entrada, caminho ou área de boas-vindas.'
- '&8Defina isto após construir uma entrada ou foyer.'
codex_travel_visit_lore:
- '&7O menu Visita é o seu centro de viagens para'
- '&7parcelas confiáveis, suas próprias parcelas e'
- '&7locais de viagem do servidor.'
- ' '
- '&eAbrir:&7 /ag visit'
- ' '
- '&7Esta é a maneira mais fácil de alternar entre'
- '&7reivindicações amigáveis ​​sem correr pelo mapa.'
codex_travel_server_lore:
- '&7Proprietários de servidores podem criar servidores gerenciados'
- '&7destinos de plotagem em estilo warp para'
- '&7áreas de desova, mercado ou vitrine.'
- ' '
- '&7Se o seu servidor tiver spawn, mercado,'
- '&7showcase ou enredos de eventos, eles podem'
- '&7aparecem aqui como pontos de viagem.'
codex_travel_tip_lore:
- '&7Defina o spawn do seu enredo após a reivindicação.'
- ' '
- '&7Use o modo de visita para alcançar amigos'
- '&7ou plotagens confiáveis ​​mais rapidamente.'
- '&8Mantenha seu spawn limpo para que as chegadas sejam seguras.'
codex_travel_trusted_lore:
- '&7Se outro jogador confiar em você, o'
- '&7plot pode aparecer em Visita rapidamente'
- '&7viajar para terras compartilhadas ou amigas.'
- ' '
- '&7Isso é útil para compilações compartilhadas,'
- '&7projetos municipais e grupos aliados.'
codex_travel_room_lore:
- '&7Quartos alugados e subparcelas podem ter'
- '&7seus próprios quartos, criando hotéis'
- '&7e mercados mais fáceis de navegar.'
- ' '
- '&7Se você alugar um quarto, abra seus controles'
- '&7para gerenciar o comportamento de teletransporte da sala,'
- '&7acesso de convidados e geração de salas.'
codex_travel_unstuck_lore:
- '&7Use o comando unstuck se você acabar'
- '&7preso em paredes, salas, edifícios ou'
- '&7cantos estranhos de uma reivindicação.'
- ' '
- '&eComando:&7 /ag travado'
- ' '
- '&7Use-o antes de pedir ajuda à equipe'
- '&7se você estiver simplesmente preso no terreno.'
codex_menus_main_lore:
- 'Menu &e/ag &7abre o AegisGuard principal'
- '&7painel de controle para a maioria das ações do jogador.'
- ' '
- '&7A partir daqui você pode acessar as configurações,'
- '&7viagem, ajuda do códice e ferramentas de plotagem.'
codex_menus_settings_lore:
- '&7As configurações do lote controlam como seu terreno'
- '&7se comporta para você, amigos e visitantes.'
- ' '
- '&7Isso inclui entrada, contêineres,'
- '&7mobs, PvP, redstone e muito mais.'
- ' '
- '&7Revise-os depois de reivindicar para que seu'
- '&7plot se comporta da maneira que você deseja.'
codex_menus_members_lore:
- '&7Use o menu Membros para adicionar amigos,'
- '&7mudar funções e gerenciar quem pode'
- '&7construa ou interaja em seu terreno.'
- ' '
- '&7Isso é mais seguro do que compartilhar tudo'
- '&7com cada visitante.'
codex_menus_preferences_lore:
- '&7As preferências do jogador permitem que você gerencie'
- '&7idioma, sons e notificação'
- '&7comportamento.'
- ' '
- '&7Se um menu parecer muito barulhento, isso é'
- '&7onde você ajusta suas configurações pessoais.'
codex_menus_market_lore:
- '&7Planejas relacionadas ao mercado podem expor um'
- '&7Botão Mercado Local para barracas,'
- '&7aluguéis e sistemas de lojas vinculadas.'
- ' '
- '&7Use-o para navegar em zonas alugáveis,'
- '&7abra TradeStalls ou gerencie seu'
- '&7espaço comercial próprio dentro desse terreno.'
codex_menus_info_lore:
- '&7Este códice deve ser seu'
- '&7referência no jogo sempre que você'
- '&7esqueça como um recurso funciona.'
- ' '
- '&7Se você não tiver certeza do que um botão faz,'
- '&7verifique este guia antes de experimentar.'
codex_security_access_lore:
- '&7Acesso confiável significa fornecer outro'
- '&7permissão do jogador para usar seu enredo.'
- ' '
- '&7Abra &eMembros e funções &7do principal'
- '&7menu para adicionar ou atualizar o acesso do jogador.'
- ' '
- '&7As funções decidem o que cada membro pode fazer,'
- '&7do acesso simples ao gerenciamento completo.'
codex_security_ban_lore:
- '&7Kick remove alguém do seu lote'
- '&7agora mesmo. Ban os impede de vir'
- '&7para trás até levantá-lo.'
- ' '
- '&eChute:&7 /ag kick <jogador>'
- ' '
- '&eBan:&7 /ag ban <jogador>'
- '&eDesbanir:&7 /ag unban <jogador>'
codex_security_flags_lore:
- '&7Sinalizadores de proteção são o principal botão de alternância'
- '&7regras para seu enredo.'
- ' '
- '&7Eles controlam entrada, contêineres,'
- '&7veículos, redstone, mobs, PvP e muito mais.'
- ' '
- '&7Estas são as principais regras que moldam'
- '&7quão seguro ou aberto seu terreno parece.'
codex_security_notify_lore:
- '&7Use configurações de notificação para controlar'
- '&7reclamar saudações e atualizações administrativas'
- '&7separadamente.'
- ' '
- '&7Isso ajuda você a manter alertas úteis enquanto'
- '&7desligando aqueles que você não deseja.'
codex_security_room_lore:
- '&7Quartos e subparcelas permitem uma reivindicação principal'
- '&7mantenha espaços protegidos menores dentro dele.'
- ' '
- '&7Os locatários podem gerenciar seu quarto enquanto'
- '&7o proprietário principal ainda mantém a supervisão.'
- ' '
- '&7Isso é útil para hotéis, apartamentos,'
- '&7bancas de mercado e complexos de guildas.'
codex_security_entities_lore:
- '&7Os lotes podem proteger contêineres,'
- '&7entidades decorativas, veículos,'
- '&7e muitos vetores de luto comuns.'
- ' '
- '&7Isso inclui os tipos de pequenas tristezas'
- '&7tentativas que as pessoas muitas vezes ignoram.'
codex_security_staff_lore:
- '&7Acesso à equipe do servidor significa administradores ou'
- '&7grupos de funcionários podem gerenciar parcelas especiais'
- '&7sem depender de bypass manual.'
- ' '
- '&7Isso se destina a zonas de servidor,'
- '&7parcelas de mercado e outras áreas gerenciadas.'
- ' '
- '&7Isso reduz a necessidade de confiar'
- '&7desvio manual para trabalho rotineiro da equipe.'
codex_economy_blocks_lore:
- '&7ClaimBlocks são um dos principais'
- '&7moedas de progressão em AegisGuard.'
- ' '
- '&e/ag blocos &7mostra seu saldo e'
- 'Comandos de bloco de reivindicação relacionados a &7.'
- '&7Você pode ganhá-los brincando,'
- '&7nivelamento, troca ou outras regras do servidor.'
codex_economy_upkeep_lore:
- '&7Manutenção significa que o servidor cobra'
- '&7manutenção regular ou impostos sobre terrenos.'
- ' '
- '&7Avisos podem ser enviados através'
- '&7AegisGuard notificações.'
- '&8Se a manutenção estiver habilitada, não ignore'
- '&8avisos sobre custos futuros.'
codex_economy_market_lore:
- '&7Use o mercado e o mercado local'
- '&7sistemas para vender terrenos, alugar zonas,'
- '&7ou navegue TradeStalls.'
- ' '
- '&7Alguns servidores mantêm isso global, enquanto'
- '&7outros permitem que os jogadores construam mercados internos.'
codex_economy_expand_lore:
- '&7As expansões permitem que você expanda um existente'
- '&7 plote quando suas fronteiras atuais são'
- '&7muito pequeno para seus planos.'
- ' '
- '&7Alguns servidores usam filas de aprovação.'
- '&7Outros permitem solicitações válidas instantâneas.'
- ' '
- '&7Se sua fronteira parece apertada, este é'
- '&7como você cultiva com segurança.'
codex_economy_stalls_lore:
- '&7TradeStalls permite que os vendedores criem'
- '&7vitrines protegidas baseadas em baús'
- '&7dentro de mercados locais e áreas alugáveis.'
- ' '
- '&7Eles funcionam mesmo que o servidor não funcione'
- '&7use um plugin de loja de terceiros separado.'
codex_economy_stall_setup_lore:
- '&7Para construir um TradeStall, coloque um'
- '&7peito ou cano apoiado primeiro.'
- ' '
- '&7Em seguida, adicione um sinal de parada válido e use'
- '&7o menu da barraca para definir preços, quantidade,'
- '&7e qual moeda a banca aceita.'
- ' '
- '&7Servidores podem permitir dinheiro, ClaimBlocks,'
- '&7ou ambos para preços de barracas.'
codex_economy_currency_lore:
- '&7Servidores podem permitir dinheiro, ClaimBlocks,'
- '&7ou ambos dependendo do recurso'
- '&7e as regras de economia configuradas.'
- ' '
- '&7Leia cada menu com atenção para saber'
- '&7qual moeda essa ação usará.'
codex_economy_warning_lore:
- '&7Avisos de tesouraria baixa, avisos de manutenção,'
- '&7e custos de expansão podem ser enviados'
- '&7por meio de notificações AegisGuard.'
- ' '
- '&7Se você ignorá-los por muito tempo, seu'
- 'A próxima ação &7pode falhar inesperadamente.'
codex_identity_name_lore:
- '&7Identidade do lote significa como é o seu lote'
- '&7apresentado aos visitantes e aos cardápios.'
- ' '
- '&eRenomear:&7 /ag renomear <nome>'
- ' '
- '&eDescrição:&7 /ag setdesc <texto>'
- '&7Um bom nome e uma descrição ajudam as pessoas'
- '&7entenda para que serve o seu enredo.'
codex_identity_cosmetics_lore:
- '&7Cosméticos são toques visuais para o seu'
- '&7plot, como partículas ou efeitos de entrada.'
- ' '
- '&7Geralmente não mudam de propriedade'
- '&7ou segurança. Eles mudam a apresentação.'
- ' '
- '&7Use-os para tornar seu enredo mais'
- '&7distinto sem alterar sua finalidade.'
codex_identity_presentation_lore:
- '&7A apresentação cobre o estilo visível'
- '&7de um enredo, desde nomenclatura até cosméticos'
- '&7e como é visitá-lo.'
- ' '
- '&7Use isto para fazer o distrito se sentir'
- '&7claro, acolhedor e memorável'
- '&7sem alterar as regras de propriedade.'
codex_identity_stuck_lore:
- '&7Unstuck é uma ferramenta de recuperação para quando'
- '&7você fica preso em paredes, construções,'
- '&7claims ou spawns de salas ruins.'
- ' '
- '&eComando:&7 /ag travado'
- ' '
- '&7É um comando de segurança prático, mesmo'
- '&7embora também afete o fluxo do jogador.'
codex_identity_greeting_lore:
- '&7Saudações e títulos são bem-vindos'
- '&7mensagens mostradas quando alguém entra'
- '&7ou deixa uma trama.'
- ' '
- '&7Use-os para receber convidados, etiquetar'
- '&7shops, ou dar um toque temático a um enredo.'
- ' '
- '&7Este é um bom lugar para receber convidados'
- '&7ou lojas de etiquetas e áreas especiais.'
codex_identity_showcase_lore:
- '&7A apresentação é tão polida e fácil'
- '&7para entender o que o seu enredo sente para os outros.'
- ' '
- '&7Um nome claro, uma boa descrição, um'
- '&7 spawn seguro e visuais correspondentes, todos'
- '&7ajuda os visitantes a se lembrarem do enredo.'
- ' '
- '&7Pequenos detalhes da apresentação tornam seu'
- '&7plot parece muito mais completo.'
codex_advanced_level_lore:
- '&7Atualizações de nivelamento de enredo ou ascensão'
- '&7sua parcela em níveis mais fortes ao longo do tempo.'
- ' '
- '&7Cada nível pode desbloquear novas vantagens,'
- '&7bônus ou benefícios de progressão.'
- ' '
- '&7Abra Plot Ascension para visualizar o que'
- '&7o próximo nível realmente lhe dará.'
codex_advanced_zones_lore:
- '&7As zonas dividem uma reivindicação principal em'
- '&7espaços menores com finalidade própria.'
- ' '
- '&7Use-os para quartos, aluguéis, barracas,'
- '&7escritórios, apartamentos ou alas da guilda.'
- ' '
- '&7Esta é uma das melhores ferramentas para pousadas,'
- '&7hotéis, shoppings e prédios de apartamentos.'
codex_advanced_local_market_lore:
- '&7Local Market é um centro de mercado baseado em parcelas'
- '&7para barracas, aluguéis e ferramentas de lojas vinculadas.'
- ' '
- '&7Se um terreno suportar características de mercado,'
- '&7é aqui que os jogadores navegam pelo que'
- '&7 enredo específico tem a oferecer.'
- ' '
- '&7Isso faz com que as lojas pareçam locais em vez de'
- '&7despejando tudo em um menu global.'
codex_advanced_recovery_lore:
- '&7As ferramentas de recuperação ajudam a equipe a reparar danos,'
- '&7restaurar reclamações e investigar problemas.'
- ' '
- '&7Isso inclui diagnóstico, migração,'
- '&7instantâneos e ações de restauração.'
- ' '
- '&7Essas ferramentas são especialmente importantes'
- '&7em servidores públicos ou de longa duração.'
codex_advanced_tip_lore:
- '&7Revise suas configurações após reivindicar,'
- '&7mantenha seu spawn atualizado e use'
- '&7agrupe as ferramentas cuidadosamente em parcelas compartilhadas.'
- ' '
- '&7Uma pequena revisão antecipada pode economizar muito'
- '&7de confusão mais tarde.'
codex_advanced_migration_lore:
- '&7Ferramentas de migração ajudam os administradores a mover terras'
- '&7de plug-ins de proteção suportados para'
- '&7AegisGuard com menos retrabalho manual.'
- ' '
- '&7Use o bastão de migração e visualize a IU'
- '&7antes de confirmar as reivindicações importadas.'
- ' '
- '&8Isso se destina à configuração do servidor ou'
- '&8alteração de plug-ins de proteção.'
codex_advanced_snapshot_lore:
- '&7Instantâneos registram o estado do gráfico para que a equipe'
- '&7pode reverter ou restaurar mais tarde, se necessário.'
- ' '
- '&7Eles são úteis após acidentes, luto,'
- '&7expansões ruins ou situações de reversão.'
- ' '
- '&7Eles são especialmente úteis depois de maus'
- '&7expansões, sofrimento ou problemas de servidor.'
codex_advanced_diagnostics_lore:
- '&7Os diagnósticos ajudam os proprietários de servidores a inspecionar'
- '&7problemas de configuração e integridade do plugin.'
- ' '
- '&7Use relatórios médicos e ferramentas administrativas para'
- '&7detecte erros de configuração ou sistemas quebrados.'
- ' '
- '&7Se algo parecer errado, diagnóstico'
- '&7é o primeiro lugar que a equipe deve procurar.'
