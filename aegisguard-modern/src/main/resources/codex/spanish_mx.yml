- '&7reportes, liquidaciones, morosos y migración de storage.'
- '&7Cuándo: parcelas, alquileres o hooks se ven inconsistentes.'
- ' '
- '&eClic para abrir.'
button_view_requests_admin: '&cRevisar Solicitudes'
view_requests_admin_lore:
- '&7Qué: aprobar o rechazar peticiones de expansión.'
- '&7Cuándo: hay solicitudes pendientes en la cola.'
- ' '
- '&eClic para abrir.'
button_admin_reload_all: '&eRecargar Ajustes'
button_reload_all_settings: '&eRecargar Ajustes'
reload_all_settings_lore:
- '&7Qué: recargar config, vistas de datos y menús.'
- '&7Cuándo: después de editar config.yml en disco.'
- ' '
- '&cNo reemplaza un reinicio completo para todo cambio.'
- '&eClic para recargar.'
button_refresh_language_packs: '&aActualizar Idiomas'
button_admin_refresh_lang: '&aActualizar Idiomas'
refresh_language_packs_lore:
- '&7Recarga menús y mensajes'
- '&7después de editar archivos de idioma.'
- ' '
- '&eClic para actualizar.'
admin_toggle_default_lore:
- '&7Alterna esta opción para'
- '&7todo el servidor.'
button_admin_snapshots: '&d📸 Instantáneas'
admin_snapshots_lore:
- '&7Qué: revisar puntos de recuperación y restaurar parcelas.'
- '&7Cuándo: deshacer un merge/expansión/edición mala.'
- ' '
- '&cLa restauración sobrescribe la parcela activa — confirma con cuidado.'
- '&eClic para abrir.'
- ' '
- '&7Guarda registros: dueño, banderas,'
- '&7miembros y límites. No bloques del mundo.'
- '&eLas copias completas (builds) llegan después.'
button_admin_snapshots_disabled: '&8📸 Deshabilitadas'
admin_snapshots_disabled_lore:
- '&7Las instantáneas de parcelas están'
- '&7deshabilitadas en la configuración actual.'
admin_plot_list_title: '&b✦ Lista de Parcelas'
admin_plot_list_lore:
- '&7Qué: explorar parcelas registradas y teletransportarte.'
- '&7Cuándo: investigar un claim o ayudar a un jugador.'
- ' '
- '&eClic para abrir.'
button_admin_world_controls: '&b🌍 Controles del Mundo'
admin_world_controls_lore:
- '&7Qué: defaults de claim por mundo y game rules en vivo.'
- '&7Cuándo: cerrar un mundo, ajustar PvP/mobs o spawn.'
- ' '
- '&cLos toggles de game rules aplican de inmediato.'
- '&eClic para abrir.'
button_admin_world_controls_missing: '&8🌍 Controles del Mundo No Disponibles'
admin_world_controls_missing_lore:
- '&7Esta versión aún no tiene'
- '&7la interfaz de controles del mundo.'
button_admin_migration: '&6Asistente de Migración'
admin_migration_lore:
- '&7Qué: vista previa y luego importar de'
- '&7GriefPrevention, GriefDefender o Lands.'
- '&7Cuándo: al cambiar de plugin de protección.'
- ' '
- '&cLa importación escribe parcelas — primero previsualiza.'
- '&eClic para abrir.'
button_admin_audit: '&eRegistro de Auditoría'
admin_audit_lore:
- '&7Qué: revisar restauraciones, reparaciones del Doctor,'
- '&7migraciones, bypass y ajustes de ClaimBlocks.'
- '&7Cuándo: auditorías o revisión de incidentes.'
- ' '
- '&eClic para abrir.'
audit_admin_title: '&e&lRegistro de Auditoría'
audit_disabled: '&cEl registro de auditoría está deshabilitado.'
audit_none_title: '&cSin Registros'
audit_none_lore:
- '&7Ningún registro coincide'
- '&7con este filtro todavía.'
audit_filter_button: '&bFiltro: &f{FILTER}'
audit_filter_lore:
