- '&7a la audiencia configurada.'
button_admin_unlimited: '&aParcelas Ilimitadas'
admin_unlimited_lore:
- '&7Elimina los límites normales'
- '&7de parcelas para administradores.'
button_admin_sync: '&dSincronización Proxy'
