# ==============================================================================
# AegisGuard 1.4.0 - Main Configuration
# ==============================================================================
# Every section is wrapped in a banner and every key explains what it does.
# Sections run roughly from core setup (modules, localization, storage,
# economy) through gameplay systems to staff tools at the end of the file.
#
# Recommended setup order:
#  1. localization   - choose default and fallback languages
#  2. modules        - optional systems are on by default except wilderness_revert (off; SQL-only)
#  3. hooks          - enable only the integrations your server actually uses
#  4. storage        - choose YML file storage or a database backend
#  5. network        - BungeeCord/Velocity cross-server features (needs shared MySQL/MariaDB)
#  6. economy        - decide whether claims use Vault, ClaimBlocks, or both
#  7. claims         - set claim limits, costs, and per-world behavior
#  8. protections    - review default protection behavior inside plots
#  9. group_plots    - configure shared groups, treasury, and starter claims
# 10. upkeep         - on by default; set false if you do not want recurring plot taxes
#
# After editing, run /agadmin reload or restart the server.
#
# YAML tips:
# - Use spaces only. Do not use tab characters.
# - Keep indentation aligned exactly.
# - If the server reports InvalidConfigurationException, the file did not parse.
# ==============================================================================

# config_schema is maintained automatically; do not lower it on an existing server.
config_schema: 1315


# ------------------------------------------------------------------------------
# Legacy compatibility values
# ------------------------------------------------------------------------------
# These are retained for older code paths and existing installations.
# Dual key: top-level `prefix` is a legacy chat prefix. Prefer
# localization.prefix for new installs; both may exist during upgrades.
prefix: '&8[&bAegisGuard&8]&r '


# ==============================================================================
# Module switchboard
# ==============================================================================
# Optional systems only. Claiming land, plot protection, member roles, Settings,
# the guidebook, and Staff Tools stay available so a protection-only server still
# works. Optional modules below are on by default except wilderness_revert,
# which ships off. Wilderness revert is SQL-only and does nothing on YAML
# storage; enable it only if the owner wants it and storage is SQL. Set any
# other module to false to hide its menus, block matching /ag commands, and
# skip its runtime work. Flip it back to true later when you want the feature.
# After /agadmin reload, each matching <section>.enabled key stays in sync.
#
# Example protection-only start: set guest_passes, lockdown, alliance_access,
# realm_profiles, routes, travel, plot_discovery, expansions, zoning,
# group_plots, leveling, claim_blocks, economy, market, market_stalls, rentals,
# auction, cosmetics, titles, biomes, unstuck, social, first_claim_walkthrough,
# starter_kit, and arena to false. Leave claiming and protection as they are.
modules:
  # Temporary visitor access passes that expire on their own.
  guest_passes: true
  # Owner/staff panic switch that freezes building on a plot during griefing.
  lockdown: true
  # Cross-plot friend groups that owners can opt into via Alliance Access toggles.
  alliance_access: true
  # Per-plot profile page: name, description, category, greeting, noticeboard.
  realm_profiles: true
  # Two-page onboarding shown once after a player's first claim.
  first_claim_walkthrough: true
  # First-join wand + quickstart note for brand-new players.
  starter_kit: true
  # Staff-authored exploration routes with checkpoints and rewards.
  routes: true
  # Safe Travel: cooldowns, combat gates, and confirmations on teleports.
  travel: true
  # Public plot listings, categories, featured pins, and visit counts.
  plot_discovery: true
  # Plot growth requests (admin-approved or instant) plus Horizon endgame ranks.
  expansions: true
  # Rentable sub-regions inside a plot, independent of full-plot rentals.
  zoning: true
  # Shared group-owned plots with a treasury and starter-size bonus.
  group_plots: true
  # Plot level progression with per-level rewards.
  leveling: true
  # The ClaimBlocks currency: playtime earnings, gifts, and the Vault exchange.
  claim_blocks: true
  # Vault economy integration for claim costs, fees, and sales.
  economy: true
  # Plot market listings (buy/sell plots) and the market hub menu.
  market: true
  # Built-in TradeStalls shops inside market plots.
  market_stalls: true
  # Full-plot rental contracts between owners and renters.
  rentals: true
  # Public plot auctions with bidding.
  auction: true
  # Recurring plot taxes with grace periods and optional auto-unclaim.
  upkeep: true
  # Merging two perfectly aligned adjacent claims into one.
  claim_merge: true
  # Claim-data snapshots for rollback. Optional WorldEdit/FAWE build copies:
  # snapshots.build_backup (off by default).
  snapshots: true
  # The staff-only Audit Ledger of high-impact administrative actions.
  audit: true
  # Cosmetic plot borders and entry effects.
  cosmetics: true
  # Entry/exit title and action-bar notifications.
  titles: true
  # Per-plot biome changes.
  biomes: true
  # The /ag unstuck escape command for players trapped in a claim.
  unstuck: true
  # Likes and social discovery counters on plots.
  social: true
  # The durable owner/admin territory activity history.
  territory_activity: true
  # Cooperative PvE dungeon runs on protected server plots.
  arena: true
  # Off by default. Enable only if the owner wants it AND storage is SQL.
  # YAML storage is a no-op. SQL being on does not turn this on automatically.
  wilderness_revert: false
  mob_barrier: true
  # Public travel uses paired pads + Safe Travel confirm. Set false to restore
  # 1.3.0-style plot-spawn Visit/market/auction landings. Later versions drop this off-switch.
  teleport_beacons: true
  # Private plot member chat on this server. Cross-server Frequency is still 2.0.
  plot_chat: true
  # Entry titles, for-sale labels, and scepter border direction labels.
  visual_presence: true
  succession: true
  caravans: true
  gatherings: true


# ==============================================================================
# Guardian Succession
# ==============================================================================
# Ownership continuity: named heirs, co-owner promotion, and inactive-owner
# takeover so plots never become permanently orphaned when an owner vanishes.
succession:
  enabled: true
  # Days an owner may stay offline before an heir may assume the plot.
  inactivity_days: 30
  # Cooldown between ownership transfers to prevent flip-flopping.
  transfer_cooldown_seconds: 3600
  # Window after a succession during which staff can roll the transfer back.
  rollback_window_seconds: 300
  # During succession, lock co-owner management powers until the transfer settles.
  auto_lock_co_owners: true


# ==============================================================================
# Caravans & Trade Routes
# ==============================================================================
# Real-time shipments between public teleport-beacon pads: players pack cargo,
# dispatch it, and it physically travels the network over time. Random road
# events (ambush, toll, boon, delay) apply en route.
caravans:
  enabled: true
  # How often (ticks) the shipment ticker advances all active caravans.
  tick_interval_ticks: 20
  # Shipments one player may have in transit at once.
  max_active_per_player: 3
  # Seconds between dispatches from the same player.
  dispatch_cooldown_seconds: 30
  # Allowed cargo bounds (items per shipment) and the pre-filled amount.
  min_cargo: 10
  max_cargo: 10000
  default_cargo: 100
  # Shipping fee as a fraction of declared cargo value.
  fee_rate: 0.05
  # Floor for the shipping fee so tiny loads still cost something.
  min_fee: 1
  # Optional insurance: pays out if an ambush event destroys cargo.
  insurance_enabled: true
  insurance_rate: 0.15
  # Travel speed: milliseconds of transit per block of distance, clamped below.
  ms_per_block: 50
  min_travel_ms: 5000
  max_travel_ms: 600000
  # Route distances (blocks) that elevate a shipment to medium / high risk.
  risk_medium_distance: 250
  risk_high_distance: 800
  # Fees and insurance payouts require Vault. Set false to allow blocks-only.
  require_vault: true
  # When true, destination pads must sit on plots with a trade-ish purpose.
  require_trade_purpose: false
  # Plot purposes that count as trade destinations when the above is on.
  market_purposes:
    - SHOP
    - MARKET
    - AUCTION
  # Relative weights when a road event is rolled for a shipment in transit.
  events:
    ambush_weight: 15
    toll_weight: 15
    boon_weight: 10
    delay_weight: 10
  # Fraction of cargo lost when an ambush event wins.
  ambush_loss_rate: 1.0
  # Bonus cargo/value granted by a boon event.
  boon_bonus_rate: 0.20
  # Fraction skimmed as a toll event fee.
  toll_rate: 0.05
  # Share of shipment value paid to a hired escort player.
  escort_cut_rate: 0.10
  # Escorts divide ambush loss by this factor.
  escort_ambush_divisor: 2
  # Delay added to arrival when a delay event wins (milliseconds).
  delay_ms: 15000
  # Fraction of travel completed before a shipment can no longer be cancelled.
  cancel_progress: 0.25


# ==============================================================================
# Open House (Gatherings)
# ==============================================================================
# Timed public listings: an owner opens their plot to visitors for a set
# window and the Atlas features it until the timer expires.
gatherings:
  enabled: true
  # Pre-filled event length (minutes) and the allowed bounds.
  default_minutes: 30
  min_minutes: 10
  max_minutes: 180
  # Visitors arriving during the event receive a temporary Guest Pass.
  grant_guest_pass: true
  # How often (ticks) the listing ticker checks expirations.
  tick_interval_ticks: 100


# ==============================================================================
# Starter Kit
# ==============================================================================
# Optional first-join onboarding items for new players.
starter_kit:
  first_join:
    enabled: true

    # Give a claim wand to brand-new players the first time they ever join.
    give_wand: true

    # Give a disposable quickstart note with menu and claiming tips.
    give_quickstart_note: true

    # Preferred hotbar slots (0-8). If occupied, AegisGuard uses the first empty slot.
    wand_hotbar_slot: 0
    note_hotbar_slot: 1

    # If true, dropping the quickstart note deletes it immediately instead of
    # leaving it on the ground.
    note_disappears_on_drop: true


# ==============================================================================
# Localization
# ==============================================================================
# Controls the primary language system and the legacy fallback bundle loader.
localization:
  prefix: '&8[&bAegisGuard&8]&r '

  # Main language folder inside plugins/AegisGuard/
  folder: "lang"

  # Fallback folder for older codex-style single-file bundles
  fallback_folder: "codex"

  # Language used when a player has not selected a personal language yet.
  default_language: old_english

  # Language used if the selected language pack is missing a key.
  fallback_language: modern_english

  # Compatibility aliases used by older builds or selectors.
  default_style: old_english
  fallback_style: modern_english

  # Bundle files are loaded in this order and merged together.
  bundles:
    - guis.yml
    - system.yml
    - upgrades.yml
    - expansions.yml

  # Languages available in language selectors.
  available_languages:
    - old_english
    - modern_english
    - spanish_mx
    - spanish_ar
    - portuguese_br
    - french_fr
    - italian_it
    - german_de
    - polish_pl

  # If true, bundled language files will be copied into the plugin folder when
  # they do not already exist on disk.
  extract_defaults: true

  # Log missing translation keys to help pack authors fill gaps.
  debug_missing_keys: false

  # Per-player language preferences are stored here automatically.
  player_styles: {}


# ------------------------------------------------------------------------------
# Legacy style selector (compatibility)
# ------------------------------------------------------------------------------
# Older builds and third-party selectors read language_styles.* instead of
# localization.*. Keep these aligned with the localization defaults above.
language_styles:
  # Keep this aligned with localization.default_language unless you are preserving
  # an older installation that still references the legacy style selector.
  default: old_english

  # Languages available to older selectors or compatibility code.
  available:
    - old_english
    - modern_english
    - spanish_mx
    - spanish_ar
    - portuguese_br
    - french_fr
    - italian_it
    - german_de
    - polish_pl


# ==============================================================================
# Chest GUIs and Bedrock (Geyser / Floodgate)
# ==============================================================================
# AegisGuard always runs on a Java server. Bedrock players are detected per
# login when Floodgate and/or Geyser-Spigot is installed. Those clients use
# left-click for the main action and sneak+left-click for the second action
# (Java right-click). Drop (Q) is cancel/delete. Set detect to false to force
# Java-only click mapping for everyone.
gui:
  bedrock:
    detect: true


# ==============================================================================
# Hooks and integrations
# ==============================================================================
# All hooks are OFF by default (opt-in). Enable only what your server actually
# uses so startup stays clean and unused integrations are never probed.
# Existing installs that already set enabled: true keep their values; migration
# only fills missing keys and never overwrites a custom true/false choice.
hooks:
  dynmap:
    # Draws plot outlines, owners, and sale/rent markers on a Dynmap web map.
    enabled: false
    # The Dynmap layer label shown in the map's layer picker.
    layer_name: "AegisGuard Plots"
    # Minutes between full outline re-syncs to the map.
    sync_interval_minutes: 5
    # Hex color for rental listings; distinct from the yellow sale marker.
    for_rent_color: "009688"
    # Outline stroke and area fill styling (hex RRGGBB, opacity 0-1, px width).
    style:
      stroke_color: "00FF00"
      stroke_opacity: 0.8
      stroke_weight: 3
      fill_color: "00FF00"
      fill_opacity: 0.35

  discord:
    # Posts selected events to a Discord channel through an incoming webhook.
    enabled: false
    # Paste a Discord channel webhook URL here. Never share or commit it.
    webhook_url: ""
    # Which events are posted. Off-by-default events are the noisy/sensitive ones.
    events:
      claim_create: true
      claim_delete: true
      admin_actions: true
      market_sale: false
      rental_start: false
      rental_end: false
      lockdown: false
      guest_pass: false
      # Serious recovery events only; routine successful backups never send alerts.
      restore_failure: false
      backup_warning: false
    # Account linking foundation (requires a Discord bot in a future release).
    # When enabled, players can link their Minecraft UUID to a Discord ID and
    # staff can reference either identity in commands.
    linking:
      enabled: false
      # Your Discord server's ID and the role granted to linked players.
      guild_id: ""
      linked_role_id: ""
      # Storage backend for links: playerdata (YAML player preferences) or sql.
      storage: "playerdata"

  bluemap:
    # Draws plot outlines on a BlueMap web map.
    enabled: false
    # The BlueMap marker-set label shown in its layer picker.
    label: "Claims"

  pl3xmap:
    # Draws plot outlines on a Pl3xMap web map.
    enabled: false

  protection_compat:
    # Defers to other protection plugins (WorldGuard, GriefPrevention, etc.)
    # where their regions overlap AegisGuard claims.
    enabled: false

    # EXTERNAL_WINS is the safest mode when multiple protection plugins overlap.
    overlap_policy: EXTERNAL_WINS
    debug_logging: false
    # Providers checked when enabled. Lower priority number = consulted first.
    plugins:
      worldguard:
        enabled: false
        priority: 100
      griefprevention:
        enabled: false
        priority: 90
      griefdefender:
        enabled: false
        priority: 90
      towny:
        enabled: false
        priority: 80
      residence:
        enabled: false
        priority: 70


# ==============================================================================
# Storage
# ==============================================================================
# Chooses where plot / zone / stall data is persisted.
#
# Allowed values for backend and type (keep them EQUAL):
#   yml      - file-per-plot YAML under plugins/AegisGuard/plots/ (best for small/medium)
#   sqlite   - local SQLite file (single-node without an external DB)
#   mysql    - external MySQL
#   mariadb  - external MariaDB (same connection settings as mysql)
#   sql      - legacy alias; treated as sqlite
#
# Keep storage.backend and storage.type the same string. Both keys are read for
# compatibility with older configs; mismatched values can surprise you.
#
# Scope: storage.* covers plot / zone / stall records only. Satellite files always
# remain YAML regardless of backend (alliances.yml, territory-life.yml, audit,
# routes, beacons.yml, player notification prefs, etc.).
#
# Autosave: YML writes use synchronous save-on-change (temp file + atomic move).
# SQL backends use a connection pool; savePlot is async and savePlotSync waits.
# There is no separate storage.autosave interval toggle.
#
# Switching backends: use Doctor → Storage Migrate (or /agadmin migrate) for
# guided YML ↔ SQL plot conversion with timestamped backups. Do not swap
# storage.backend/type and expect plots to appear without a migrate step.
storage:
  # Keep these two keys equal (yml | sqlite | mysql | mariadb).
  backend: "yml"
  type: "yml"

  database:
    # SQLite database filename, relative to plugins/AegisGuard/. This value is honored.
    file: "aegisguard.db"
    # MySQL/MariaDB connection — the server address, port, and schema name.
    # On a BungeeCord network every backend points at the SAME database.
    host: "localhost"
    port: 3306
    database: "aegisguard"
    # WARNING: replace these before enabling mysql/mariadb. Do not commit real
    # credentials into version control or shared config packs.
    username: "root"
    password: "password"
    # Encrypt the database connection. Requires TLS configured on the DB server.
    useSSL: false


# ==============================================================================
# Network / BungeeCord (cross-server)
# ==============================================================================
# Connects backend servers running AegisGuard through one shared MySQL/MariaDB
# database and the proxy's standard plugin-messaging channel. Works with
# BungeeCord, Waterfall, and Velocity (Velocity speaks the same 'BungeeCord'
# channel when its forwarding mode is 'bungeecord' or 'modern' with the
# legacy channel registered). No proxy-side plugin is required.
#
# Requirements before enabling:
#   * storage.backend AND storage.type must be "mysql" or "mariadb", and every
#     backend must point at the SAME database.
#   * server_name below must match this backend's name in the proxy's config
#     (BungeeCord config.yml 'servers:' entry / Velocity velocity.toml).
#   * First shared boot: configure the same server_name per backend BEFORE
#     starting against the shared DB. Existing plot rows are claimed by the
#     first backend that loads them — see NETWORK_SETUP.md.
#
# YML/SQLite storage is per-server and cannot network; enabling network on a
# non-shared backend logs a warning and disables itself.
network:
  enabled: false

  # This backend's name in the proxy's server list. REQUIRED when enabled.
  # Also tags new plots/beacons so other backends treat them as remote.
  server_name: ""

  # Optional friendly label in network listings (defaults to server_name).
  display_name: ""

  # Seconds between heartbeat writes marking this server online in the registry.
  heartbeat_seconds: 30

  # Seconds before a stale heartbeat counts as offline in listings/travel.
  offline_after_seconds: 120

  # Seconds a pending cross-server arrival stays valid (proxy hop + join).
  arrival_ttl_seconds: 90

  travel:
    # List other servers' public plots/warps in Visit Atlas / Discover.
    remote_destinations: true
    # Allow clicking remote destinations to hop servers.
    cross_server_travel: true

  chat:
    # Relay alliance / group / staff channels across the network. Plot chat
    # stays local (it is bound to the world the plot lives in).
    relay_channels: true

  shared_player_data:
    # Sync claim-block balances and per-player settings through the shared DB
    # so they follow players across the network.
    enabled: true

  hub:
    # Designated "hub"/"lobby" backend — its name in the proxy server list.
    # /ag hub and the Travel Hub's spawn button hop players here. Leave blank
    # for no dedicated hub (spawn buttons stay local-world).
    server: ""
    # Optional exact landing point on the hub backend. When blank the player
    # lands at that server's world spawn.
    world: ""
    x: 0
    y: 0
    z: 0
    # Register top-level /hub and /lobby commands. Turn off if another plugin
    # already owns those names.
    register_commands: true
    # Auto-send brand-new network players to the hub on their first join.
    # OFF by default — the hub backend must be online for the hop to work.
    # Requires shared_player_data — its missing row is how "new" is detected.
    redirect_new_players: false


# ==============================================================================
# Web admin dashboard (foundation)
# ==============================================================================
# Read-only JSON API over SQL storage and the audit ledger. Disabled by default.
# Set auth_token to a strong random value before enabling. Bind to 127.0.0.1
# unless you have a reverse proxy handling TLS and authentication.
web_dashboard:
  enabled: false
  # Address the embedded HTTP server binds to. Keep 127.0.0.1 unless a reverse
  # proxy in front handles TLS and authentication.
  host: "127.0.0.1"
  port: 8080
  # Bearer token required on every request. Leave empty to keep the API
  # unreachable even when enabled; set a strong random value before use.
  auth_token: ""


# ==============================================================================
# Currency routing
# ==============================================================================
# When a system supports more than one payment method (Vault money or
# ClaimBlocks), these pick which one it tries first. Supported values: VAULT,
# CLAIM_BLOCKS. Systems that only take one currency ignore their entry here.
currencies:
  # New claim purchases.
  claiming: VAULT
  # Plot expansion / resize charges.
  resizing: VAULT
  # Temporary flight skill purchases.
  flight: VAULT
  # Per-plot biome changes.
  biomes: VAULT
  # Teleport/beacon trip fees.
  teleport: VAULT
  # Plot level-up costs.
  leveling: VAULT


# ==============================================================================
# Economy and pricing
# ==============================================================================
economy:
  # Master switch for every money-touching feature (claims, flags, markets,
  # rentals, upgrades). With it off, those systems run free of charge.
  enabled: true

  # Dual key: economy.use_vault (legacy flat toggle) is still read by several
  # code paths. Prefer economy.vault.enabled for new configs; keep both true
  # unless you intentionally disable Vault payments.
  use_vault: true

  vault:
    # If false, AegisGuard ignores Vault even if it is installed.
    enabled: true

    # If true, systems that support ClaimBlocks can fall back to them when Vault
    # is missing or disabled.
    fallback_to_blocks: true

  # Legacy flat claim cost used when fair_pricing.enabled is false.
  claim_cost: 100.0

  # Example item-based price hook if you want some systems to consume items.
  item_cost:
    # Bukkit material name consumed per transaction.
    type: DIAMOND
    amount: 5

  # Per-flag unlock prices charged when an owner enables them on a plot.
  flag_costs:
    fly: 5000.0
    shop-interact: 500.0

  # Fallback cost for the separate Frontier Expansion request system.
  expansion_cost_per_block: 10.0

  # Return part of a plot's purchase price when its owner unclaims it.
  refund_on_unclaim: true
  refund_percent: 50.0

  # Fair pricing prevents oversized starter claims from being too cheap.
  fair_pricing:
    enabled: true

    # Minimum claim cost before extra area charges apply.
    base_cost: 100.0

    # Area covered by the base cost. 256 = one chunk.
    base_area: 256

    # Price per block beyond base_area.
    expansion_rate_per_block: 10.0

    # If true, claims smaller than base_area pay proportionally less.
    scale_base_with_area: false

    # Prevents tiny claims from becoming effectively free.
    minimum_cost: 10.0

    # ClaimBlock multiplier for area beyond base_area.
    claimblock_multiplier: 1.0


# ==============================================================================
# Claims and per-world rules
# ==============================================================================
claims:
  # Global personal claim limits.
  max_claims_per_player: 2
  # Minimum Chebyshev radius on both axes (a 10×10 plot has radius 5).
  min_radius: 5
  # Maximum Chebyshev radius per axis (64 = up to a 129×129 plot).
  max_radius: 64
  # Hard cap on total plot area in blocks, regardless of shape.
  max_area: 16000
  # How long the wand corner-preview glow stays visible after a selection.
  preview_seconds: 10

  # Quick-Claim: one command / one click claims a square of the given radius
  # around the player, reusing all normal claim validation and economy.
  quick_claim:
    enabled: true
    default_radius: 5
    max_radius: 25

  # After a successful claim, open the main preset chooser (Home/Shop/Arena/Farm,
  # or Spawn/Hub/Shop/Arena on server plots). Sanctuary flags are never overwritten.
  preset_chooser: true

  # Wand behavior.
  consume_wand_on_claim: true
  admin_keep_wand: true

  # Claim merge is on by default; set false to disable. require_alignment
  # prevents L-shape bbox theft. Review alignment / access-data safety if needed.
  merging:
    enabled: true
    cost: 500.0
    require_alignment: true

  # Legacy Travel/Visit teleport toggles under claims.* (menu + /ag home/visit).
  # Separate from top-level `travel:` Safe Travel cooldowns/combat gates below.
  travel_system:
    enabled: true
    allow_home_teleport: true
    allow_visit_teleport: true

  # World-specific overrides. Omit a value to inherit the global default.
  # Per-world keys: allow_claims (claims allowed at all), use_vault (Vault
  # payments in this world), vault_cost (flat price when fair pricing is off),
  # max_claims_per_player, max_radius.
  per_world:
    world:
      allow_claims: true
      use_vault: true
      vault_cost: 100.0
      max_claims_per_player: 2
      max_radius: 64

    world_nether:
      allow_claims: true
      use_vault: false
      max_claims_per_player: 1
      max_radius: 32

    world_the_end:
      allow_claims: false


# ==============================================================================
# ClaimBlocks economy
# ==============================================================================
claim_blocks:
  # Master switch for the ClaimBlocks currency: balances, earning, gifting,
  # and the Vault exchange. Plot spending is governed by the paying system.
  enabled: true

  gift:
    # Player-to-player ClaimBlocks gifts (/ag giftblocks or Gift GUI).
    # Requires permission aegis.claimblocks.gift (included in aegis.user).
    # Gifts transfer only currently available blocks; they never reduce claimed land.
    enabled: true
    permission: "aegis.claimblocks.gift"
    # Total blocks one player may give away per day.
    daily_limit: 5000
    # Largest single gift.
    max_amount: 1000

  # Starting balance for new players.
  starting_blocks: 500

  first_claim_limit:
    # When true, a player's very first claim is free but capped to this area.
    enabled: true
    max_area: 100

  earn:
    playtime:
      enabled: true
      # Payout window and the blocks granted per window.
      interval_minutes: 10
      blocks_per_interval: 50
      # Message the player when a playtime payout lands.
      notify: true

      anti_afk:
        enabled: true

        # Players must be active for this many seconds during each payout window.
        required_activity_seconds: 300

        # Players become AFK after this many minutes of inactivity.
        afk_timeout_minutes: 5

        # Activity sources used by the anti-AFK tracker.
        track_movement: true
        track_interactions: true
        track_combat: true

    level_up:
      # Grant blocks whenever a player's plot levels up.
      enabled: true
      per_level: 600

    # Players may opt out of passive playtime ClaimBlock rewards.
    player_opt_out_allowed: true

  # ---------------------------------------------------------------------------
  # ClaimBlocks exchange
  # ---------------------------------------------------------------------------
  # Profiles:
  # - safe_small   : cautious defaults for newer or smaller servers
  # - balanced_mid : recommended default for most servers
  # - fast_large   : higher throughput for busy servers
  # - custom       : use the values in this section directly
  #
  # Requirements:
  # - economy.use_vault = true
  # - economy.vault.enabled = true
  # - Vault plus an economy provider
  exchange:
    enabled: true

    # Which preset rates/limits/fees apply: safe_small | balanced_mid |
    # fast_large | custom (custom reads the values directly above profiles).
    profile: safe_small

    # Prevent exchange access when Vault is present but no economy provider exists.
    require_vault_provider: true

    sell_requires_permission:
      # When true, selling blocks requires the permission below.
      enabled: false
      permission: "aegis.claimblocks.sell"

    worlds_allowed:
      # When true, the exchange only works inside the listed worlds.
      enabled: false
      worlds:
        - world
        - world_nether

    permissions:
      exchange: "aegis.claimblocks.exchange"
      buy: "aegis.claimblocks.buy"
      sell: "aegis.claimblocks.sell"
      bypass_limits: "aegis.claimblocks.exchange.bypass"
      bypass_sell_lock: "aegis.claimblocks.selllock.bypass"

    # "custom" profile values — the prices one block costs to buy and earns
    # when sold.
    rates:
      buy_price_per_block: 10.0
      sell_price_per_block: 6.0

    limits:
      # Seconds between a player's exchange transactions.
      cooldown_seconds: 10
      max_trades_per_hour: 30

      buy:
        min_blocks: 1
        max_blocks_per_trade: 5000
        max_blocks_per_day: 25000
        # Daily Vault spend cap for buys; 0.0 = unlimited.
        max_money_per_day: 0.0

      sell:
        min_blocks: 1
        max_blocks_per_trade: 5000
        max_blocks_per_day: 15000
        # Daily Vault payout cap for sells; 0.0 = unlimited.
        max_money_per_day: 0.0

    # Skim taken off each side of a trade (percent + flat Vault amount).
    fees:
      buy:
        percent: 2.5
        flat: 0.0
      sell:
        percent: 5.0
        flat: 0.0

    sell_lock:
      # Blocks bought through the exchange cannot be re-sold for this many
      # minutes — slows buy-low/sell-high flipping.
      enabled: true
      hold_minutes: 30
      # EXCHANGE_PURCHASED_ONLY = only exchange-bought blocks are locked.
      scope: EXCHANGE_PURCHASED_ONLY
      # Cap on simultaneously locked blocks; 0 = no cap.
      max_locked_blocks: 0

    audit:
      enabled: true
      log_to_console: true

    profiles:
      safe_small:
        rates:
          buy_price_per_block: 12.0
          sell_price_per_block: 6.0
        limits:
          cooldown_seconds: 15
          max_trades_per_hour: 18
          buy:
            min_blocks: 1
            max_blocks_per_trade: 2000
            max_blocks_per_day: 5000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 1500
            max_blocks_per_day: 2500
            max_money_per_day: 0.0
        fees:
          buy: { percent: 3.0, flat: 0.0 }
          sell: { percent: 8.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 60
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 0

      balanced_mid:
        rates:
          buy_price_per_block: 10.0
          sell_price_per_block: 6.0
        limits:
          cooldown_seconds: 10
          max_trades_per_hour: 30
          buy:
            min_blocks: 1
            max_blocks_per_trade: 5000
            max_blocks_per_day: 25000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 5000
            max_blocks_per_day: 15000
            max_money_per_day: 0.0
        fees:
          buy: { percent: 2.5, flat: 0.0 }
          sell: { percent: 5.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 30
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 0

      fast_large:
        rates:
          buy_price_per_block: 9.0
          sell_price_per_block: 6.5
        limits:
          cooldown_seconds: 5
          max_trades_per_hour: 60
          buy:
            min_blocks: 1
            max_blocks_per_trade: 10000
            max_blocks_per_day: 100000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 10000
            max_blocks_per_day: 75000
            max_money_per_day: 0.0
        fees:
          buy: { percent: 2.0, flat: 0.0 }
          sell: { percent: 4.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 10
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 25000


# ==============================================================================
# Group plots
# ==============================================================================
group_plots:
  # Shared plots owned by a named group with a pooled treasury. Members claim
  # together and pay upkeep from the group balance.
  enabled: true

  # Invites are intentionally local so players cannot mass-invite random users.
  invite_max_distance: 32.0

  # Minimum number of starter-eligible members required before a group can claim.
  min_members_to_claim: 2

  # Groups larger than this do not receive the free starter size bonus.
  max_members_for_free_bonus: 5

  starter:
    # 625 = 25 x 25 worth of area.
    base_area: 625

    # Additional free starter area per eligible member after the first.
    area_per_member: 225

    # Hard cap for the free starter area.
    max_area: 2500

    # Members must remain in the group this long before counting for free size.
    member_age_minutes: 30

    # Prevents leaders from instantly removing members after using starter sizing.
    removal_lock_minutes: 120

  economy:
    # Paid group claims use the shared treasury at this per-block rate.
    cost_per_block: 1.0

  notifications:
    enabled: true

    # Warn group members when treasury balance reaches or drops below this value.
    low_treasury_threshold: 250.0


# ==============================================================================
# Claim snapshots and rollback
# ==============================================================================
# Snapshot data is stored in plugins/AegisGuard/claim-snapshots.yml
# Claim snapshots always store plot records (owner, flags, members, bounds,
# guest passes, lockdown, alliance access, noticeboard).
# Optional WorldEdit/FAWE build copies live in plugins/AegisGuard/plot-backups/.
snapshots:
  enabled: true

  # Maximum snapshots kept in storage before older entries are pruned.
  max_snapshots: 100

  # Retention time in minutes. Set to 0 to keep snapshots until pruned by count.
  keep_minutes: 10080

  auto_snapshot:
    before_expansion: true
    # Auto-capture before Emergency Lockdown, Alliance Access changes,
    # staff Spawn destination changes, and destructive staff actions.
    before_lockdown: true
    before_alliance_access: true
    before_staff_destination: true
    before_destructive_staff: true

  scheduled:
    # Legacy all-at-once plot-data snapshots of server/spawn zones (not player homes).
    # Build copies follow build_backup below when that feature is on.
    # When automatic_player is enabled with include_server_zones, this legacy pass is
    # suppressed so two timers cannot snapshot the same server zone.
    enabled: false
    interval_minutes: 360
    targets: server_zones

  automatic_player:
    # Gradual player-plot and server-zone data backups. Disabled by default to preserve
    # existing cost/storage behavior. Server zones use the same bounded queue, change
    # detection, retention, TPS throttle, and Folia-safe region capture as player plots.
    enabled: false
    include_server_zones: true
    # Time between bounded batches, not between individual plots.
    interval_minutes: 5
    batch_size: 5
    # Even when a player plot or server zone changes repeatedly, do not retain a new
    # backup more often than this.
    minimum_backup_interval_minutes: 60
    # Canonical plot-data fingerprints avoid duplicate data-only snapshots.
    skip_unchanged: true
    retention_per_plot: 5
    # Set 0 to disable age-based automatic-backup retention.
    retention_days: 14
    # Pause a batch when the observed one-minute TPS is below this value.
    # Servers without a TPS API safely assume 20 TPS.
    pause_below_tps: 18.0
    eligibility:
      include_group_plots: true
      # Set 0 to include plots regardless of owner inactivity.
      max_owner_inactive_days: 30
      # Empty allowlist means all loaded worlds except those denied below.
      world_allowlist: []
      world_denylist: []
    build_backup:
      # Separate from manual build backups and deliberately disabled by default.
      # Build-enabled passes never use data-only change skipping because inventories and
      # other plugins can alter builds without a reliable block event.
      enabled: false

  # Require an explicit confirmation summary before restoring a snapshot.
  require_restore_confirmation: true

  restore:
    # When true (default), restoring MEMBERS_AND_ROLES merges snapshot members into
    # the live roster instead of wiping current trust. Set false for a full role revert.
    protect_roles: true
    # Rescue snapshots, duplicate prevention, maintenance locking, and restart pause are
    # mandatory safety behavior. This setting controls only build-rescue strictness.
    # If build backups are enabled, abort before mutation when the rescue build copy fails.
    require_build_rescue_when_enabled: true

  # Optional per-plot schematic backup (WorldEdit or FastAsyncWorldEdit).
  # Default off. Staff-only. Huge plots over max_volume skip the build copy.
  build_backup:
    enabled: false
    max_volume: 2000000
    # Standard servers handle at most this many chunks per checkpoint. Folia always
    # uses one chunk per owning-region task because its region ownership is dynamic.
    max_chunks_per_region_job: 4
    copy_entities: false
    folia:
      # Fail closed on Folia unless FAWE is enabled. Set false only after validating
      # the exact WorldEdit build on a staging Folia server.
      require_fawe: true
    storage:
      # Applies to build artifacts only; claim-data snapshots remain available.
      enforce_limits: true
      retention_per_plot: 10
      global_max_megabytes: 4096
      # quarantine moves unknown files into a recoverable folder; report_only leaves them in place.
      orphan_policy: "quarantine"
      warning_cooldown_minutes: 60

  admin_gui:
    human_readable_age: true
    items_per_page: 45
    show_reason: true

  logging:
    log_create: true
    log_rollback: true
    log_delete: true


# ==============================================================================
# Staff Audit Ledger (1.3.0+)
# ==============================================================================
# A single, central, staff-only record of high-impact administrative actions:
# snapshot restores, Doctor repairs, migrations, admin bypass toggles, and
# ClaimBlock adjustments. Stored in plugins/AegisGuard/audit-log.yml.
#
# This intentionally does NOT log ordinary player actions (claiming, trusting,
# chatting, etc.) or export to Discord. View it in-game with /agadmin audit.
audit:
  enabled: true

  # Maximum entries kept (in memory and on disk) for the /agadmin audit viewer.
  max_entries: 500

  # Entries older than this are pruned automatically. Set to 0 to disable
  # age-based pruning (max_entries still applies).
  retention_days: 90

  log_to_console: true


# ==============================================================================
# Temporary Guest Passes (1.3.0+, Milestone 2)
# ==============================================================================
# Owners can hand out short-lived access from the plot menu's "Guest Passes" button
# without granting a permanent role. Passes always expire automatically - even across
# a server restart - and revoking/expiring one never touches permanent roles/trust.
#
# Each pass can use real-time expiry (default: wall-clock, keeps ticking offline) or
# active playtime (remaining duration only decreases while the recipient is online).
guest_passes:
  enabled: true

  # Safety cap on how many passes can be active on a single plot at once.
  max_active_per_plot: 10

  # Longest duration (in minutes) an owner may choose, regardless of preset.
  # 10080 minutes = 7 days.
  max_duration_minutes: 10080

  # Duration options offered in the GUI, in minutes. Values above max_duration_minutes
  # are clamped automatically.
  duration_presets_minutes: [15, 30, 60, 120, 360, 720, 1440, 4320, 10080]


# ==============================================================================
# Emergency Plot Lockdown (1.3.0+, Milestone 3)
# ==============================================================================
# A fast, fully reversible safety switch for the plot owner (or elevated staff) during griefing,
# disputes, or maintenance. While active it overrides roles, Guest Passes, and the "public build"
# flag for every restricted action - but INTERACT (doors, buttons, levers) is never restrictable,
# so a player already inside a locked-down plot can always leave. Disabled by default is not an
# option here in the safety sense - it simply never activates on its own; an owner/staff member
# must explicitly flip it, and it never survives ownership transfer or role/pass deletion.
lockdown:
  enabled: true

  # Permission tokens this feature is allowed to restrict while a plot is locked down.
  # INTERACT is hard-coded as always-allowed in code and cannot be added here.
  restricted_permissions:
    - BUILD
    - BLOCK_BREAK
    - BLOCK_PLACE
    - CONTAINERS
    - REDSTONE
    - ANIMALS
    - VEHICLES
    - FARM
    - SHOP

  # Require an extra confirmation click before activating or deactivating from the GUI.
  require_confirmation: true

  # Soft lockdown restricts only these tokens (Full mode uses restricted_permissions above).
  soft_restricted_permissions:
    - BUILD
    - BLOCK_BREAK
    - BLOCK_PLACE
    - CONTAINERS


# ==============================================================================
# Expansion requests
# ==============================================================================
expansions:
  # Frontier Expansion requests: owners pay to grow a plot beyond its borders.
  enabled: true

  # QUEUE = admin approval required
  # INSTANT = auto-approved and recorded for audit
  approval_mode: QUEUE

  snapshots:
    # Auto-capture a claim-data snapshot before each approved expansion.
    enabled: true

  audit:
    enabled: true
    # Keep request outcomes visible in memory for this many minutes.
    keep_recent_minutes: 60
    include_in_admin_gui_history: true
    save_to_file: true
    log_to_console: true
    max_entries: 250

  approval:
    # Ping online staff when a new request enters the queue.
    notify_admins: true
    notify_permission: "aegis.admin"

    auto_when_no_reviewers:
      # If true, QUEUE mode can auto-approve valid requests only when no eligible
      # reviewers are online. Every unattended approval is still written to audit
      # history so staff can review it later in the admin GUI.
      enabled: false

      # Minimum number of eligible reviewers that must be online before requests
      # stay in the normal queue. If the online reviewer count is lower than this,
      # AegisGuard may use unattended approval.
      minimum_online_reviewers: 1

      # Permission used to count a player as an eligible reviewer. Admins detected
      # by the plugin are still treated as reviewers even if this permission is blank.
      reviewer_permission: "aegis.admin"

      # Optional safeguards for unattended approvals.
      # Set either value to 0 to disable that specific limit.
      max_cost: 0.0
      max_added_blocks: 0

  # Vault price per newly claimed block, multiplied each expansion.
  cost_per_block: 10.0
  cost_multiplier: 1.1
  # Absolute maximum Chebyshev radius a plot may ever reach through expansion.
  max_radius_global: 200
  # Required empty space (blocks) between the grown border and other claims.
  buffer_zone: 5

  # Deliberately slow endgame progression after completing Plot Level 30.
  # Renown cannot be purchased directly. It comes from approved expansion,
  # unique visitors, and first-time likes, all with anti-farming safeguards.
  horizons:
    enabled: true
    unlock_level: 30
    pulse_cooldown_seconds: 300
    # Applies only to the next awakened Horizon expansion. Ordinary Frontier
    # requests remain capped by expansions.max_radius_global.
    max_radius_global: 750

    renown:
      expansion_per_block: 0.05
      expansion_cap: 1500
      unique_visit: 15
      unique_visit_cooldown_days: 7
      unique_like: 75

    # Rank advancement awards a plot-bound Horizon Sigil. The owner must
    # activate it inside that plot before its abilities and expansion awaken.
    ranks:
      1:
        required_renown: 2500
        radius_gain: 60
        material: COPPER_BLOCK
      2:
        required_renown: 7500
        radius_gain: 75
        material: LAPIS_BLOCK
      3:
        required_renown: 17500
        radius_gain: 90
        material: AMETHYST_BLOCK
      4:
        required_renown: 35000
        radius_gain: 110
        material: DIAMOND_BLOCK
      5:
        required_renown: 60000
        radius_gain: 130
        material: NETHER_STAR


# ==============================================================================
# Zoning
# ==============================================================================
# Sub-regions inside a plot that can be listed for rent independently of a
# full-plot rental contract. Zone rentals use Vault and the Local Market /
# Zone Browse GUIs. They do not replace full_plot_renting below.
zoning:
  enabled: true
  # Soft cap on how many zones one plot may define.
  max_zones_per_plot: 10
  # Minimum footprint (blocks) for a newly created zone.
  min_zone_area: 9
  # Default listing price when an owner opens a zone for rent.
  default_rent_price: 100.0
  # GUI step when adjusting zone rent price up/down.
  rent_price_step: 50.0
  # Length of a new or extended zone rental term.
  default_rental_days: 7
  # Refundable security deposit charged with new zone rentals (0 = none).
  # Held via Territory Life and refunded on leave/transfer (or queued).
  default_deposit: 0.0
  maximum_deposit: 1000000.0
  # When false, owners cannot delete a zone that still has a tenant.
  allow_delete_while_rented: false
  # When true, the full rent payment goes to the owner (or group treasury).
  landlord_gets_full_rent: true

# ==============================================================================
# Full-plot renting
# ==============================================================================
# Full-plot rental listings (/ag rent, /ag unrent, market confirm GUI, My Rentals).
# Renters receive only the permissions listed here; owners retain management control.
# Deposits are refundable per Territory Life contract rules.
full_plot_renting:
  enabled: true
  auto_renew:
    enabled: true
  # Default contract term (days) when an owner omits an explicit term.
  duration_days: 7
  # Longest owner-selectable contract term.
  maximum_duration_days: 90
  # Hours before expiry when the renter receives a reminder.
  reminder_hours: 24
  # Hard safety cap for refundable deposits.
  maximum_deposit: 1000000.0
  # When true, owners may end active contracts early (deposit still refunded).
  allow_owner_early_cancel: false
  minimum_price: 1.0
  maximum_price: 1000000000.0
  # Renter-side anti-abuse limit across all plots.
  max_active_rentals_per_player: 3
  renter_permissions:
    - BUILD
    - BLOCK_BREAK
    - BLOCK_PLACE
    - INTERACT
    - CONTAINERS
    - REDSTONE
    - ANIMALS
    - VEHICLES

# ==============================================================================
# Plot discovery (Atlas / Discover)
# ==============================================================================
# Public territory discovery, favorites, featured destinations, and visit counts.
plot_discovery:
  enabled: true
  # Safety cap on how many public plots a single browse page may return.
  max_results: 500
  # Categories owners may tag their plot with; shown as filter chips in GUIs.
  categories:
    - build
    - shop
    - town
    - farm
    - event
    - other

# ==============================================================================
# Territory activity ledger
# ==============================================================================
# Durable owner/admin history of territory events. Oldest entries are removed
# after this global cap.
territory_activity:
  enabled: true
  # Global entry cap across all plots before oldest entries are pruned.
  max_entries: 5000
  # Also log every visit (noisy on busy servers; off by default).
  log_visits: false

# Realm Profiles & Noticeboards (1.3.0+, Milestone 4). Gives every plot's existing name,
# description, category, and entry greeting a single home in the Realm Profile GUI, plus a
# short owner-moderated noticeboard for rules, event details, shop info, or announcements.
# Never replaces an existing plot name, description, or greeting automatically.
realm_profiles:
  # The per-plot profile page: display name, description, category, greeting,
  # and the noticeboard below.
  enabled: true

  noticeboard:
    # Owner-moderated short notes shown to visitors (rules, shop info, events).
    enabled: true
    # Maximum number of notices kept per plot. Oldest notice is dropped once a new one
    # would exceed this limit.
    max_entries: 8
    # Maximum characters allowed per notice.
    max_length: 200


# ==============================================================================
# Clearer Player Guidance (1.3.0+, Milestone 5)
# ==============================================================================
# An optional, skippable, and always-replayable two-page walkthrough shown once, a few seconds
# after a player's first-ever claim. Never blocks or delays the claim itself, never repeats
# automatically once shown, and is always reachable again via /ag guide or the "Replay
# Walkthrough" button in Settings.
first_claim_walkthrough:
  # Shows the once-ever onboarding guide a few seconds after a first claim.
  enabled: true


# ==============================================================================
# Routes and Checkpoints (1.3.0+, Milestone 6)
# ==============================================================================
# Staff-authored named routes with ordered checkpoints. Players browse routes,
# see the next destination, and optionally earn small completion rewards by
# walking near checkpoints. Never forces teleports or alters claim boundaries.
routes:
  enabled: true
  # Distance (blocks) within which a checkpoint counts as reached.
  default_checkpoint_radius: 4.0
  # When true, the route detail screen offers an optional teleport to the next
  # checkpoint. Discovery itself never requires teleporting.
  allow_optional_teleport: false
  guidance:
    # Direction helpers while a player follows a route.
    enabled: true
    # Particle trail toward the next checkpoint.
    particles: true
    # Action-bar distance/direction readout.
    action_bar: true
  rewards:
    # Small completion rewards when a player finishes a route.
    enabled: true


# ==============================================================================
# Safe Travel and Cooldowns (1.3.0+)
# ==============================================================================
# Shared safety gate for Travel, Routes, checkpoints, plot visits, markets,
# zones, Spawn, and staff destinations. Defaults preserve existing behavior:
# no cooldown, no confirmation click, and no combat block. Safe-search radius
# matches the historical 4-block TeleportUtil search.
#
# This is NOT the same as claims.travel_system (legacy enable flags for the
# Travel/Visit menus and home/visit teleports). Keep both aligned when you
# want Travel fully off: set claims.travel_system.enabled false and optionally
# travel.enabled false.
travel:
  enabled: true

  # Seconds between voluntary teleports. 0 = no cooldown (legacy behavior).
  cooldown_seconds: 0

  # When true, the player must confirm (second click/command) before teleporting.
  require_confirmation: false
  confirmation_seconds: 10

  # When true, recent combat blocks voluntary travel until the tag expires.
  block_while_in_combat: false
  combat_tag_seconds: 10

  # Chebyshev radius used when searching for a standable block near a destination.
  safe_search_radius: 4

  # When false (default), staff destination teleports skip cooldown/confirm/combat.
  apply_to_staff: false

  # Honor aegis.admin.bypass / OP for voluntary travel guards.
  honor_bypass_permission: true


# ==============================================================================
# Teleport Beacons (1.3.5+, Travel Atlas arrival choice 1.4.0+)
# ==============================================================================
# Beacons are pad-to-pad travel. In 1.4 each plot owner chooses how their public
# listings (Visit Discover/Warps, auction visit, market jump) let visitors land:
#   * classic - Safe Travel to the plot spawn / listing point (1.3.0 style)
#   * beacon  - visitors MUST land on a public arrival pad; if none exists the
#               trip fails closed (never a silent fallback)
# Existing plots default to classic, so turning 1.4 on never suddenly gates old
# servers on pads. Owners opt into beacon arrival per plot.
# /ag home always stays personal plot spawn regardless of this setting.
# Set modules.teleport_beacons (and teleport_beacons.enabled) false to hide pad
# tools entirely.
teleport_beacons:
  enabled: true
  # Network-wide override. When true, every public listing behaves as if its
  # owner chose beacon arrival (1.3.5-style mandatory pads). Default false so the
  # per-plot owner choice above is respected.
  force_public_arrival: false
  # When true, travelers may pick classic vs beacon on plots whose owner allowed it.
  # force_public_arrival always wins. Beacon still requires a public pad.
  allow_traveler_override: true
  # Pads a single player plot may hold.
  max_per_plot: 3
  # Higher cap for staff-owned server zones (hubs, spawn).
  max_per_server_zone: 8
  # How close (blocks) a player must stand to a pad for it to trigger.
  stand_radius: 1.6
  # How long (seconds) a player must linger near a linked pad before the stand
  # confirm opens, and the minimum gap between repeat prompts. Raised from the
  # old 2.5s so a quick walk-over no longer pops the menu. Owners can raise it.
  prompt_cooldown_seconds: 7
  # One create wizard at a time; minimum gap (seconds) between sneak-binding new
  # pads so a manager cannot spam duplicate rows.
  create_cooldown_seconds: 8
  # Remote travel straight from the atlas "My Beacons" list (right-click a pad):
  #   manage - only pads the player may manage
  #   public - own pads plus any enabled public pad
  #   off    - list is manage-only; travel still requires standing on a pad
  gui_travel: public
  # Actionbar hint when a manager right-clicks an unbound pad block in a claim.
  bind_hint: true
  # Hand players placeable pads from /ag beacon give or the manager button.
  # They may still place any pad_materials block they already have.
  give_starter_pads: true
  starter_pad_material: LODESTONE
  starter_pad_amount: 2
  give_cooldown_seconds: 120
  pad_materials:
    - LODESTONE
    - END_PORTAL_FRAME
    - BEACON
    - CRYING_OBSIDIAN
    - SEA_LANTERN
    - GOLD_BLOCK

  # How (or whether) beacon trips cost money / ClaimBlocks.
  # mode:
  #   owner_choice - each pad owner sets a fee, or leaves it free (default)
  #   always       - every trip uses always_vault_cost / always_claim_block_cost
  #   off          - nobody is charged, player fee buttons are hidden
  charges:
    mode: owner_choice
    allow_vault: true
    allow_claim_blocks: true
    # When true, collected fees go to the plot owner as a maintenance tip.
    # When false, the traveler still pays but the money is not deposited to anyone.
    pay_plot_owner: true
    exempt_managers: true
    exempt_admins: true
    max_vault_cost: 10000.0
    max_claim_block_cost: 500
    always_vault_cost: 0.0
    always_claim_block_cost: 0


# ==============================================================================
# Aegis Frequency (1.4.0+)
# ==============================================================================
# Same-server private chat for plot members. /ag chat toggles Frequency for the
# claim you are standing in; chat then stays on that plot even if you walk away.
# Guests and alliance-only visitors are not on the channel. Cross-server
# Frequency remains a 2.0 network feature.
plot_chat:
  enabled: true
  # Maximum characters per Frequency message.
  max_message_length: 256

# ==============================================================================
# Alliance chat
# ==============================================================================
# Same-server alliance member radio. Reuses plot_chat.max_message_length.
# Cross-server relay is governed by network.chat.relay_channels.
alliance_chat:
  enabled: true

# ==============================================================================
# Group chat
# ==============================================================================
# Same-server group member radio. Reuses plot_chat.max_message_length.
# Cross-server relay is governed by network.chat.relay_channels.
group_chat:
  enabled: true

# ==============================================================================
# Staff chat
# ==============================================================================
# Same-server staff radio. Reuses plot_chat.max_message_length.
# Cross-server relay is governed by network.chat.relay_channels.
staff_chat:
  enabled: true



# ==============================================================================
# Visual Presence (1.4.0+)
# ==============================================================================
# Optional entry titles (owner + plot name), for-sale labels, and scepter
# border direction labels. Uses titles and action bars only; no hologram
# entities are spawned, so Paper and Folia stay compatible.
visual_presence:
  enabled: true
  # Big title + owner name shown when a player walks into a plot.
  holographic_entry: true
  # On-market plots show a floating "For Sale" label in chat/title context.
  for_sale_labels: true
  # The wand/scepter shows which direction the claim border lies.
  smart_borders: true
  # Distance (blocks) border direction labels remain visible around the player.
  border_label_distance: 3


# ==============================================================================
# Scepter / wand claim-border visualization
# ==============================================================================
# If ProtocolLib is installed, AegisGuard can send fake block-change packets only
# to the player holding the wand, producing a solid visible border without
# particles or real block edits. The fallback is per-player particles.
visualization:
  # Particle used for claim borders when ProtocolLib is absent or disabled.
  particle: FLAME
  protocol_lib:
    # Send fake block-change packets so the wand holder sees a solid border.
    enabled: true
    # Fake-block material drawn along the border.
    material: LIME_STAINED_GLASS
    # Vertical offset applied to the fake border blocks.
    y_offset: 0


# ==============================================================================
# Alliance Access (1.3.0+, Milestone 7)
# ==============================================================================
# Player alliances are completely separate from plot ownership, money, rentals,
# and administration. Membership alone grants nothing. Each plot must opt in
# via its six Alliance Access toggles (all default OFF).
alliance_access:
  # Friend networks between players; plots opt in via six per-plot toggles.
  enabled: true
  # Maximum members one alliance may hold.
  max_members: 20

  # Pending invites older than this many minutes are ignored and pruned.
  # 0 keeps invites indefinitely (legacy behavior).
  invite_expire_minutes: 0

  # Server-wide guardrails. When true, owners cannot enable that risky toggle.
  # All default false so existing Alliance Access options remain available.
  disallow:
    enter: false
    interact: false
    containers: false
    build: false
    animals: false
    vehicles: false
    friendly_pvp: false


# ==============================================================================
# Local Market Hub
# ==============================================================================
market_hub:
  # The per-plot market menu: rentals, shop access, and external shop bridges
  # reachable from one button when standing in a plot.
  enabled: true

  # When true, the main Market button opens the plot's local market hub first
  # whenever the player is standing in a plot that has rentals, shop access, or
  # linked external market integrations. Players can still use /ag market global.
  prefer_local_when_in_plot: true

  # Allows ordinary player plots to expose local market tools, not just
  # designated server market zones.
  allow_home_markets: true

  # If true, external bridge buttons only become usable when the plot has
  # Shop Interact enabled in the Plot Flags GUI.
  require_shop_flag_for_external_bridges: true

  external_bridges:
    enabled: true

    # Optional third-party market/shop integrations.
    # These do not hard-depend on any one plugin API. Instead, AegisGuard checks
    # whether the named plugin is installed and then opens the configured command
    # from the local market hub. Built-in TradeStalls remain the default shop
    # system (market_stalls.enabled: true). Bridges are discovery shortcuts, not
    # a second checkout.
    #
    # Supported placeholders inside commands:
    # {player} {plot_owner} {plot_name} {plot_id} {world} {x} {y} {z}
    #
    # Prefix commands with:
    # - player:  run as the clicking player
    # - console: run from console
    #
    # Example — add one entry per plugin you want shown on Local Market:
    # entries:
    #   quickshop:
    #     plugin: "QuickShop"
    #     display_name: "&aQuickShop"
    #     icon: "CHEST"
    #     requires_shop_flag: true
    #     lore:
    #       - "&7Open QuickShop tools for"
    #       - "&7this plot."
    #     commands:
    #       - "player:qs find"
    #   chestshop:
    #     plugin: "ChestShop"
    #     display_name: "&aChestShop"
    #     icon: "OAK_SIGN"
    #     commands:
    #       - "player:chestshop"
    #   shopkeepers:
    #     plugin: "Shopkeepers"
    #     display_name: "&aShopkeepers"
    #     icon: "VILLAGER_SPAWN_EGG"
    #     commands:
    #       - "player:shopkeeper"
    #   excellentshop:
    #     plugin: "ExcellentShop"
    #     display_name: "&aExcellentShop"
    #     icon: "EMERALD"
    #     commands:
    #       - "player:eshop"
    entries: {}


# ==============================================================================
# TradeStalls
# ==============================================================================
market_stalls:
  # Enables built-in TradeStalls for local market plots.
  enabled: true

  integration:
    # How AegisGuard should behave when external market/shop bridges are active.
    #
    # COEXIST (default):
    #   TradeStalls and external bridges can both be used together.
    #   Players are only charged by the shop they actually open — AegisGuard
    #   does not double-charge a bridged third-party purchase.
    #
    # DISABLE_ON_BRIDGED_PLOTS:
    #   If a plot has an active external market bridge, TradeStalls are hidden
    #   and blocked on that plot so the external plugin takes priority there.
    #
    # DISABLE_GLOBALLY_IF_EXTERNAL_AVAILABLE:
    #   If any configured external bridge plugin is installed, TradeStalls are
    #   disabled server-wide until that external integration is removed.
    mode: COEXIST

  # Require the plot's Shop Interact flag before public stall browsing works.
  require_shop_flag: true

  # Allow players renting a sub-zone to register a stall inside their rented
  # space without needing full plot ownership.
  allow_zone_renters: true

  currencies:
    # Payment methods stalls may price items in.
    vault_enabled: true
    claim_blocks_enabled: true
    # Pre-selected currency on new stall listings.
    default: VAULT

  pricing:
    # Items sold per purchase click by default, and the largest bundle allowed.
    default_bundle_size: 1
    max_bundle_size: 64


# ==============================================================================
# Plot leveling
# ==============================================================================
leveling:
  enabled: true

  # Vault cost for level 2; each further level multiplies the previous price.
  base_cost: 1000.0
  cost_multiplier: 1.5
  # Level cap. Level 30 unlocks Horizon renown progression (expansions.horizons).
  max_level: 30

  # When true, leveling also grows the plot borders by expansion_amount.
  expand_plot_on_levelup: false
  expansion_amount: 5

  disciplines:
    # A plot may specialize in one restrained utility discipline. The first
    # choice is immediate; later changes use this cooldown.
    change_cooldown_days: 7

  upgrades:
    # Show a Vault-money upgrade option when supported.
    allow_vault_payment: true

    # Show a ClaimBlocks upgrade option when supported.
    allow_block_payment: true

    # If Vault is unavailable, use ClaimBlocks where possible.
    fallback_to_blocks_if_vault_unavailable: true

    # Cost to upgrade into each level using ClaimBlocks.
    blocks_costs:
      2: 750
      3: 2000
      4: 3750
      5: 6000
      6: 8750
      7: 12000
