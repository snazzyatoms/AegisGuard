# ==============================================================================
# Arena / Dungeon / Mob-Run Module (1.3.0+, optional)
# ==============================================================================
# Cooperative PvE party dungeons on protected server plots. On by default;
# set false to disable. ProtectionPreset.ARENA is only a flag bundle — this
# module is separate.
arena:
  enabled: true
  # Seconds a disconnected player's slot stays reserved in a live run.
  disconnect_grace_seconds: 60
  # Allow joining a run after it has already started.
  allow_late_join: false
  party:
    # Seconds a party invite remains answerable.
    invite_expire_seconds: 60
    # Default party size bounds for new runs.
    default_min_players: 1
    default_max_players: 4
    # Reserve/transfer party leadership around disconnects.
    leadership_reserve_during_grace: true
    leadership_transfer_after_grace: true
  totem:
    # Totem of Undying handling inside runs: CONSUME_AND_ELIMINATE burns the
    # totem and still counts the player downed; other modes allow carrying on.
    default_policy: CONSUME_AND_ELIMINATE
  scaling:
    # Lock difficulty scaling to the roster present at run start.
    lock_at_run_start: true
    # Re-scale difficulty if the party size changes mid-run.
    dynamic_mid_run: false
  rewards:
    # MVP model: EQUAL_MILESTONE_PLUS_SCORE_BONUS splits evenly then adds a
    # score-weighted bonus on top.
    mvp_model: EQUAL_MILESTONE_PLUS_SCORE_BONUS
    # Fraction of the run a player must be present for to earn rewards.
    presence_min_ratio: 0.5
    enabled: true
  defaults:
    # Runs allowed simultaneously per arena.
    max_active_runs_per_arena: 1
  limits:
    # Hard global caps protecting the server from runaway arena load.
    max_active_arenas: 16
    max_active_runs: 8
    max_players_per_run: 8
    max_mobs_per_run: 64
    max_projectiles_per_run: 128
    max_boss_minions_per_run: 16
    max_loaded_chunks_per_run: 24
    # Ticks allowed for post-run cleanup before it is force-finished.
    cleanup_timeout_ticks: 200
    # Consecutive failures before an arena auto-disables for staff review.
    auto_disable_after_failures: 3
  persistence:
    # Rolling state backups kept per arena for recovery.
    backup_count: 5
    # Days a closed run's record is kept before archival.
    archive_closed_runs_after_days: 14
  inventory:
    # SAVE_AND_RESTORE returns player inventories after a PvE run.
    default_policy_pve: SAVE_AND_RESTORE
    allow_drop_on_death: false
  pvp:
    # PvP inside arena runs (off by default — arenas are cooperative PvE).
    enabled: false
  hooks:
    # Spawn boss/mob packs from MythicMobs when installed.
    mythicmobs: false
  presets:
    lava_dungeon:
      enabled: true
      min_players: 1
      max_players: 4
      totem_policy: CONSUME_AND_ELIMINATE
