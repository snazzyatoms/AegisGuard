# ==============================================================================
# Plot upkeep
# ==============================================================================
# Plot upkeep is on by default; set false to disable recurring plot taxes.
upkeep:
  enabled: true
  # How often the upkeep collector runs.
  check_interval_hours: 24
  # Vault amount charged per plot per collection.
  cost_per_plot: 50.0
  # Days a plot may miss payments before penalties apply.
  grace_period_days: 7

  # If true, plots can be unclaimed automatically after failed payments and grace.
  unclaim_on_fail: false

  notifications:
    enabled: true


# ==============================================================================
# Auctions
# ==============================================================================
# Canonical key: auction.enabled
# Accepted aliases when reading the main menu button:
#   auctions.enabled
#   market.auctions.enabled
# (Independent of upkeep.enabled.)
auction:
  enabled: true
  # Default auction length (days) when a plot is listed.
  duration_days: 3
  # Minimum raise each new bid must add.
  min_bid_increase: 50.0
  # Share of the winning bid paid to the seller; the rest is the house fee.
  owner_cut_percent: 50


# ==============================================================================
# Wilderness revert
# ==============================================================================
wilderness_revert:
  # Disabled by default. Enable only if the owner wants it AND storage is SQL.
  # YAML storage does nothing (no-op). SQL being on does not enable this.
  enabled: false
  # Age (hours) a wilderness block-change log entry must reach before the
  # original block is restored.
  revert_after_hours: 2
  # Primary scheduler key for 1.2.7+. Older installs may still use
  # check_interval_minutes and will continue to work.
  interval_seconds: 600
  # Blocks restored per tick batch — keeps lag off the main thread.
  revert_batch_size: 500


# ==============================================================================
# Default claim protections and flags
# ==============================================================================
# These are the defaults applied to newly created plots unless changed later.
protections:
  pvp_protection: true     # Prevent PvP inside plots by default.
  no_mobs_in_claims: true  # Suppress hostile mob presence in claims where supported.
  # Chests, barrels, and other storage locked to trusted roles.
  container_protection: true
  # Taming, damaging, and interacting with owned pets restricted.
  pets_protection: true
  # Item frames, armor stands, paintings, and other entities protected.
  entities_protection: true
  # Crop trampling and farmland damage restricted.
  farm_protection: true
  # TNT and other explosions cannot damage blocks inside claims.
  tnt-damage: true
  # Fire cannot spread into or inside claims.
  fire-spread: true
  # Pistons cannot push or pull blocks across claim borders.
  piston-use: true
  # Block water/lava/dragon-egg flow across claim borders (BlockFromTo).
  # Also blocks dispensers injecting liquid sources into claims, and seeds the
  # player-facing liquid-flow plot flag on new claims.
  liquid_flow: true

  # Staff grief-attempt alerts: after this many denied protection actions on the
  # same claim inside the window, online staff with aegis.admin.alerts (or
  # aegis.admin) get one rate-limited notification. Set threshold to 0 to disable.
  grief_alert_threshold: 12
  grief_alert_window_seconds: 60
  grief_alert_cooldown_seconds: 120

  # Vanilla gamerule-style mob griefing: endermen, sheep, snow golems, ravagers,
  # zombies breaking doors, frost walker, falling blocks, wither, silverfish,
  # turtle-egg trample. Also blocks dispenser bonemeal spread across borders.
  mob_griefing: true

  # Non-container interactables (cake, bells, jukeboxes, note blocks, candles,
  # flower pots, decorated pots, composters, cauldrons, lecterns, chiseled
  # bookshelves, campfires, beehives) inside claims.
  interactables: true

  # 1.3.0 hero-pack ward defaults (GREEN=protected). Missing keys on existing
  # plots still default protected in ProtectionManager.isFlagEnabled.
  doors: true
  hopper_pipe: true
  teleport_ward: true
  storm_ward: true
  decor: true

  # Plot flag defaults.
  safe_zone: true
  fly: false
  entry: true
  shop-interact: false

  # Server-plot sanctuary (spawn-style). Off by default so existing server
  # plots keep current damage and hunger. Staff with manage/steward on that
  # plot can toggle these in Claim Settings → Safety. Player plots ignore them.
  keep_health: false
  keep_hunger: false
  keep_xp: false
  keep_inventory: false

  # Hearth seals public chat to the room you are standing in. A room is a
  # 3D subplot/zone, or the rest of the plot if you are not in a zone.
  # Off by default. Player and server plots can toggle it in Safety.
  # Staff with aegis.admin.hearth still hear every room.
  hearth: false

# ==============================================================================
# Hearth + Simple Voice Chat (optional). AegisGuard loads this only when the
# voicechat plugin is installed. Isolated groups match Hearth rooms.
# ==============================================================================
hearth:
  # When true, links into Simple Voice Chat so players in the same Hearth room
  # are grouped into a shared proximity channel.
  voicechat: true
  # Also move players out of any voice group they joined themselves. Off by
  # default — leave false to let players keep manual voice groups.
  voicechat_override_player_groups: false

# ==============================================================================
# Temporary flight skill (staff grant). Plot flight still unlocks at Ascension 30.
# Hub Safety never grants flight.
# ==============================================================================
flight_skill:
  enabled: true
  # Staff with aegis.admin.fly fly indefinitely without consuming a grant.
  staff_always: true
  # Seconds granted when no duration is specified, and the maximum allowed.
  default_seconds: 300
  max_seconds: 3600

# ==============================================================================
# Staff season overlay for Atlas Discover and Routes
# ==============================================================================
seasons:
  # Seasonal staff overlay: a themed title plus featured plots and routes.
  enabled: true
  # Featured pins shown at once in Atlas Discover and the Routes list.
  max_featured_plots: 5
  max_featured_routes: 5


# ==============================================================================
# Active mob barrier
# ==============================================================================
mob_barrier:
  enabled: true
  # Paper, Purpur, and Folia block hostile movement at protected borders.
  # Spigot uses targeting protection plus the periodic cleanup fallback.
  block_boundary_entry: true
  # Hostiles already inside protected land cannot target or damage players
  # and are removed after this grace period if they remain inside.
  despawn_grace_seconds: 5
  # Primary scheduler key for 1.2.7+. Older installs may still use
  # check_interval_ticks and will continue to work.
  interval_seconds: 3
  # Extra cleanup pass while a player is standing inside a mob-protected plot.
  player_cleanup_interval_seconds: 2
  # Keep particle volume low by default for busy servers.
  remove_particles: true
  low_particle_mode: true

  # Categories affected by border/cleanup protection. Hostiles stay on by default.
  protect_hostile: true
  protect_passive: false
  protect_boss: false

  # Optional per-world overrides. Omit a world to inherit the global values.
  # Example:
  # per_world:
  #   world_nether:
  #     enabled: false
  #   world:
  #     protect_passive: true
  per_world: {}

  # Staff diagnostics: when true, /agadmin health reports why mob protection applied.
  staff_diagnostics: true


# ==============================================================================
# Cosmetics
# ==============================================================================
cosmetics:
  enabled: true

  # Purchasable border particle styles. Each entry: material (GUI icon),
  # particle (Bukkit particle name), display-name, price (Vault).
  border_particles:
    flame:
      material: BLAZE_POWDER
      particle: FLAME
      display-name: "&6Flame Border"
      price: 1000.0
    heart:
      material: POPPY
      particle: HEART
      display-name: "&cHeart Border"
      price: 2500.0
    soul:
      material: SOUL_SAND
      particle: SOUL_FIRE_FLAME
      display-name: "&bSoul Flame Border"
      price: 5000.0
    enchant:
      material: ENCHANTING_TABLE
      particle: ENCHANTMENT_TABLE
      display-name: "&dEnchantment Border"
      price: 3000.0

  # Cosmetic effects played when a player enters a plot. Each entry:
  # sound (Bukkit sound name) + particle (Bukkit particle name).
  entry_effects:
    lightning:
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      particle: FLASH


# ==============================================================================
# Entry and exit notifications
# ==============================================================================
titles:
  claim_enter_exit:
    enabled: true

    # Modes: PER_PLAYER, FORCE_ON, FORCE_OFF
    mode: PER_PLAYER

    # Leave blank to allow everyone, or set a permission to restrict access.
    required_permission: ''

    # Players may toggle their own setting only when mode is PER_PLAYER.
    allow_player_toggle: true
    default_player_setting: true
    toggle_permission: 'aegis.notify'

    # Players with this permission still receive notices when mode is FORCE_OFF.
    bypass_permission: 'aegis.notify.bypass'

    show_titles: true
    show_chat: true
    show_enter: true
    show_exit: true

    # Timing values use ticks. 20 ticks = 1 second.
    notification_location: ACTION_BAR
    fade_in: 10
    stay: 40
    fade_out: 10


# ==============================================================================
# Unstuck command
# ==============================================================================
unstuck:
  enabled: true
  # Seconds the player must stand still before the escape teleport fires.
  warmup_seconds: 5
  # Seconds between /ag unstuck uses.
  cooldown_seconds: 300


# ==============================================================================
# Biome changing
# ==============================================================================
biomes:
  enabled: true
  # Vault price per biome change.
  cost_per_change: 2000.0
  # Biome names owners may pick from (Bukkit biome enum names).
  allowed:
    - PLAINS
    - FOREST
    - DESERT
    - JUNGLE
    - TAIGA
    - SWAMP
    - CHERRY_GROVE
    - BADLANDS
    - MUSHROOM_FIELDS
    - MEADOW
    - LUSH_CAVES


# ==============================================================================
# Social features
# ==============================================================================
social:
  # Let visitors "like" public plots (powers Discovery popularity sorting).
  likes_enabled: true
  # A player may like a given plot only once.
  one_like_per_player: true


# ==============================================================================
# Admin tools and staff access
# ==============================================================================
admin:
  # When true, banned players' claims are removed automatically on ban.
  auto_remove_banned: false
  # Staff with admin permission may exceed max_claims_per_player.
  bypass_claim_limit: false
  # Echo staff actions (claim edits, repairs) to other online admins.
  broadcast_admin_actions: true
  # Staff plots may ignore claim count limits entirely.
  unlimited_plots: true
  # Server operators are treated as trusted on every plot.
  trust_operators: true
  # Safety cap for one /agadmin blocks adjustment.
  max_claimblock_adjustment: 1000000000

  wand:
    material: BLAZE_ROD
    name: "&c&lSentinel's Scepter"
    # Opens Claim Settings after wand create OR convert-to-server (shared stewardship pipeline).
    open_settings_after_claim: true
    lore:
      - "&7A tool of absolute authority."
      - " "
      - "&eRight-Click: &fSelect Pos 1"
      - "&eLeft-Click: &fSelect Pos 2"
      - " "
      - "&cCreates server zones directly."


# ------------------------------------------------------------------------------
# Staff permission mapping
# ------------------------------------------------------------------------------
staff_access:
  # Any permission in one of these lists grants the matching elevated access.
  # Server zones do NOT treat blanket aegis.admin / isAdmin as enough by itself —
  # staff need a node from server_zone_manage_permissions (aegis.admin already
  # inherits aegis.serverzone.manage), or the Steward plot role on that zone.
  # Trusted operators (admin.trust_operators) still manage server zones.
  # Emergency: aegis.bypass or /agadmin bypass.
  global_manage_permissions:
    - "aegis.admin.manage"
  server_zone_manage_permissions:
    - "aegis.serverzone.manage"
    - "aegis.staff.co_owner"
  market_plot_manage_permissions:
    - "aegis.market.manage"
    - "aegis.staff.market_steward"


# ==============================================================================
# Sound scheme
# ==============================================================================
sounds:
  # Master switch for every plugin sound below. Player opt-outs still apply.
  global_enabled: true
  # Per-player overrides are stored here automatically.
  players: {}

  # Menu feedback sounds. Each entry: sound (Bukkit sound), volume, pitch.
  menu_open:
    sound: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.0

  menu_flip:
    sound: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

  menu_close:
    sound: BLOCK_CHEST_CLOSE
    volume: 0.7
    pitch: 1.0

  confirm:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.7
    pitch: 1.2

  error:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8

  claim_success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2

  unclaim:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 0.9


# ==============================================================================
# Protection deny feedback
# ==============================================================================
protection_effects:
  # Plays a sound/particle when a player is denied by plot protection.
  enabled: true

  # Sound + particle used when a deny category has no override below.
  defaults:
    deny_sound: BLOCK_NOTE_BLOCK_BASS
    deny_particle: SMOKE_NORMAL
    deny_volume: 1.0
    deny_pitch: 1.0

  pvp:
    deny_sound: ENTITY_ENDERMAN_TELEPORT
    deny_particle: REDSTONE
  containers:
    deny_sound: BLOCK_CHEST_LOCKED
    deny_particle: CRIT
  mobs:
    deny_sound: ENTITY_ZOMBIE_ATTACK_IRON_DOOR
    deny_particle: FLAME
  pets:
    deny_sound: ENTITY_CAT_HISS
    deny_particle: HEART
  entities:
    deny_sound: BLOCK_ANVIL_PLACE
    deny_particle: CRIT_MAGIC
  farm:
    deny_sound: BLOCK_CROP_BREAK
    deny_particle: VILLAGER_ANGRY


# ==============================================================================
# Role management
# ==============================================================================
# Server-wide role catalog used by RolesGUI. Owners assign these role IDs to
# members; optional plot-local nicknames are display-only labels.
#
# icon       : Material shown in GUIs
# name       : Display name shown to players
# priority   : Higher values represent stronger roles
# permissions: Internal role capabilities used by AegisGuard
#
# Notes:
# - owner is not assignable through RolesGUI (ownership is separate).
# - trusted is a member-like access tier kept for plots that already used it.
# - co_owner includes MANAGE_MEMBERS so they can invite/remove trusted players.
# - Plot capacity (maxMembers) is enforced when adding a new trusted member.
roles:
  owner:
    name: "&cOwner"
    icon: NETHERITE_HELMET
    priority: 100
    permissions: ["ALL"]

  co_owner:
    name: "&6Co-Owner"
    icon: GOLDEN_HELMET
    priority: 90
    permissions: ["MANAGE", "MANAGE_MEMBERS", "BLOCK_BREAK", "BLOCK_PLACE", "CONTAINERS", "INTERACT", "SHOP", "FARM", "REDSTONE", "ANIMALS"]

