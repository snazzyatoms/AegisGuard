codex_root_welcome_lore:
- '&7Ouvrez n''importe quel chapitre ci-dessous pour lire un'
- '&7guide ciblé pour les réclamations, les voyages,'
- '&7sécurité, économie et plus encore.'
- ' '
- '&eChaque chapitre ouvre son propre menu d''aide.'
codex_claim_lore:
- '&7Apprenez à revendiquer des terres,'
- '&7sélectionnez les coins et créez'
- '&7réclamations de groupe partagées.'
codex_travel_lore:
- '&7Examiner les maisons, spawn de parcelles,'
- '&7visite voyage, et serveur'
- 'Mouvement de style chaîne &7.'
codex_menus_lore:
- '&7Découvrez ce que chaque spécialité'
- 'Le menu &7AegisGuard fait et'
- '&7où gérer votre parcelle.'
codex_security_lore:
- '&7Voir comment la confiance, les interdictions,'
- '&7drapeaux et règles de protection'
- '&7gardez votre terrain en sécurité.'
codex_economy_lore:
- '&7En savoir plus sur ClaimBlocks,'
- '⟦0000⟧entretien, frais d''agrandissement,'
- '&7et systèmes de marché.'
codex_identity_lore:
- '&7Personnalisez les noms de parcelles,'
- '&7descriptions, cosmétiques,'
- '&7et présentation.'
codex_advanced_lore:
- '&7Explorez le nivellement, les zones,'
- '&7locations, TradeStalls, et'
- '&7autres systèmes avancés.'
codex_start_menu_lore:
- '&7Utilisez le menu &b/ag &7pour ouvrir le'
- '&7AegisGuard panneau de commande à tout moment.'
- ' '
- '&7Ce menu est votre itinéraire le plus rapide vers'
- '&7paramètres, déplacements, marchés, mise à niveau,'
- '&7le codex et la plupart des outils quotidiens.'
codex_start_wand_lore:
- '&7Utilisez la baguette &b/ag &7pour recevoir le'
- '&7Aegis Scepter pour la sélection des terrains.'
- ' '
- '&7Cliquez avec le bouton droit sur le premier bloc de coin.'
- '&7Cliquez avec le bouton gauche sur le bloc de coin opposé.'
codex_start_claim_lore:
- '&7Après avoir sélectionné les deux coins, utilisez'
- '&b/ag réclamez &7pour créer votre parcelle.'
- ' '
- '&7Le plugin vérifie le chevauchement, le monde'
- '&7limites et coûts requis avant'
- '&7confirmant le terrain.'
codex_start_group_lore:
- '&7Envie d''un terrain partagé ? Créer un groupe avec'
- 'Le groupe &b/ag crée d''abord <nom>&7.'
- ' '
- '&7Invitez des joueurs, financez la trésorerie,'
- '&7puis utilisez &b/ag group claims&7 lorsque'
- '&7votre équipe est prête.'
codex_start_travel_lore:
- '&7Utilisez &b/ag home &7pour revenir à votre'
- '&7plot et &b/ag visitez &7pour atteindre les sites de confiance'
- '&7ou destinations répertoriées par le serveur.'
- ' '
- '&7Si jamais vous êtes bloqué, essayez'
- '&b/ag bloqué &7pour la récupération.'
codex_start_settings_lore:
- '&7Ouvrez les paramètres du tracé depuis le menu principal'
- '&7pour examiner l''entrée, les conteneurs, les foules,'
- '&7redstone, et autres protections.'
- ' '
- '&7Ouvrir les membres et les rôles pour faire confiance à des amis'
- '&7ou supprimez les visiteurs indésirables.'
codex_start_codex_lore:
- '&7Chaque chapitre de ce guide explique'
- '&7une partie différente de AegisGuard.'
- ' '
- '&7Reviens ici chaque fois que tu oublies'
- '&7une commande, un menu, ou comment l''un des'
- '&7les systèmes les plus récents fonctionnent.'
codex_start_help_lore:
- 'Menu &b/ag &7- ouvrir le menu principal'
- '&b/ag baguette &7- obtenez la baguette de réclamation'
- '&b/ag réclamation &7- confirmez votre parcelle'
- '&b/ag visite &7- options de voyage ouvertes'
- '&b/ag help &7- afficher l''aide de la commande'
codex_claim_step1_lore:
- '&7Exécutez &b/ag wand &7pour recevoir'
- '&7le Aegis Scepter.'
- ' '
- '&eÉtape 1 :&7 Tenez la baguette dans votre main.'
- '&eÉtape 2 :&7 Cliquez avec le bouton droit sur le premier bloc de coin.'
- '&eÉtape 3 :&7 Cliquez avec le bouton gauche sur le bloc de coin opposé.'
- '&8La baguette doit marquer le terrain et non se placer.'
codex_claim_step2_lore:
- '&7Choisissez deux coins dans le même monde'
- '&7pour délimiter la zone souhaitée.'
- ' '
- '&eClic droit :&7 premier coin'
- '&eClic gauche :&7 deuxième coin'
- '&eAstuce :&7 Gardez suffisamment de place pour les chemins,'
- '&7stockage, fermes et croissance future.'
- ' '
- '&8AegisGuard affichera la taille sélectionnée'
- '&8dans le chat avant de confirmer la réclamation.'
codex_claim_step3_lore:
- '&7Une fois les deux coins marqués, utilisez'
- '&a/ag réclamez &7pour créer l''intrigue.'
- ' '
- '&eCommande :&7 /ag réclamation'
- '&7Le plugin vérifie les chevauchements, les limites,'
- '&7et coût avant de créer l''intrigue.'
- '&8En cas d''échec, lisez l''erreur de chat rouge'
- '&8line pour voir ce qui a bloqué la réclamation.'
codex_claim_group_lore:
- '&7Les parcelles partagées démarrent avec un vrai groupe,'
- '&7n''est pas une réclamation personnelle normale.'
- ' '
- '&eCréer :&7 /ag groupe créer <nom>'
- '&eInvitation :&7 /ag invitation de groupe <joueur>'
- '&eDépôt :&7 /ag dépôt de groupe <montant>'
- '&eRéclamation :&7 /ag réclamation de groupe'
- ' '
- '&8Idéal pour les villes, les halls de guilde, les marchés,'
- '&8et projets partagés à long terme.'
codex_claim_limits_lore:
- '&7Une réclamation doit s''adapter en toute sécurité au monde'
- '&7avant AegisGuard le permettra.'
- ' '
- '&7Il ne peut pas chevaucher d''autres parcelles,'
- '&7brisez les limites du rayon mondial ou entrez'
- '&7Terre protégée des plugins pris en charge.'
- ' '
- '&8Cela vous protège ainsi que vos proches'
- '&8joueurs issus de conflits frontaliers désordonnés.'
codex_claim_starter_lore:
- '&7De nombreux serveurs proposent une réclamation de démarrage'
- '&7ou terrain de groupe starter basé sur'
- '&7les règles de première réclamation configurées.'
- ' '
- '&7Certains serveurs offrent d''abord des terrains gratuits.'
- '&7D''autres nécessitent ClaimBlocks, de l''argent,'
- '&7ou financement de trésorerie groupe en premier.'
codex_claim_group_money_lore:
- '&7La trésorerie du Groupe est un financement partagé pour'
- '&7réclamations et extensions de groupe.'
- ' '
- '&eDépôt :&7 /ag dépôt de groupe <montant>'
- '&eStatut :&7 /ag statut du groupe'
- ' '
- '&8Cela aide tout le groupe à payer'
- '&8croissance au lieu d''un seul joueur.'
codex_claim_fail_lore:
- '&7Vérifiez le chevauchement, les limites du monde,'
- '&7règles de taille de réclamation, fonds requis,'
- '&7ou conflits de protection externe.'
- ' '
- '&7Essayez une zone plus petite, éloignez-vous de'
- '&7réclamations à proximité, ou gagnez plus de ressources'
- '&7avant de réessayer.'
codex_claim_commands_lore:
- '&e/ag baguette &7- récupérez le sceptre'
- '&e/ag réclamer &7- créer un terrain personnel'
- '&e/ag réclamation groupée &7- créer une parcelle partagée'
- '&e/ag annuler la réclamation &7- supprimer votre parcelle actuelle'
codex_travel_home_lore:
- '&7Votre parcelle d''habitation est le principal point de retour'
- '&7pour votre terrain personnel.'
- ' '
- '&eAller à la maison :&7 /ag à la maison'
- '&eSet Spawn :&7 /ag setspawn'
- ' '
- '&7Définissez votre spawn après avoir construit un'
- '&7entrée, chemin ou espace d''accueil.'
- '&8Définissez ceci après avoir construit une entrée ou un hall.'
codex_travel_visit_lore:
- '&7Le menu Visite est votre plaque tournante de voyage pour'
- '&7tracés de confiance, vos propres tracés et'
- '&7lieux de déplacement du serveur.'
- ' '
- '&eOuvert :&7 /ag visite'
- ' '
- '&7C''est le moyen le plus simple de passer entre'
- '&7réclamations amicales sans parcourir la carte.'
codex_travel_server_lore:
- '&7Les propriétaires de serveurs peuvent créer des'
- '&7Destinations de tracé de style warp pour'
- '&7zones d''apparition, de marché ou de vitrine.'
- ' '
- '&7Si votre serveur a spawn, market,'
- '&7showcase, ou intrigues d''événements, ils peuvent'
- '&7apparaissent ici comme points de déplacement.'
codex_travel_tip_lore:
- '&7Définissez l''apparition de votre intrigue après la réclamation.'
- ' '
- '&7Utilisez le mode visite pour joindre des amis'
- '&7ou des tracés de confiance plus rapidement.'
- '&8Gardez votre spawn dégagé pour que les arrivées se fassent en toute sécurité.'
codex_travel_trusted_lore:
- '&7Si un autre joueur vous fait confiance, son'
- 'Le tracé &7 peut apparaître rapidement dans Visit'
- '&7voyage en terre partagée ou conviviale.'
- ' '
- '&7Ceci est utile pour les builds partagés,'
- '&7projets urbains et groupes alliés.'
codex_travel_room_lore:
- '&7Les chambres et sous-parcelles louées peuvent avoir'
- '&7leur propre chambre apparaît, créant des hôtels'
- '&7et des marchés plus faciles à naviguer.'
- ' '
- '&7Si vous louez une chambre, ouvrez ses commandes'
- '&7pour gérer le comportement de téléportation des salles,'
- '&7accès invité et apparition de la salle.'
codex_travel_unstuck_lore:
- '&7Utilisez la commande de déblocage si vous vous retrouvez'
- '&7coincé dans des murs, des pièces, des bâtiments ou'
- '&7coins délicats d''une réclamation.'
- ' '
- '&eCommande :&7 /ag bloqué'
- ' '
- '&7Utilisez-le avant de demander de l''aide au personnel'
- '&7si vous êtes simplement coincé dans un terrain.'
codex_menus_main_lore:
- 'Le menu &e/ag &7ouvre le menu principal AegisGuard'
- '&7panneau de contrôle pour la plupart des actions des joueurs.'
- ' '
- '&7De là, vous pouvez accéder aux paramètres,'
- '&7outils de voyage, d''aide du codex et de tracé.'
codex_menus_settings_lore:
- '&7Les paramètres de parcelle contrôlent la façon dont votre terrain'
- '&7 se comporte pour vous, vos amis et vos visiteurs.'
- ' '
- '&7Cela inclut l''entrée, les conteneurs,'
- '&7mobs, PvP, redstone et plus encore.'
- ' '
- '&7Examinez-les après avoir réclamé afin que votre'
- '&7plot se comporte comme vous le souhaitez.'
codex_menus_members_lore:
- '&7Utilisez le menu Membres pour ajouter des amis,'
- '&7changer les rôles et gérer qui peut'
- '&7construisez ou interagissez sur votre parcelle.'
- ' '
- '&7C''est plus sûr que de tout partager'
- '&7avec chaque visiteur.'
codex_menus_preferences_lore:
- '&7Les préférences du joueur vous permettent de gérer'
- '&7langue, sons et notification'
- 'Comportement &7.'
- ' '
- '&7Si un menu semble trop bruyant, c''est'
- '&7où vous ajustez vos paramètres personnels.'
codex_menus_market_lore:
- '&7Les tracés liés au marché peuvent exposer un'
- '&7Bouton Marché local pour les stands,'
- '&7locations et systèmes de magasins liés.'
- ' '
- '&7Utilisez-le pour parcourir les zones louables,'
- '&7ouvrez TradeStalls, ou gérez votre'
- '&7propre espace commercial à l''intérieur de cette parcelle.'
codex_menus_info_lore:
- '&7Ce codex est destiné à être votre'
- '&7référence dans le jeu chaque fois que vous'
- '&7oubliez le fonctionnement d''une fonctionnalité.'
- ' '
- '&7Si vous n''êtes pas sûr de ce que fait un bouton,'
- '&7consultez ce guide avant d''expérimenter.'
codex_security_access_lore:
- '&7Trusted Access signifie donner un autre'
- '&7autorisation du joueur pour utiliser votre intrigue.'
- ' '
- '&7Ouvrir &eMembres et rôles &7à partir du menu principal'
- 'Menu &7pour ajouter ou mettre à jour l''accès des joueurs.'
- ' '
- '&7Les rôles décident de ce que chaque membre peut faire,'
- '&7du simple accès à la gestion complète.'
codex_security_ban_lore:
- '&7Kick supprime quelqu''un de votre parcelle'
- '&7en ce moment. L''interdiction les empêche de venir'
- '&7reculez jusqu''à ce que vous le souleviez.'
- ' '
- '&eKick:&7 /ag kick <joueur>'
- ' '
- '&eBan :&7 /ag ban <joueur>'
- '&eDébanner :&7 /ag débannir <joueur>'
codex_security_flags_lore:
- '&7Les drapeaux de protection sont la bascule principale'
- '&7règles pour votre parcelle.'
- ' '
- '&7Ils contrôlent l''entrée, les conteneurs,'
- '&7véhicules, redstone, monstres, PvP et plus encore.'
- ' '
- '&7Voici les principales règles qui façonnent'
- '&7à quel point votre terrain est sûr ou ouvert.'
codex_security_notify_lore:
- '&7Utilisez les paramètres de notification pour contrôler'
- '&7réclamez les salutations et les mises à jour de l''administrateur'
- '&7séparément.'
- ' '
- '&7Cela vous aide à conserver des alertes utiles pendant'
- '&7éteignez ceux dont vous ne voulez pas.'
codex_security_room_lore:
- '&7Les pièces et les sous-parcelles laissent une revendication principale'
- '&7contient des espaces protégés plus petits à l''intérieur.'
- ' '
- '&7Les locataires peuvent gérer leur chambre tout en'
- '&7le propriétaire principal garde toujours la surveillance.'
- ' '
- '&7Ceci est utile pour les hôtels, les appartements,'
- '&7étals de marché et complexes de guilde.'
codex_security_entities_lore:
- '&7Les parcelles peuvent protéger les conteneurs,'
- '&7entités décoratives, véhicules,'
- '&7et de nombreux vecteurs de deuil courants.'
- ' '
- '&7Cela inclut les types de petits chagrins'
- 'Les tentatives &7 que les gens négligent souvent.'
codex_security_staff_lore:
- '&7Accès du personnel au serveur signifie les administrateurs ou'
- 'Les groupes de personnel &7 peuvent gérer des parcelles spéciales'
- '&7sans compter sur le bypass manuel.'
- ' '
- '&7Ceci est destiné aux zones serveur,'
- '&7parcelles de marché et autres zones gérées.'
- ' '
- '&7Cela réduit le besoin de compter sur'
- '&7contournement manuel pour le travail courant du personnel.'
codex_economy_blocks_lore:
- '&7ClaimBlocks sont l''un des principaux'
- '&7devises de progression en AegisGuard.'
- ' '
- '&e/ag bloque &7affiche votre solde et'
- 'Commandes de blocage de réclamation liées à &7.'
- '&7Vous pouvez les gagner grâce au temps de jeu,'
- '&7règles de mise à niveau, d''échange ou autres règles de serveur.'
codex_economy_upkeep_lore:
- '&7L''entretien signifie les frais de votre serveur'
- '&7entretien régulier ou taxes foncières.'
- ' '
- '&7Les avertissements peuvent être envoyés via'
- '&7AegisGuardnotifications.'
- '&8Si la maintenance est activée, n''ignorez pas'
- '&8avertissements concernant les coûts à venir.'
codex_economy_market_lore:
- '&7Utiliser le marché et le marché local'
- '&7systèmes pour vendre des parcelles, louer des zones,'
- '&7ou parcourez TradeStalls.'
- ' '
- '&7Certains serveurs gardent cela global, alors que'
- '&7d''autres permettent aux joueurs de créer des marchés immobiliers.'
codex_economy_expand_lore:
- '&7Les extensions vous permettent de développer un'
- '&7tracé lorsque vos frontières actuelles sont'
- '&7trop petit pour vos projets.'
- ' '
- '&7Certains serveurs utilisent des files d''attente d''approbation.'
- '&7D''autres autorisent les demandes valides instantanées.'
- ' '
- '&7Si votre frontière vous semble exiguë, c''est'
- '&7comment le cultiver en toute sécurité.'
codex_economy_stalls_lore:
- '&7TradeStalls laissez les vendeurs créer'
- '&7vitrines protégées basées sur des coffres'
- '&7à l''intérieur des marchés locaux et des zones louables.'
- ' '
- '&7Ils fonctionnent même si le serveur ne fonctionne pas'
- '&7utilisez un plugin de boutique tiers distinct.'
codex_economy_stall_setup_lore:
- '&7Pour construire un TradeStall, placez un'
- '&7poitrine ou canon soutenu en premier.'
- ' '
- '&7Puis ajoutez un panneau de décrochage valide et utilisez'
- '&7le menu du stand pour fixer les prix, le montant,'
- '&7et quelle devise le stand accepte.'
- ' '
- '&7Les serveurs peuvent autoriser de l''argent, ClaimBlocks,'
- '&7ou les deux pour le prix du stand.'
codex_economy_currency_lore:
- '&7Les serveurs peuvent autoriser de l''argent, ClaimBlocks,'
- '&7ou les deux selon la fonctionnalité'
- '&7et les règles d''économie configurées.'
- ' '
- '&7Lisez attentivement chaque menu pour savoir'
- '&7quelle devise cette action utilisera.'
codex_economy_warning_lore:
- '&7Avertissements de trésorerie faible, avis d''entretien,'
- '&7et les frais d''expansion peuvent être envoyés'
- '&7via les notifications AegisGuard.'
- ' '
- '&7Si vous les ignorez trop longtemps, votre'
- '&7l''action suivante peut échouer de manière inattendue.'
codex_identity_name_lore:
- '&7L''identité du terrain signifie comment est votre terrain'
- '&7présenté aux visiteurs et aux menus.'
- ' '
- '&eRenommer :&7 /ag renommer <nom>'
- ' '
- '&eDescription :&7 /ag setdesc <text>'
- '&7Un bon nom et une bonne description aident les gens'
- '&7comprenez à quoi sert votre intrigue.'
codex_identity_cosmetics_lore:
- '&7Les cosmétiques sont des touches visuelles pour votre'
- '&7tracé, comme les particules ou les effets d''entrée.'
- ' '
- '&7Ceux-ci ne changent généralement pas de propriétaire'
- '&7ou sécurité. Ils changent de présentation.'
- ' '
- '&7Utilisez-les pour donner plus de sensation à votre intrigue'
- '&7distinct sans changer sa finalité.'
codex_identity_presentation_lore:
- '&7La présentation couvre le style visible'
- '&7d''une intrigue, du naming à la cosmétique'
- '&7et ce que ça fait de visiter.'
- ' '
- '&7Utilisez-le pour donner l''impression d''un quartier'
- '&7clair, accueillant et mémorable'
- '&7sans changer les règles de propriété.'
codex_identity_stuck_lore:
- '&7Unstuck est un outil de récupération lorsque'
- '&7vous êtes coincé dans les murs, les bâtiments,'
- '&7réclamations ou apparition d''une mauvaise salle.'
- ' '
- '&eCommande :&7 /ag bloqué'
- ' '
- '&7C''est une commande de sécurité pratique, même'
- '&7bien que cela affecte également le flux des joueurs.'
codex_identity_greeting_lore:
- '&7Les salutations et les titres sont les bienvenus'
- '&7messages affichés lorsque quelqu''un entre'
- '&7ou quitte une parcelle.'
- ' '
- '&7Utilisez-les pour accueillir les invités, étiquetez'
- '&7boutiques, ou donner une saveur thématique à une intrigue.'
- ' '
- '&7C''est un bon endroit pour accueillir des invités'
- '&7ou magasins d''étiquettes et zones spéciales.'
codex_identity_showcase_lore:
- '&7La présentation est à quel point elle est soignée et facile'
- '&7pour comprendre votre intrigue, ce que ressentent les autres.'
- ' '
- '&7Un nom clair, une bonne description, un'
- '&7apparition sécurisée et visuels correspondants'
- '&7aide les visiteurs à se souvenir de l''intrigue.'
- ' '
- '&7Les petits détails de présentation rendent votre'
- 'L''intrigue &7 semble beaucoup plus complète.'
codex_advanced_level_lore:
- '&7Plot Leveling, ou Ascension, mises à niveau'
- '&7votre intrigue en niveaux plus forts au fil du temps.'
- ' '
- '&7Chaque niveau peut débloquer de nouveaux avantages,'
- '&7bonus, ou avantages de progression.'
- ' '
- '&7Ouvrez Plot Ascension pour prévisualiser ce'
- '&7le niveau suivant vous le donnera en fait.'
codex_advanced_zones_lore:
- '&7Les zones divisent un claims principal en'
- '&7des espaces plus petits avec leur propre objectif.'
- ' '
- '&7Utilisez-les pour les chambres, les locations, les stands,'
- '&7bureaux, appartements ou ailes de guilde.'
- ' '
- '&7C''est l''un des meilleurs outils pour les auberges,'
- '&7hôtels, centres commerciaux et immeubles d''appartements.'
codex_advanced_local_market_lore:
- '&7Le marché local est une plateforme de marché basée sur des parcelles'
- '&7pour les stands, les locations et les outils de boutique liés.'
- ' '
- '&7Si une parcelle prend en charge les fonctionnalités du marché,'
- '&7c''est ici que les joueurs parcourent ce que ça'
- '&7un terrain spécifique a à offrir.'
- ' '
- '&7Cela donne l''impression que les magasins sont locaux plutôt que'
- '&7envoyant tout dans un seul menu global.'
codex_advanced_recovery_lore:
- '&7Les outils de récupération aident le personnel à réparer les dommages,'
- '&7restaurez les réclamations et étudiez les problèmes.'
- ' '
- '&7Cela inclut les diagnostics, la migration,'
- '&7instantanés et actions de restauration.'
- ' '
- '&7Ces outils sont particulièrement importants'
- '&7sur des serveurs de longue durée ou publics.'
codex_advanced_tip_lore:
- '&7Vérifiez vos paramètres après avoir réclamé,'
- '&7gardez votre spawn à jour et utilisez'
- '&7regroupez soigneusement les outils sur des parcelles partagées.'
- ' '
- '&7Un petit examen précoce peut économiser beaucoup'
- '&7de confusion plus tard.'
codex_advanced_migration_lore:
- '&7Les outils de migration aident les administrateurs à déplacer des terres'
- '&7des plugins de protection pris en charge vers'
- '&7AegisGuard avec moins de retouches manuelles.'
- ' '
- '&7Utilisez la baguette de migration et prévisualisez l''interface utilisateur'
- '&7avant de confirmer les réclamations importées.'
- ' '
- '&8Ceci est destiné à la configuration du serveur ou'
- '&8plugins de protection de commutation.'
codex_advanced_snapshot_lore:
- '&7Les instantanés enregistrent l''état de l''intrigue afin que le personnel'
- '&7peut revenir en arrière ou restaurer plus tard si nécessaire.'
- ' '
- '&7Ils sont utiles après des accidents, des chagrins,'
- '&7mauvaises extensions ou situations de restauration.'
- ' '
- '&7Ils sont particulièrement utiles après un mauvais'
- '&7extensions, problèmes ou problèmes de serveur.'
codex_advanced_diagnostics_lore:
- '&7Les diagnostics aident les propriétaires de serveurs à inspecter'
- '&7Problèmes d''installation et santé du plugin.'
- ' '
- '&7Utilisez les rapports médicaux et les outils d''administration pour'
- '&7repérez les erreurs de configuration ou les systèmes défectueux.'
- ' '
- '&7Si quelque chose ne va pas, diagnostic'
- 'Les &7sont le premier endroit où le personnel devrait chercher.'
