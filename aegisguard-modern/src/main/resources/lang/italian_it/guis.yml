codex_root_welcome_lore:
- '&7Apri uno dei capitoli seguenti per leggere a'
- '&7guida mirata per rivendicazioni, viaggi,'
- '&7sicurezza, economia e altro ancora.'
- ' '
- '&eOgni capitolo apre il proprio menu di aiuto.'
codex_claim_lore:
- '&7Scopri come rivendicare la terra,'
- '&7seleziona gli angoli e crea'
- '&7attestazioni di gruppo condivise.'
codex_travel_lore:
- '&7Rivedi case, spawn della trama,'
- '&7visita viaggio e server'
- '&7movimento in stile curvatura.'
codex_menus_lore:
- '&7Scopri cosa ogni maggiore'
- 'Il menu &7AegisGuard fa e'
- '&7dove gestire il tuo appezzamento.'
codex_security_lore:
- '&7Guarda come fiducia, divieti,'
- '&7bandiere e regole di protezione'
- '&7mantieni il tuo terreno al sicuro.'
codex_economy_lore:
- '&7Leggi informazioni su ClaimBlocks,'
- '&7manutenzione, costi di espansione,'
- '&7e sistemi di mercato.'
codex_identity_lore:
- '&7Personalizza i nomi dei terreni,'
- '&7descrizioni, cosmetici,'
- '&7e presentazione.'
codex_advanced_lore:
- '&7Esplora livellamento, zone,'
- '&7noleggi, TradeStalls e'
- '&7altri sistemi avanzati.'
codex_start_menu_lore:
- '&7Utilizzare il menu &b/ag &7per aprire il menu principale'
- '&7AegisGuard control panel at any time.'
- ' '
- '&7Quel menu è il percorso più veloce per raggiungerlo'
- '&7ambientazioni, viaggi, mercati, livellamento,'
- '&7il codice e la maggior parte degli strumenti quotidiani.'
codex_start_wand_lore:
- '&7Utilizza la bacchetta &b/ag &7per ricevere il'
- '&7Aegis Scepter per la selezione del terreno.'
- ' '
- '&7Fai clic con il pulsante destro del mouse sul primo blocco d''angolo.'
- '&7Fai clic con il pulsante sinistro del mouse sul blocco d''angolo opposto.'
codex_start_claim_lore:
- '&7Dopo aver selezionato entrambi gli angoli, utilizzare'
- '&b/ag reclamo &7per creare la tua trama.'
- ' '
- '&7Il plugin controlla la sovrapposizione, world'
- '&7limiti e costi richiesti prima'
- '&7conferma del terreno.'
codex_start_group_lore:
- '&7Vuoi un terreno condiviso? Crea un gruppo con'
- '&b/ag gruppo crea prima <nome>&7.'
- ' '
- '&7Invita giocatori, finanzia la tesoreria,'
- '&7quindi utilizzare &b/ag rivendicazione del gruppo&7 quando'
- '&7la tua squadra è pronta.'
codex_start_travel_lore:
- '&7Utilizza &b/ag home &7per tornare al tuo'
- '&7plotta e &b/ag visita &7per raggiungere i dati attendibili'
- '&7o destinazioni elencate nel server.'
- ' '
- '&7Se ti trovi in difficoltà, provaci'
- '&b/ag bloccato &7per il ripristino.'
codex_start_settings_lore:
- '&7Apri Impostazioni di stampa dal menu principale'
- '&7per rivedere l''ingresso, i contenitori, i mob,'
- '&7redstone e altre protezioni.'
- ' '
- '&7Apri Membri e ruoli per fidarti degli amici'
- '&7o rimuovere i visitatori indesiderati.'
codex_start_codex_lore:
- '&7Ogni capitolo di questa guida spiega'
- '&7una parte diversa di AegisGuard.'
- ' '
- '&7Torna qui ogni volta che te ne dimentichi'
- '&7un comando, un menu o come uno di'
- '&7i sistemi più recenti funzionano.'
codex_start_help_lore:
- '&b/ag menu &7- apre il menu principale'
- '&b/ag bacchetta &7- ottieni la bacchetta di richiesta'
- '&b/ag reclamo &7- conferma la tua trama'
- '&b/ag visita &7- opzioni di viaggio aperte'
- '&b/ag help &7- visualizza la guida del comando'
codex_claim_step1_lore:
- '&7Esegui &b/ag bacchetta &7per ricevere'
- '&7il Aegis Scepter.'
- ' '
- '&eStep 1:&7 Hold the wand in your hand.'
- '&ePassaggio 2:&7 Fare clic con il pulsante destro del mouse sul primo blocco d''angolo.'
- '&ePassaggio 3:&7 Fare clic con il pulsante sinistro del mouse sul blocco d''angolo opposto.'
- '&8The wand should mark land, not place itself.'
codex_claim_step2_lore:
- '&7Scegli due angoli dello stesso mondo'
- '&7per delineare l''area desiderata.'
- ' '
- '&eClick destro:&7 primo angolo'
- '&eClic sinistro:&7 secondo angolo'
- '&eSuggerimento:&7 Mantieni spazio sufficiente per i percorsi,'
- '&7stoccaggio, aziende agricole e crescita futura.'
- ' '
- '&8AegisGuard mostrerà la dimensione selezionata'
- '&8in chat prima di confermare il reclamo.'
codex_claim_step3_lore:
- '&7Dopo aver contrassegnato entrambi gli angoli, utilizzare'
- '&a/ag rivendicano &7per creare la trama.'
- ' '
- '&eComando:&7 /ag attestazione'
- '&7Il plugin controlla sovrapposizioni, limiti,'
- '&7e il costo prima di creare la trama.'
- '&8Se fallisce, leggi l''errore rosso della chat'
- '&8riga per vedere cosa ha bloccato il reclamo.'
codex_claim_group_lore:
- '&7Le trame condivise iniziano con un gruppo reale,'
- '&7non una normale rivendicazione personale.'
- ' '
- '&eCrea:&7 /ag gruppo crea <nome>'
- '&eInvita:&7 /ag gruppo invita <giocatore>'
- '&eDeposito:&7 /ag gruppo deposito <importo>'
- '&eReclamo:&7 reclamo del gruppo /ag'
- ' '
- '&8Ideale per città, sedi di corporazioni, mercati,'
- '&8e progetti condivisi a lungo termine.'
codex_claim_limits_lore:
- '&7Una richiesta deve adattarsi in modo sicuro al mondo'
- '&7prima che AegisGuard lo consenta.'
- ' '
- '&7Non può sovrapporsi ad altri grafici,'
- '&7rompere i limiti del raggio del mondo, o entrare'
- '&7terreno protetto dai plugin supportati.'
- ' '
- '&8Questo protegge sia te che le persone vicine'
- '&8giocatori provenienti da disordinati conflitti di confine.'
codex_claim_starter_lore:
- '&7Molti server offrono una richiesta iniziale'
- '&7o terreno del gruppo iniziale basato su'
- '&7le regole di prima rivendicazione configurate.'
- ' '
- '&7Alcuni server danno prima la terra gratuita.'
- '&7Altri richiedono ClaimBlocks, denaro,'
- '&7o prima il finanziamento della tesoreria del gruppo.'
codex_claim_group_money_lore:
- '&7La tesoreria del gruppo è un finanziamento condiviso per'
- '&7rivendicazioni di gruppo ed espansioni.'
- ' '
- '&eDeposito:&7 /ag gruppo deposito <importo>'
- '&eStato:&7 stato del gruppo /ag'
- ' '
- '&8Questo aiuta l''intero gruppo a pagare'
- '&8crescita invece di un solo giocatore.'
codex_claim_fail_lore:
- '&7Verifica sovrapposizioni, limiti mondiali,'
- '&7regole sull''entità della richiesta, fondi richiesti,'
- '&7o conflitti di protezione esterna.'
- ' '
- '&7Prova con un''area più piccola e allontanati'
- '&7rivendica nelle vicinanze o guadagna più risorse'
- '&7prima di riprovare.'
codex_claim_commands_lore:
- '&e/ag bacchetta &7- prendi lo scettro'
- '&e/ag reclamo &7- crea una trama personale'
- '&e/ag groupclaim &7- crea un terreno condiviso'
- '&e/ag annulla reclamo &7- rimuovi il tuo terreno attuale'
codex_travel_home_lore:
- '&7Il tuo terreno è il punto di ritorno principale'
- '&7per la tua terra personale.'
- ' '
- '&eVai a casa:&7 /ag casa'
- '&eImposta spawn:&7 /ag setspawn'
- ' '
- '&7Imposta il tuo spawn dopo aver costruito un'
- '&7ingresso, percorso o area di accoglienza.'
- '&8Imposta questa opzione dopo aver costruito un ingresso o un foyer.'
codex_travel_visit_lore:
- '&7Il menu Visita è il tuo hub di viaggio'
- '&7appezzamenti fidati, i tuoi appezzamenti e'
- '&7percorsi di viaggio del server.'
- ' '
- '&eApri:&7 /ag visita'
- ' '
- '&7Questo è il modo più semplice per spostarsi'
- '&7rivendicazioni amichevoli senza attraversare la mappa.'
codex_travel_server_lore:
- '&7I proprietari del server possono creare server gestiti'
- '&7destinazioni di trama in stile warp per'
- '&7aree di spawn, mercato o vetrina.'
- ' '
- '&7Se il tuo server ha spawn, market,'
- '&7vetrina, o trame di eventi, potrebbero'
- '&7appaiono qui come punti di viaggio.'
codex_travel_tip_lore:
- '&7Imposta lo spawn della trama dopo aver rivendicato.'
- ' '
- '&7Utilizza la modalità visita per raggiungere amici'
- '&7o trame attendibili più velocemente.'
- '&8Mantieni il tuo spawn libero in modo che gli arrivi siano sicuri.'
codex_travel_trusted_lore:
- '&7Se un altro giocatore si fida di te, il suo'
- '&7il grafico può apparire velocemente in Visita'
- '&7viaggiare in terre condivise o amiche.'
- ' '
- '&7Questo è utile per build condivise,'
- '&7progetti urbani e gruppi affini.'
codex_travel_room_lore:
- '&7Le stanze affittate e le sottotrame possono avere'
- '&7generano le loro stanze, creando hotel'
- '&7e mercati più facili da navigare.'
- ' '
- '&7Se affitti una stanza, apri i suoi controlli'
- '&7per gestire il comportamento del teletrasporto nella stanza,'
- '&7accesso ospite e spawn della stanza.'
codex_travel_unstuck_lore:
- '&7Se finisci, usa il comando sbloccato'
- '&7intrappolato in muri, stanze, edifici o'
- '&7angoli scomodi di un reclamo.'
- ' '
- '&eComando:&7 /ag bloccato'
- ' '
- '&7Utilizzalo prima di chiedere aiuto al personale'
- '&7se sei semplicemente incastrato nel terreno.'
codex_menus_main_lore:
- 'Il menu &e/ag &7apre il menu principale AegisGuard'
- '&7pannello di controllo per la maggior parte delle azioni del giocatore.'
- ' '
- '&7Da qui puoi accedere alle impostazioni,'
- '&7viaggi, aiuto per i codici e strumenti di trama.'
codex_menus_settings_lore:
- '&7Le impostazioni del terreno controllano come funziona il tuo terreno'
- '&7si comporta per te, i tuoi amici e i visitatori.'
- ' '
- '&7Ciò include ingresso, contenitori,'
- '&7mob, PvP, pietrarossa e altro ancora.'
- ' '
- '&7Rivedi questi dopo aver rivendicato il tuo'
- '&7la trama si comporta nel modo desiderato.'
codex_menus_members_lore:
- '&7Utilizza il menu Membri per aggiungere amici,'
- '&7cambia i ruoli e gestisci chi può'
- '&7costruisci o interagisci sulla tua trama.'
- ' '
- '&7Questo è più sicuro che condividere tutto'
- '&7con ogni visitatore.'
codex_menus_preferences_lore:
- '&7Le preferenze del lettore ti consentono di gestire'
- '&7lingua, suoni e notifiche'
- '&7comportamento.'
- ' '
- '&7Se un menu sembra troppo rumoroso, è così'
- '&7dove puoi regolare le tue impostazioni personali.'
codex_menus_market_lore:
- '&7I grafici relativi al mercato possono esporre a'
- '&7Pulsante Mercato Locale per bancarelle,'
- '&7noleggi e sistemi di negozi collegati.'
- ' '
- '&7Utilizzalo per sfogliare le zone affittabili,'
- '&7apri TradeStalls o gestisci il tuo'
- '&7proprio spazio commerciale all''interno di quel terreno.'
codex_menus_info_lore:
- '&7Questo codice è pensato per essere tuo'
- '&7riferimento nel gioco ogni volta che'
- '&7dimentica come funziona una funzionalità.'
- ' '
- '&7Se non sei sicuro della funzione di un pulsante,'
- '&7controlla questa guida prima di sperimentare.'
codex_security_access_lore:
- '&7Accesso attendibile significa concederne un altro'
- '&7autorizzazione del giocatore a utilizzare la tua trama.'
- ' '
- '&7Apri &eMembri e ruoli &7dalla finestra principale'
- '&7menu per aggiungere o aggiornare l''accesso al lettore.'
- ' '
- '&7I ruoli decidono cosa può fare ogni membro,'
- '&7dal semplice accesso alla gestione completa.'
codex_security_ban_lore:
- '&7Kick rimuove qualcuno dalla tua trama'
- '&7proprio adesso. Il divieto impedisce loro di venire'
- '&7indietro finché non lo sollevi.'
- ' '
- '&eCalcio:&7 /ag calcia <giocatore>'
- ' '
- '&eBan:&7 /ag ban <giocatore>'
- '&eSbanca:&7 /ag sbanna <giocatore>'
codex_security_flags_lore:
- '&7I flag di protezione sono l''interruttore principale'
- '&7regole per la tua trama.'
- ' '
- '&7Controllano l''ingresso, i contenitori,'
- '&7veicoli, pietra rossa, mob, PvP e altro ancora.'
- ' '
- '&7Queste sono le principali regole che danno forma'
- '&7quanto si sente sicura o aperta la tua trama.'
codex_security_notify_lore:
- '&7Utilizza le impostazioni di notifica per controllare'
- '&7richiedi saluti e aggiornamenti di amministrazione'
- '&7separatamente.'
- ' '
- '&7Questo ti aiuta a mantenere avvisi utili mentre'
- '&7disattivare quelli che non desideri.'
codex_security_room_lore:
- '&7Le stanze e le sottotrame hanno un''affermazione principale'
- '&7tiene al suo interno spazi protetti più piccoli.'
- ' '
- '&7Gli affittuari possono gestire la propria stanza mentre'
- '&7il proprietario principale mantiene ancora la supervisione.'
- ' '
- '&7Utile per hotel, appartamenti,'
- '&7bancarelle del mercato e complessi di gilde.'
codex_security_entities_lore:
- '&7Le parcelle possono proteggere i container,'
- '&7entità decorative, veicoli,'
- '&7e molti vettori comuni di dolore.'
- ' '
- '&7Ciò include i tipi di piccolo dolore'
- '&7tentativi che le persone spesso trascurano.'
codex_security_staff_lore:
- '&7Accesso staff server significa amministratori o'
- '&7i gruppi staff possono gestire appezzamenti speciali'
- '&7senza fare affidamento sul bypass manuale.'
- ' '
- '&7Questo è pensato per le zone server,'
- '&7appezzamenti di mercato e altre aree gestite.'
- ' '
- '&7Ciò riduce la necessità di fare affidamento'
- '&7bypass manuale per il lavoro di routine del personale.'
codex_economy_blocks_lore:
- '&7ClaimBlocks sono uno dei principali'
- '&7valute di progressione in AegisGuard.'
- ' '
- '&e/ag blocchi &7mostra il tuo saldo e'
- '&7comandi di blocco delle attestazioni correlati.'
- '&7Puoi guadagnarli giocando,'
- '&7livellamento, scambio o altre regole del server.'
codex_economy_upkeep_lore:
- '&7La manutenzione implica che il tuo server ti addebita dei costi'
- '&7manutenzione regolare o tasse per i terreni.'
- ' '
- '&7Gli avvisi possono essere inviati'
- '&7AegisGuard notifiche.'
- '&8Se la manutenzione è abilitata, non ignorarla'
- '&8avvisi sui costi imminenti.'
codex_economy_market_lore:
- '&7Utilizza il mercato e il mercato locale'
- '&7sistemi per vendere lotti, affittare zone,'
- '&7o sfoglia TradeStalls.'
- ' '
- '&7Alcuni server mantengono questo valore globale, mentre'
- '&7altri consentono ai giocatori di costruire mercati interni.'
codex_economy_expand_lore:
- '&7Le espansioni ti consentono di far crescere un esistente'
- '&7traccia quando sono i tuoi confini attuali'
- '&7troppo piccolo per i tuoi piani.'
- ' '
- '&7Alcuni server utilizzano code di approvazione.'
- '&7Altri consentono richieste valide istantanee.'
- ' '
- '&7Se i tuoi confini ti sembrano angusti, questo lo è'
- '&7come coltivarlo in sicurezza.'
codex_economy_stalls_lore:
- '&7TradeStalls lascia che i venditori creino'
- '&7vetrine protette a base di bauli'
- '&7all''interno dei mercati locali e delle aree affittabili.'
- ' '
- '&7Funzionano anche se il server no'
- '&7utilizza un plug-in di negozio di terze parti separato.'
codex_economy_stall_setup_lore:
- '&7Per costruire un TradeStall, posiziona a'
- '&7supporta prima il torace o la botte.'
- ' '
- '&7Quindi aggiungi un segnale di stallo valido e usalo'
- '&7il menu bancarella per impostare prezzi, importo,'
- '&7e quale valuta accetta la bancarella.'
- ' '
- '&7I server possono consentire denaro, ClaimBlocks,'
- '&7o entrambi per i prezzi di stallo.'
codex_economy_currency_lore:
- '&7I server possono consentire denaro, ClaimBlocks,'
- '&7o entrambi a seconda della funzionalità'
- '&7e le regole economiche configurate.'
- ' '
- '&7Leggi attentamente ogni menu per saperlo'
- '&7quale valuta verrà utilizzata dall''azione.'
codex_economy_warning_lore:
- '&7Avvisi di tesoreria bassa, avvisi di manutenzione,'
- '&7e i costi di espansione possono essere inviati'
- 'Notifiche da &7a AegisGuard.'
- ' '
- '&7Se li ignori per troppo tempo, il tuo'
- '&7l''azione successiva potrebbe non riuscire in modo imprevisto.'
codex_identity_name_lore:
- '&7Identità della trama indica come è la tua trama'
- '&7presentato ai visitatori e ai menu.'
- ' '
- '&eRinomina:&7 /ag rinomina <nome>'
- ' '
- '&eDescrizione:&7 /ag setdesc <testo>'
- '&7Un buon nome e una buona descrizione aiutano le persone'
- '&7capire a cosa serve la tua trama.'
codex_identity_cosmetics_lore:
- '&7I cosmetici sono un tocco visivo per il tuo'
- '&7trama, come particelle o effetti di ingresso.'
- ' '
- '&7Di solito non cambiano proprietà'
- '&7o sicurezza. Cambiano presentazione.'
- ' '
- '&7Usali per dare più sapore alla tua trama'
- '&7distinto senza cambiare il suo scopo.'
codex_identity_presentation_lore:
- '&7La presentazione copre lo stile visibile'
- '&7di una trama, dal naming ai cosmetici'
- '&7e come ci si sente a visitarlo.'
- ' '
- '&7Utilizza questo per dare un''atmosfera al quartiere'
- '&7chiaro, accogliente e memorabile'
- '&7senza modificare le regole di proprietà.'
codex_identity_stuck_lore:
- '&7Unstuck è uno strumento di recupero per quando'
- '&7rimani intrappolato nei muri, nelle costruzioni,'
- '&7rivendicazioni o generazione di stanze difettose.'
- ' '
- '&eComando:&7 /ag bloccato'
- ' '
- '&7È addirittura un comando di sicurezza pratico'
- '&7anche se influisce anche sul flusso dei giocatori.'
codex_identity_greeting_lore:
- '&7Saluti e titoli sono graditi'
- '&7messaggi mostrati quando qualcuno entra'
- '&7o lascia una trama.'
- ' '
- '&7Utilizzali per accogliere gli ospiti, etichetta'
- '&7negozi o dare un tocco a tema a una trama.'
- ' '
- '&7Questo è un buon posto per accogliere gli ospiti'
- '&7o negozi di etichette e aree speciali.'
codex_identity_showcase_lore:
- '&7La presentazione è semplice e raffinata'
- '&7per comprendere la tua trama e ciò che provano gli altri.'
- ' '
- '&7Un nome chiaro, una buona descrizione, a'
- '&7spawn sicuro e immagini corrispondenti'
- '&7aiuta i visitatori a ricordare la trama.'
- ' '
- '&7Piccoli dettagli di presentazione rendono il tuo'
- '&7la trama sembra molto più completa.'
codex_advanced_level_lore:
- '&7Miglioramenti del livellamento della trama o dell''Ascensione'
- '&7la tua trama in livelli più forti nel tempo.'
- ' '
- '&7Ogni livello può sbloccare nuovi vantaggi,'
- '&7bonus o benefici di progressione.'
- ' '
- '&7Apri Plot Ascension per vedere in anteprima cosa'
- '&7il livello successivo ti darà effettivamente.'
codex_advanced_zones_lore:
- '&7Le zone dividono una rivendicazione principale in'
- '&7spazi più piccoli con uno scopo proprio.'
- ' '
- '&7Usali per stanze, affitti, bancarelle,'
- '&7uffici, appartamenti o ali di gilda.'
- ' '
- '&7Questo è uno dei migliori strumenti per le locande,'
- '&7hotel, centri commerciali e condomini.'
codex_advanced_local_market_lore:
- '&7Il mercato locale è un hub di mercato basato su un terreno'
- '&7per bancarelle, noleggi e strumenti del negozio collegati.'
- ' '
- '&7Se un terreno supporta le caratteristiche del mercato,'
- '&7qui è dove i giocatori sfogliano quello'
- '&7trama specifica ha da offrire.'
- ' '
- '&7Questo fa sembrare i negozi locali invece che locali'
- '&7 scarica tutto in un unico menu globale.'
codex_advanced_recovery_lore:
- '&7Gli strumenti di ripristino aiutano il personale a riparare i danni,'
- '&7ripristinare le richieste ed esaminare i problemi.'
- ' '
- '&7Ciò include diagnostica, migrazione,'
- '&7istantanee e azioni di ripristino.'
- ' '
- '&7Questi strumenti sono particolarmente importanti'
- '&7su server pubblici o a lunga esecuzione.'
codex_advanced_tip_lore:
- '&7Rivedi le tue impostazioni dopo aver richiesto,'
- '&7mantieni aggiornato il tuo spawn e usa'
- '&7raggruppa attentamente gli strumenti su appezzamenti condivisi.'
- ' '
- '&7Una piccola revisione anticipata può farti risparmiare molto'
- '&7di confusione più tardi.'
codex_advanced_migration_lore:
- '&7Gli strumenti di migrazione aiutano gli amministratori a spostare i terreni'
- '&7dai plugin di protezione supportati in'
- '&7AegisGuard con meno rilavorazioni manuali.'
- ' '
- '&7Utilizza la bacchetta magica e visualizza l''anteprima dell''interfaccia utente'
- '&7prima di confermare le richieste importate.'
- ' '
- '&8Questo è pensato per la configurazione del server o'
- '&8plugin di protezione dal cambio.'
codex_advanced_snapshot_lore:
- '&7Le istantanee registrano lo stato della trama, quindi il personale'
- '&7può eseguire il rollback o il ripristino in un secondo momento, se necessario.'
- ' '
- '&7Sono utili dopo incidenti, lutti,'
- '&7errate espansioni o situazioni di rollback.'
- ' '
- '&7Sono particolarmente utili dopo il cattivo'
- '&7espansioni, problemi o problemi del server.'
codex_advanced_diagnostics_lore:
- '&7La diagnostica aiuta i proprietari del server a effettuare l''ispezione'
- '&7problemi di configurazione e integrità del plugin.'
- ' '
- '&7Utilizza referti medici e strumenti di amministrazione per'
- '&7individuazione di errori di configurazione o sistemi danneggiati.'
- ' '
- '&7Se qualcosa non va, diagnostica'
- '&7sono il primo posto in cui il personale dovrebbe guardare.'
