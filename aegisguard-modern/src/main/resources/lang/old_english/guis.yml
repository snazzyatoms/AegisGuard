codex_travel_safe_name: '&bSafe Passage'
codex_travel_safe_lore:
  - '&7Safe Passage seeks clear ground'
  - '&7ere it sends thee to a plot, stall,'
  - '&7or server destination.'
  - ' '
  - '&7If a warp would drop thee in fire or'
  - '&7stone, the Guard seeks safer earth.'
codex_travel_routes_name: '&aWays & Waymarks'
codex_travel_routes_lore:
  - '&7Stewards may publish named ways'
  - '&7with ordered waymarks.'
  - ' '
  - '&7Open Routes from the main hall to'
  - '&7follow a trail or tour.'
codex_menus_language_name: '&bChoose Thy Tongue'
codex_menus_language_lore:
  - '&7The picker lists every tongue-pack.'
  - '&7New settlers also see it after their'
  - '&7first claim, before the walkthrough.'
  - ' '
  - '&7Thou mayst change it later in Settings.'
codex_security_guest_name: '&eGuest Passes'
codex_security_guest_lore:
  - '&7Guest Passes grant timed leave'
  - '&7without a full household rank.'
  - ' '
  - '&7Use them for visitors, helpers, or'
  - '&7short-term builders. They may lapse'
  - '&7by the clock or by active play.'
codex_security_lockdown_name: '&cEmergency Lockdown'
codex_security_lockdown_lore:
  - '&7Lockdown tightens a holding'
  - '&7when mischief is afoot.'
  - ' '
  - '&7Soft lockdown binds build and chests.'
  - '&7Hard lockdown may seal the plot until'
  - '&7thou lift it or the timer ends.'
codex_security_alliance_name: '&6Alliance Access'
codex_security_alliance_lore:
  - '&7Alliance Access lets allied bands'
  - '&7share chosen leave on a plot'
  - '&7without naming every soul by hand.'
  - ' '
  - '&7Open it from Access & Safety in the'
  - '&7main hall while standing in thy plot.'
codex_identity_realm_name: '&3Realm Profiles'
codex_identity_realm_lore:
  - '&7Realm Profiles govern how thy plot'
  - '&7is shown in discovery: name, kind,'
  - '&7and whether strangers may find it.'
  - ' '
  - '&7Open Realm Profile from Territory'
  - '&7in the main hall.'
codex_advanced_arena_name: '&cArena'
codex_advanced_arena_lore:
  - '&7Arena is an optional party PvE module.'
  - '&7Form a party, begin a dungeon run, and'
  - '&7earn rewards on the prepared map.'
  - ' '
  - '&7Open Arenas from the Explore hall.'
codex_advanced_arena_off_name: '&8Arena (Optional)'
codex_advanced_arena_off_lore:
  - '&7Arena is an optional dungeon module.'
  - '&7It stays still until the server enables'
  - '&7arena.enabled in config.yml.'

