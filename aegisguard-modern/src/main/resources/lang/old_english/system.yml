- '&e/aegis notice &7- Manage the plot noticeboard.'
- '&e/aegis giftblocks [player amount] &7- Gift ClaimBlocks (GUI or command).'
- '&e/aegis merge &7- Merge adjacent owned claims (if enabled).'
- '&e/aegis transfer <player> &7- Transfer ownership of your current plot.'
- '&e/aegis settlements &7- Open your pending payments inbox.'
