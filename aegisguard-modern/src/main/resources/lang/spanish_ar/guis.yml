codex_root_welcome_lore:
- '&7Abra cualquier capítulo a continuación para leer un'
- '&7guía enfocada para reclamos, viajes,'
- '&7seguridad, economía y más.'
- ' '
- '&eCada capítulo abre su propio menú de ayuda.'
codex_start_menu_lore:
- '&7Utilice &b/ag menú &7para abrir el menú principal'
- '&7AegisGuard panel de control en cualquier momento.'
- ' '
- '&7Ese menú es tu ruta más rápida para'
- '&7ajustes, viajes, mercados, nivelación,'
- '&7el códice y la mayoría de las herramientas diarias.'
codex_start_wand_lore:
- '&7Utilice &b/varita Ag &7para recibir el'
- '&7Aegis Scepter para selección de terreno.'
- ' '
- '&7Haga clic derecho en el primer bloque de la esquina.'
- '&7Haga clic izquierdo en el bloque de la esquina opuesta.'
codex_start_claim_lore:
- '&7Después de seleccionar ambas esquinas, use'
- '&b/ag reclamo &7para crear su trama.'
- ' '
- '&7Las comprobaciones del complemento se superponen, mundo'
- '&7límites y costos requeridos antes'
- '&7confirmando el terreno.'
codex_start_group_lore:
- '&7¿Quieres terreno compartido? Crea un grupo con'
- 'El grupo &b/ag crea <nombre>&7 primero.'
- ' '
- '&7Invita a jugadores, financia la tesorería,'
- '&7luego use &b/ag grupo de reclamo&7 cuando'
- '&7tu equipo está listo.'
codex_start_travel_lore:
- '&7Utilice &b/ag home &7para regresar a su'
- '&7trama y &b/ag visita &7para comunicarse con confianza'
- '&7o destinos listados por el servidor.'
- ' '
- '&7Si alguna vez te quedas atascado, inténtalo'
- '&b/ag atascado &7para recuperación.'
codex_start_settings_lore:
- '&7Abra Configuración de trazado desde el menú principal'
- '&7para revisar entradas, contenedores, mobs,'
- '&7redstone y otras protecciones.'
- ' '
- '&7Abrir miembros y roles para confiar en amigos'
- '&7o eliminar visitantes no deseados.'
codex_start_codex_lore:
- '&7Cada capítulo de esta guía explica'
- '&7una parte diferente de AegisGuard.'
- ' '
- '&7Vuelve aquí cuando lo olvides'
- '&7un comando, un menú o cómo uno de'
- '&7los sistemas más nuevos funcionan.'
codex_start_help_lore:
- '&b/ag menú &7- abre el menú principal'
- '&b/ag wand &7- obtén la varita de reclamo'
- '&b/ag reclamo &7- confirma tu trama'
- '&b/ag visita &7- opciones de viaje abiertas'
- '&b/ag ayuda &7- ver ayuda del comando'
codex_claim_step1_lore:
- '&7Ejecute &b/ag wand &7para recibir'
- '&7el Aegis Scepter.'
- ' '
- '&ePaso 1:&7 Sostén la varita en tu mano.'
- '&ePaso 2:&7 Haga clic derecho en el primer bloque de la esquina.'
- '&ePaso 3:&7 Haga clic izquierdo en el bloque de la esquina opuesta.'
- '&8La varita debe marcar la tierra, no ubicarse.'
codex_claim_step2_lore:
- '&7Elige dos rincones del mismo mundo'
- '&7para delinear el área que desea.'
- ' '
- '&eClic derecho:&7 primera esquina'
- '&eClic izquierdo:&7 segunda esquina'
- '&eConsejo:&7 Mantenga suficiente espacio para caminos,'
- '&7almacenamiento, granjas y crecimiento futuro.'
- ' '
- '&8AegisGuard mostrará el tamaño seleccionado'
- '&8en el chat antes de confirmar el reclamo.'
codex_claim_step3_lore:
- '&7Después de marcar ambas esquinas, use'
- '&a/ag reclamo &7para crear la trama.'
- ' '
- '&eComando:&7 /ag reclamo'
- '&7El complemento verifica la superposición, los límites,'
- '&7y costo antes de crear la trama.'
- '&8Si falla, lea el error de chat rojo'
- '&8línea para ver qué bloqueó el reclamo.'
codex_claim_group_lore:
- '&7Las tramas compartidas comienzan con un grupo real,'
- '&7no es un reclamo personal normal.'
- ' '
- '&eCrear:&7 /ag grupo crear <nombre>'
- '&eInvitación:&7 /ag grupo invita <jugador>'
- '&eDepósito:&7 /ag depósito grupal <monto>'
- '&eReclamo:&7 /ag reclamo de grupo'
- ' '
- '&8Lo mejor para ciudades, salas de gremios, mercados,'
- '&8y proyectos compartidos a largo plazo.'
codex_claim_limits_lore:
- '&7Un reclamo debe encajar de manera segura en el mundo'
- '&7antes de AegisGuard lo permitirá.'
- ' '
- '&7No puede superponerse a otras tramas,'
- '&7romper los límites del radio mundial o ingresar'
- '&7terreno protegido de complementos compatibles.'
- ' '
- '&8Esto te protege a ti y a tus seres queridos'
- '&8jugadores de conflictos fronterizos complicados.'
codex_claim_starter_lore:
- '&7Muchos servidores ofrecen un reclamo inicial'
- '&7o terreno del grupo inicial basado en'
- '&7las reglas de primera reclamación configuradas.'
- ' '
- '&7Algunos servidores dan terrenos gratis primero.'
- '&7Otros requieren ClaimBlocks, dinero,'
- '&7o financiación de tesorería del grupo primero.'
codex_claim_group_money_lore:
- '&7La tesorería del grupo es financiación compartida para'
- '&7reclamaciones y ampliaciones del grupo.'
- ' '
- '&eDepósito:&7 /ag depósito grupal <monto>'
- '&eEstado:&7 Estado del grupo /ag'
- ' '
- '&8Esto ayuda a todo el grupo a pagar'
- '&8crecimiento en lugar de un solo jugador.'
codex_claim_fail_lore:
- '&7Compruebe si hay superposición, límites mundiales,'
- '&7reglas de tamaño de reclamo, fondos requeridos,'
- '&7o conflictos de protección externa.'
- ' '
- '&7Pruebe en un área más pequeña, aléjese más de'
- '&7reclamaciones cercanas u obtener más recursos'
- '&7antes de volver a intentarlo.'
codex_claim_commands_lore:
- '&e/ag varita &7- consigue el cetro'
- '&e/ag reclamo &7- crear una trama personal'
- '&e/ag reclamo de grupo &7: crear una trama compartida'
- '&e/ag unclaim &7- elimina tu trama actual'
codex_travel_home_lore:
- '&7La casa de tu parcela es el principal punto de retorno'
- '&7para su terreno personal.'
- ' '
- '&eIr a casa:&7 /ag inicio'
- '&eEstablecer generación:&7 /ag setspawn'
- ' '
- '&7Establece tu generación después de construir un'
- '&7entrada, camino o zona de bienvenida.'
- '&8 Configure esto después de construir una entrada o vestíbulo.'
codex_travel_visit_lore:
- '&7El menú Visita es su centro de viaje para'
- '&7parcelas de confianza, tus propias parcelas y'
- '&7ubicaciones de viaje del servidor.'
- ' '
- '&eAbierto:&7 /ag visita'
- ' '
- '&7Esta es la forma más fácil de saltar entre'
- '&7reclamaciones amigables sin recorrer el mapa.'
codex_travel_server_lore:
- '&7Los propietarios de servidores pueden crear servidores administrados'
- '&7destinos de trama de estilo warp para'
- '&7áreas de generación, mercado o exhibición.'
- ' '
- '&7Si su servidor tiene generación, mercado,'
- '&7escaparate o tramas de eventos, pueden'
- '&7aparecen aquí como puntos de viaje.'
codex_travel_tip_lore:
- '&7Establece la generación de tu trama después de reclamar.'
- ' '
- '&7Usa el modo visita para llegar a amigos'
- '&7o tramas confiables más rápido.'
- '&8Mantén tu zona de reaparición despejada para que las llegadas sean seguras.'
codex_travel_trusted_lore:
- '&7Si otro jugador confía en ti, su'
- '&7el diagrama puede aparecer en Visita de forma rápida'
- '&7viajar a terreno compartido o amigo.'
- ' '
- '&7Esto es útil para compilaciones compartidas,'
- '&7proyectos municipales y grupos aliados.'
codex_travel_room_lore:
- '&7Las habitaciones y subparcelas alquiladas pueden tener'
- '&7su propia habitación genera hoteles'
- '&7y mercados más fáciles de navegar.'
- ' '
- '&7Si alquilas una habitación, abre sus controles'
- '&7para gestionar el comportamiento de teletransporte de la sala,'
- '&7acceso de invitados y generación de habitaciones.'
codex_travel_unstuck_lore:
- '&7Utiliza el comando despegar si terminas'
- '&7atrapado en paredes, habitaciones, edificios o'
- '&7rincones incómodos de un reclamo.'
- ' '
- '&eComando:&7 /ag bloqueado'
- ' '
- '&7Úselo antes de pedir ayuda al personal'
- '&7si simplemente estás atrapado en el terreno.'
codex_menus_main_lore:
- '&e/ag menú &7abre el AegisGuard principal'
- '&7panel de control para la mayoría de las acciones del jugador.'
- ' '
- '&7Desde aquí puede acceder a la configuración,'
- '&7viajes, ayuda del códice y herramientas de trazado.'
codex_menus_settings_lore:
- '&7La configuración de parcela controla cómo se'
- '&7se comporta para usted, sus amigos y visitantes.'
- ' '
- '&7Esto incluye entrada, contenedores,'
- '&7mobs, PvP, redstone y más.'
- ' '
- '&7Revíselos después de realizar el reclamo para que su'
- '&7plot se comporta como usted desea.'
codex_menus_members_lore:
- '&7Utilice el menú Miembros para agregar amigos,'
- '&7cambiar roles y gestionar quién puede'
- '&7construye o interactúa en tu parcela.'
- ' '
- '&7Esto es más seguro que compartirlo todo'
- '&7con cada visitante.'
codex_menus_preferences_lore:
- '&7Las preferencias del jugador te permiten administrar'
- '&7idioma, sonidos y notificaciones'
- '&7comportamiento.'
- ' '
- '&7Si un menú parece demasiado ruidoso, esto es'
- '&7donde ajustas tu configuración personal.'
codex_menus_market_lore:
- '&7Los gráficos relacionados con el mercado pueden exponer una'
- '&7Botón Mercado Local para puestos,'
- '&7alquileres y sistemas de tiendas vinculadas.'
- ' '
- '&7Úselo para explorar zonas rentables,'
- '&7abre TradeStalls, o administra tu'
- '&7espacio comercial propio dentro de esa parcela.'
codex_menus_info_lore:
- '&7Este códice está destinado a ser su'
- '&7referencia en el juego cada vez que'
- '&7olvídate de cómo funciona una función.'
- ' '
- '&7Si no está seguro de qué hace un botón,'
- '&7consulte esta guía antes de experimentar.'
codex_security_access_lore:
- '&7Acceso Confiable significa dar otro'
- '&7permiso del jugador para usar tu trama.'
- ' '
- '&7Abrir &eMiembros y roles &7desde el menú principal'
- 'Menú &7 para agregar o actualizar el acceso del jugador.'
- ' '
- '&7Los roles deciden lo que cada miembro puede hacer,'
- '&7desde el simple acceso hasta la gestión completa.'
codex_security_ban_lore:
- '&7Kick elimina a alguien de tu trama'
- '&7ahora mismo. La prohibición les impide venir.'
- '&7hacia atrás hasta levantarlo.'
- ' '
- '&ePatada:&7 /ag patada <jugador>'
- ' '
- '&eBan:&7 /ag ban <jugador>'
- '&eDesbanear:&7 /ag desbanear <jugador>'
codex_security_flags_lore:
- '&7Las banderas de protección son el interruptor principal'
- '&7reglas para tu trama.'
- ' '
- '&7Controlan entradas, contenedores,'
- '&7vehículos, redstone, mobs, PvP y más.'
- ' '
- '&7Estas son las principales reglas que dan forma'
- '&7qué tan segura o abierta se siente tu trama.'
codex_security_notify_lore:
- '&7Utilice la configuración de notificaciones para controlar'
- '&7reclamar saludos y actualizaciones de administrador'
- '&7por separado.'
- ' '
- '&7Esto le ayuda a mantener alertas útiles mientras'
- '&7apagando los que no deseas.'
codex_security_room_lore:
- '&7Las habitaciones y las subtramas dejan un reclamo principal'
- '&7mantiene espacios protegidos más pequeños en su interior.'
- ' '
- '&7Los inquilinos pueden administrar su habitación mientras'
- '&7el propietario principal aún mantiene la supervisión.'
- ' '
- '&7Esto es útil para hoteles, apartamentos,'
- '&7puestos de mercado y recintos gremiales.'
codex_security_entities_lore:
- '&7Las parcelas pueden proteger contenedores,'
- '&7entidades decorativas, vehículos,'
- '&7y muchos vectores de duelo comunes.'
- ' '
- '&7Eso incluye los tipos de pequeñas penas'
- '&7intentos que la gente suele pasar por alto.'
codex_security_staff_lore:
- '&7Acceso al personal del servidor significa administradores o'
- '&7los grupos de personal pueden gestionar parcelas especiales'
- '&7sin depender del bypass manual.'
- ' '
- '&7Esto está destinado a zonas de servidor,'
- '&7parcelas de mercado y otras áreas gestionadas.'
- ' '
- '&7Esto reduce la necesidad de depender de'
- '&7bypass manual para trabajo rutinario del personal.'
codex_economy_blocks_lore:
- '&7ClaimBlocks son uno de los principales'
- '&7monedas de progresión en AegisGuard.'
- ' '
- '&e/ag bloquea &7muestra tu saldo y'
- '&7comandos de bloqueo de reclamos relacionados.'
- '&7Puedes ganarlos jugando,'
- '&7nivelación, intercambio u otras reglas del servidor.'
codex_economy_upkeep_lore:
- '&7Mantenimiento significa que tu servidor cobra'
- '&7mantenimiento regular o impuestos para terrenos.'
- ' '
- '&7Las advertencias se pueden enviar a través'
- '&7AegisGuard notificaciones.'
- '&8Si el mantenimiento está habilitado, no lo ignore'
- '&8advertencias sobre próximos costos.'
codex_economy_market_lore:
- '&7Usar el mercado y el mercado local'
- '&7sistemas para venta de terrenos, alquiler de zonas,'
- '&7o navegar por TradeStalls.'
- ' '
- '&7Algunos servidores mantienen esto global, mientras que'
- '&7otros permiten a los jugadores crear mercados inmobiliarios.'
codex_economy_expand_lore:
- '&7Las expansiones le permiten hacer crecer una existente'
- '&7traza cuándo están tus fronteras actuales'
- '&7demasiado pequeño para tus planes.'
- ' '
- '&7Algunos servidores utilizan colas de aprobación.'
- '&7Otros permiten solicitudes válidas al instante.'
- ' '
- '&7Si tu frontera se siente estrecha, esta es'
- '&7cómo cultivarlo de forma segura.'
codex_economy_stalls_lore:
- '&7TradeStalls permite que los vendedores creen'
- '&7escaparates protegidos con base en cofres'
- '&7dentro de mercados locales y áreas rentables.'
- ' '
- '&7Funcionan incluso si el servidor no lo hace'
- '&7use un complemento de tienda de terceros independiente.'
codex_economy_stall_setup_lore:
- '&7Para construir un TradeStall, coloque un'
- '&7cofre o barril apoyado primero.'
- ' '
- '&7Luego agregue un letrero de puesto válido y use'
- '&7el menú del puesto para fijar precios, cantidad,'
- '&7y qué moneda acepta el puesto.'
- ' '
- '&7Los servidores pueden permitir dinero, ClaimBlocks,'
- '&7o ambos para conocer el precio del puesto.'
codex_economy_currency_lore:
- '&7Los servidores pueden permitir dinero, ClaimBlocks,'
- '&7o ambos según la característica'
- '&7y las reglas de la economía configurada.'
- ' '
- '&7Lee atentamente cada menú para que lo sepas'
- '&7qué moneda utilizará esa acción.'
codex_economy_warning_lore:
- '&7Avisos de tesorería baja, avisos de mantenimiento,'
- '&7y se pueden enviar costos de expansión'
- 'Notificaciones &7a través de AegisGuard.'
- ' '
- '&7Si los ignoras por mucho tiempo, tu'
- '&7la siguiente acción puede fallar inesperadamente.'
codex_identity_name_lore:
- '&7Identidad de trama significa cómo es tu trama'
- '&7presentado a visitantes y menús.'
- ' '
- '&eRenombrar:&7 /ag renombrar <nombre>'
- ' '
- '&eDescripción:&7 /ag setdesc <texto>'
- '&7Un buen nombre y descripción ayudan a las personas'
- '&7comprende para qué sirve tu trama.'
codex_identity_cosmetics_lore:
- '&7Los cosméticos son toques visuales para tu'
- '&7trama, como partículas o efectos de entrada.'
- ' '
- '&7Estos no suelen cambiar de propietario'
- '&7o seguridad. Cambian de presentación.'
- ' '
- '&7Úsalos para hacer que tu trama se sienta más'
- '&7distinto sin cambiar su finalidad.'
codex_identity_presentation_lore:
- '&7La presentación cubre el estilo visible'
- '&7de una trama, desde el naming hasta la cosmética'
- '&7y cómo se siente visitarlo.'
- ' '
- '&7Usa esto para hacer que un distrito se sienta'
- '&7claro, acogedor y memorable'
- '&7sin cambiar las reglas de propiedad.'
codex_identity_stuck_lore:
- '&7Unstuck es una herramienta de recuperación para cuando'
- '&7te quedas atrapado en paredes, construcciones,'
- '&7reclamaciones o generación de habitaciones defectuosas.'
- ' '
- '&eComando:&7 /ag bloqueado'
- ' '
- '&7Es un mando de seguridad práctico, incluso'
- '&7aunque también afecta el flujo de jugadores.'
codex_identity_greeting_lore:
- '&7Saludos y Títulos son bienvenidos'
- '&7mensajes que se muestran cuando alguien ingresa'
- '&7o deja una trama.'
- ' '
- '&7Úselos para dar la bienvenida a los invitados, etiquetar'
- '&7tiendas, o darle un toque temático a una trama.'
- ' '
- '&7Este es un buen lugar para recibir invitados.'
- '&7o tiendas de etiquetas y zonas especiales.'
codex_identity_showcase_lore:
- '&7La presentación es lo pulida y fácil'
- '&7para comprender lo que los demás sienten sobre tu trama.'
- ' '
- '&7Un nombre claro, una buena descripción, un'
- '&7generación segura y elementos visuales coincidentes'
- '&7ayuda a los visitantes a recordar la trama.'
- ' '
- '&7Los pequeños detalles de presentación hacen que tu'
- 'La trama &7 se siente mucho más completa.'
codex_advanced_level_lore:
- '&7Mejoras de nivelación o ascensión de la trama'
- '&7tu trama en niveles más fuertes con el tiempo.'
- ' '
- '&7Cada nivel puede desbloquear nuevas ventajas,'
- '&7bonificaciones o beneficios de progresión.'
- ' '
- '&7Abre Plot Ascension para obtener una vista previa de lo que'
- '&7el siguiente nivel realmente te lo dará.'
codex_advanced_zones_lore:
- '&7Las zonas dividen un reclamo principal en'
- '&7espacios más pequeños con propósito propio.'
- ' '
- '&7Úselos para habitaciones, alquileres, puestos,'
- '&7oficinas, apartamentos o alas del gremio.'
- ' '
- '&7Esta es una de las mejores herramientas para posadas,'
- '&7hoteles, centros comerciales y edificios de departamentos.'
codex_advanced_local_market_lore:
- '&7Local Market es un centro de mercado basado en parcelas'
- '&7para puestos, alquileres y herramientas de tiendas vinculadas.'
- ' '
- '&7Si una parcela admite características del mercado,'
- '&7aquí es donde los jugadores exploran lo que eso'
- '&7la trama específica tiene para ofrecer.'
- ' '
- '&7Eso hace que las tiendas se sientan locales en lugar de'
- '&7volcar todo en un menú global.'
codex_advanced_recovery_lore:
- '&7Las herramientas de recuperación ayudan al personal a reparar daños,'
- '&7restaurar reclamos e investigar problemas.'
- ' '
- '&7Esto incluye diagnóstico, migración,'
- '&7instantáneas y acciones de restauración.'
- ' '
- '&7Estas herramientas son especialmente importantes'
- '&7en servidores públicos o de larga duración.'
codex_advanced_tip_lore:
- '&7Revise su configuración después de reclamar,'
- '&7mantén tu generación actualizada y usa'
- '&7agrupa herramientas cuidadosamente en parcelas compartidas.'
- ' '
- '&7Una pequeña revisión temprana puede ahorrar mucho'
- '&7de confusión más tarde.'
codex_advanced_migration_lore:
- '&7Las herramientas de migración ayudan a los administradores a trasladar tierras'
- '&7de complementos de protección compatibles a'
- '&7AegisGuard con menos retrabajo manual.'
- ' '
- '&7Utilice la herramienta de migración y obtenga una vista previa de la interfaz de usuario'
- '&7antes de confirmar las reclamaciones importadas.'
- ' '
- '&8Esto está destinado a la configuración del servidor o'
- '&8cambio de complementos de protección.'
codex_advanced_snapshot_lore:
- '&7Las instantáneas registran el estado de la trama para que el personal'
- '&7puede revertirse o restaurarse más tarde si es necesario.'
- ' '
- '&7Son útiles después de accidentes, duelos,'
- '&7malas expansiones o situaciones de reversión.'
- ' '
- '&7Son especialmente útiles después de las malas'
- '&7expansiones, problemas o problemas con el servidor.'
codex_advanced_diagnostics_lore:
- '&7Los diagnósticos ayudan a los propietarios de servidores a inspeccionar'
- '&7problemas de configuración y estado del complemento.'
- ' '
- '&7Utilice informes médicos y herramientas administrativas para'
- '&7Detecta errores de configuración o sistemas rotos.'
- ' '
- '&7Si algo se siente mal, diagnóstico'
- '&7es el primer lugar donde debe buscar el personal.'
button_admin_reload: '&eRecargar todas las configuraciones'
codex_gui_header_lore:
- '&7Buscar temas de ayuda y actualizar'
- '&7tu memoria cuando lo necesites.'
