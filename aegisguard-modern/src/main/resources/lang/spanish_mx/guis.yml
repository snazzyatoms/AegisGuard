codex_claim_step2_name: '&aSelecciona el Terreno'
codex_claim_step2_lore:
- '&7Elige dos esquinas dentro del mismo mundo.'
- '&7Deja espacio para caminos y crecimiento futuro.'
- '&7El tamaño seleccionado aparecerá en el chat.'
codex_claim_step3_name: '&bConfirma el Reclamo'
codex_claim_step3_lore:
- '&7Usa &a/ag claim &7después de marcar las esquinas.'
- '&7Se revisarán traslapes, límites y costos.'
- '&7Si falla, lee el mensaje rojo del chat.'
codex_claim_group_name: '&6Reclamos Grupales'
codex_claim_group_lore:
- '&7Las parcelas compartidas requieren un grupo real.'
- '&7Invita jugadores y deposita en la tesorería.'
- '&7Usa &b/ag group claim &7cuando estén listos.'
codex_claim_limits_name: '&cSeguridad del Reclamo'
codex_claim_limits_lore:
- '&7La parcela no puede traslapar otros terrenos.'
- '&7También respeta límites mundiales y protecciones.'
- '&7Estas reglas evitan conflictos entre fronteras.'
codex_claim_starter_name: '&aReclamos Iniciales'
codex_claim_starter_lore:
- '&7Cada servidor define sus reglas iniciales.'
- '&7Puede ofrecer terreno gratis o pedir recursos.'
- '&7Consulta los costos antes de confirmar.'
codex_claim_group_money_name: '&6Tesorería Grupal'
codex_claim_group_money_lore:
- '&7La tesorería financia reclamos y expansiones.'
- '&7Deposita con &b/ag group deposit <cantidad>&7.'
- '&7Consulta el saldo con &b/ag group status&7.'
codex_claim_fail_name: '&cSi el Reclamo Falla'
codex_claim_fail_lore:
- '&7Comprueba traslapes, tamaño, límites y fondos.'
- '&7Prueba un área menor o aléjate de otros reclamos.'
- '&7El mensaje del chat indicará la causa exacta.'
codex_claim_commands_name: '&bComandos de Reclamo'
codex_claim_commands_lore:
- '&e/ag wand &7- obtener el cetro'
- '&e/ag claim &7- crear una parcela personal'
- '&e/ag group claim &7- crear una parcela grupal'

codex_travel_title: '&b§lII. Viaje'
codex_travel_lore:
- '&7Administra hogares, visitas y destinos.'
- '&7Viaja a parcelas propias o de confianza.'
- '&7También puedes usar ubicaciones del servidor.'
codex_travel_home_name: '&bHogar de la Parcela'
codex_travel_home_lore:
- '&7Usa &e/ag home &7para volver a tu parcela.'
- '&7Define la llegada con &e/ag setspawn&7.'
- '&7Mantén despejada y segura la zona de llegada.'
codex_travel_visit_name: '&eMenú de Visitas'
codex_travel_visit_lore:
- '&7Usa &e/ag visit &7para abrir el centro de viajes.'
- '&7Incluye parcelas propias y de confianza.'
- '&7También muestra destinos públicos disponibles.'
codex_travel_server_name: '&6Ubicaciones del Servidor'
codex_travel_server_lore:
- '&7El staff puede publicar destinos administrados.'
- '&7Pueden incluir spawn, mercados y eventos.'
- '&7Aparecerán como puntos de viaje disponibles.'
codex_travel_tip_name: '&fConsejos de Viaje'
codex_travel_tip_lore:
- '&7Define el spawn después de reclamar.'
- '&7Usa el menú de visitas para viajar más rápido.'
- '&7Mantén libre el punto de llegada.'
codex_travel_trusted_name: '&aViaje a Parcelas de Confianza'
codex_travel_trusted_lore:
- '&7Las parcelas donde tienes acceso pueden aparecer'
- '&7en el menú de visitas para viajar rápidamente.'
- '&7Es útil para proyectos y grupos aliados.'
codex_travel_room_name: '&6Habitaciones y Alquileres'
codex_travel_room_lore:
- '&7Las habitaciones pueden tener su propio spawn.'
- '&7Esto facilita navegar hoteles y mercados.'
- '&7Administra el acceso desde sus controles.'
codex_travel_unstuck_name: '&eEscape y Recuperación'
codex_travel_unstuck_lore:
- '&7Usa &e/ag stuck &7si quedas atrapado.'
- '&7Te ayuda a salir de muros o lugares difíciles.'
- '&7Pruébalo antes de pedir ayuda al staff.'

codex_menus_title: '&d§lIII. Menús'
codex_menus_lore:
- '&7Conoce los principales paneles de AegisGuard.'
- '&7Administra tu parcela desde un mismo lugar.'
- '&7Cada menú contiene controles especializados.'
codex_menus_main_name: '&dMenú Principal'
codex_menus_main_lore:
- '&e/ag menu &7abre el panel de control principal.'
- '&7Desde allí accedes a ajustes, viajes y ayuda.'
- '&7También encontrarás herramientas de parcela.'
codex_menus_settings_name: '&6Ajustes de Parcela'
codex_menus_settings_lore:
- '&7Controlan entrada, contenedores, mobs y PvP.'
- '&7También incluyen redstone y otras protecciones.'
- '&7Revísalos después de crear tu parcela.'
codex_menus_members_name: '&eMiembros y Roles'
codex_menus_members_lore:
- '&7Agrega amistades y asigna sus permisos.'
- '&7Los roles determinan quién puede construir.'
- '&7Es más seguro que permitir acceso a cualquiera.'
codex_menus_preferences_name: '&3Preferencias'
codex_menus_preferences_lore:
- '&7Configura idioma, sonidos y notificaciones.'
- '&7Estos ajustes son personales para cada jugador.'
- '&7Úsalos para adaptar la experiencia a tu gusto.'
codex_menus_market_name: '&6Mercado Local'
codex_menus_market_lore:
- '&7Explora puestos, alquileres y tiendas vinculadas.'
- '&7Administra tu espacio comercial dentro del terreno.'
- '&7Solo aparece cuando la parcela admite mercados.'
codex_menus_info_name: '&bGuía e Información'
codex_menus_info_lore:
- '&7Esta guía es tu referencia dentro del juego.'
- '&7Consulta aquí los comandos y sistemas.'
- '&7Revisa un capítulo antes de experimentar.'

codex_security_title: '&c§lIV. Seguridad'
codex_security_lore:
- '&7Controla acceso, roles y protecciones.'
- '&7Bloquea visitantes no deseados.'
- '&7Define las reglas de tu parcela.'
codex_security_access_name: '&cAcceso de Confianza'
codex_security_access_lore:
- '&7Da permiso a otros desde Miembros y Roles.'
- '&7Cada rol define las acciones permitidas.'
- '&7Revisa el acceso cuando cambie tu equipo.'
codex_security_ban_name: '&4Expulsar y Bloquear'
codex_security_ban_lore:
- '&e/ag kick <jugador> &7lo expulsa ahora.'
- '&e/ag ban <jugador> &7impide que regrese.'
- '&e/ag unban <jugador> &7retira el bloqueo.'
codex_security_flags_name: '&6Banderas de Protección'
codex_security_flags_lore:
- '&7Controlan entrada, contenedores, vehículos y mobs.'
- '&7También administran PvP, redstone y más.'
- '&7Define si tu parcela será abierta o segura.'
codex_security_notify_name: '&eNotificaciones'
codex_security_notify_lore:
- '&7Controla saludos y avisos administrativos.'
- '&7Conserva las alertas que te resulten útiles.'
- '&7Desactiva por separado las que no quieras.'
codex_security_room_name: '&6Habitaciones y Subparcelas'
codex_security_room_lore:
- '&7Divide un reclamo en espacios protegidos menores.'
- '&7Los inquilinos administran su propia habitación.'
- '&7El propietario mantiene la supervisión general.'
codex_security_entities_name: '&eProtección de Entidades'
codex_security_entities_lore:
- '&7Protege contenedores, decoraciones y vehículos.'
- '&7También bloquea varias formas comunes de grief.'
- '&7Revisa las banderas para ajustar su comportamiento.'
codex_security_staff_name: '&bAcceso del Staff'
codex_security_staff_lore:
- '&7El staff autorizado administra zonas especiales.'
- '&7Es útil para mercados y terrenos del servidor.'
- '&7Reduce el uso cotidiano del modo bypass.'

codex_economy_title: '&6§lV. Economía'
codex_economy_lore:
- '&7Conoce ClaimBlocks, costos y mantenimiento.'
- '&7Compra, vende o alquila espacios protegidos.'
- '&7Cada servidor puede configurar su economía.'
codex_economy_blocks_name: '&6ClaimBlocks'
codex_economy_blocks_lore:
- '&7Son una moneda principal de progresión territorial.'
- '&7Usa &e/ag blocks &7para consultar tu saldo.'
- '&7Puedes obtenerlos según las reglas del servidor.'
codex_economy_upkeep_name: '&eMantenimiento'
codex_economy_upkeep_lore:
- '&7Algunos servidores cobran impuestos periódicos.'
- '&7AegisGuard puede avisarte antes del cobro.'
- '&7No ignores los avisos de saldo insuficiente.'
codex_economy_market_name: '&aMercados'
codex_economy_market_lore:
- '&7Vende parcelas, alquila zonas o visita puestos.'
- '&7El mercado puede ser global o local.'
- '&7Consulta cada anuncio antes de confirmar.'
codex_economy_expand_name: '&bExpansiones'
codex_economy_expand_lore:
- '&7Permiten agrandar una parcela existente.'
- '&7El servidor puede exigir aprobación o costo.'
- '&7Las validaciones evitan invadir otros terrenos.'
codex_economy_stalls_name: '&dTradeStalls'
codex_economy_stalls_lore:
- '&7Son tiendas protegidas basadas en cofres.'
- '&7Funcionan dentro de mercados y zonas rentables.'
- '&7No requieren necesariamente otra tienda externa.'
codex_economy_stall_setup_name: '&eConfigurar un TradeStall'
codex_economy_stall_setup_lore:
- '&7Coloca un cofre o barril compatible.'
- '&7Agrega un letrero válido y abre su menú.'
- '&7Define precio, cantidad y moneda aceptada.'
codex_economy_currency_name: '&bMonedas'
codex_economy_currency_lore:
- '&7Las acciones pueden usar dinero o ClaimBlocks.'
- '&7La configuración del servidor decide cuál aplica.'
- '&7Lee el menú antes de confirmar un pago.'
codex_economy_warning_name: '&cAtiende los Avisos'
codex_economy_warning_lore:
- '&7Recibirás avisos de tesorería, costos o impuestos.'
- '&7Actúa antes de que una operación sea rechazada.'
- '&7Revisa tus notificaciones con frecuencia.'

codex_identity_title: '&3§lVI. Identidad'
codex_identity_lore:
- '&7Personaliza cómo se presenta tu parcela.'
- '&7Define nombre, descripción y efectos visuales.'
- '&7Haz que tus visitantes la reconozcan fácilmente.'
codex_identity_name_name: '&3Identidad de la Parcela'
codex_identity_name_lore:
- '&7Usa &e/ag rename <nombre> &7para nombrarla.'
- '&7Usa &e/ag setdesc <texto> &7para describirla.'
- '&7Una identidad clara orienta a los visitantes.'
codex_identity_cosmetics_name: '&dCosméticos'
codex_identity_cosmetics_lore:
- '&7Añaden partículas y efectos visuales.'
- '&7No cambian la propiedad ni los permisos.'
- '&7Úsalos para distinguir tu parcela.'
codex_identity_presentation_name: '&aPresentación'
codex_identity_presentation_lore:
- '&7Combina nombre, descripción y apariencia.'
- '&7Una llegada segura mejora la experiencia.'
- '&7Mantén un estilo claro y fácil de recordar.'
codex_identity_stuck_name: '&eDesatascarse'
codex_identity_stuck_lore:
- '&7Usa &e/ag stuck &7si quedas atrapado.'
- '&7Sirve dentro de muros, habitaciones o construcciones.'
- '&7Es una herramienta segura de recuperación.'
codex_identity_greeting_name: '&bSaludos y Títulos'
codex_identity_greeting_lore:
- '&7Muestra mensajes al entrar o salir de la parcela.'
- '&7Úsalos para recibir visitantes o anunciar tiendas.'
- '&7Mantén el texto claro y apropiado.'
codex_identity_showcase_name: '&eExhibición'
codex_identity_showcase_lore:
- '&7Un buen nombre y spawn facilitan las visitas.'
- '&7Los detalles visuales vuelven memorable el lugar.'
- '&7Revisa la parcela desde la vista de un visitante.'

codex_advanced_title: '&5§lVII. Avanzado'
codex_advanced_lore:
- '&7Explora progresión, zonas y alquileres.'
- '&7Conoce herramientas de recuperación y diagnóstico.'
- '&7Estos sistemas ofrecen control más profundo.'
codex_advanced_level_name: '&5Nivelación de Parcela'
codex_advanced_level_lore:
- '&7La Ascensión mejora la parcela por niveles.'
- '&7Cada nivel puede desbloquear ventajas.'
- '&7Consulta la siguiente mejora antes de pagar.'
codex_advanced_zones_name: '&6Zonas y Alquileres'
codex_advanced_zones_lore:
- '&7Divide el reclamo en espacios con un propósito.'
- '&7Úsalos para habitaciones, tiendas o apartamentos.'
- '&7Cada zona conserva sus propios controles.'
codex_advanced_local_market_name: '&eMercado Local'
codex_advanced_local_market_lore:
- '&7Es el centro comercial de una parcela específica.'
- '&7Reúne puestos, alquileres y tiendas vinculadas.'
- '&7Así cada mercado conserva su identidad local.'
codex_advanced_recovery_name: '&bRecuperación y Seguridad'
codex_advanced_recovery_lore:
- '&7El staff puede reparar daños e investigar fallas.'
- '&7Incluye diagnósticos, migración y restauración.'
- '&7Es esencial para servidores públicos duraderos.'
codex_advanced_tip_name: '&fBuenas Prácticas'
codex_advanced_tip_lore:
- '&7Revisa los ajustes después de reclamar.'
- '&7Mantén actualizado el spawn de la parcela.'
- '&7Usa con cuidado las herramientas grupales.'
codex_advanced_migration_name: '&6Migración'
codex_advanced_migration_lore:
- '&7Importa terrenos desde plugins compatibles.'
- '&7Obtén una vista previa antes de confirmar.'
- '&7Esta herramienta está destinada al staff.'
codex_advanced_snapshot_name: '&bInstantáneas'
codex_advanced_snapshot_lore:
- '&7Registran el estado de una parcela.'
- '&7Permiten restaurarla después de daños o errores.'
- '&7El staff controla cuándo crear y aplicar copias.'
codex_advanced_diagnostics_name: '&eDiagnósticos'
codex_advanced_diagnostics_lore:
- '&7Ayudan a revisar la configuración y la salud.'
- '&7Los reportes del doctor detectan problemas.'
- '&7El staff debe consultarlos ante cualquier falla.'

