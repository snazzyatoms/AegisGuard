# AegisGuard plugin metadata
name: AegisGuard
main: com.aegisguard.AegisGuard
version: 1.3.0
api-version: "1.20"
prefix: AegisGuard
description: Player-friendly land protection with roles, group plots, admin recovery, and polished GUIs.
authors: [snazzyatoms]
website: https://github.com/snazzyatoms/AegisGuard/wiki
folia-supported: true

# Optional integrations. AegisGuard will hook them when present and stay functional when absent.
softdepend:
  # Economy and utility hooks
  - Coffers
  - CoffersLegacy
  - Vault
  - PlaceholderAPI
  - CoreProtect

  # Map and visual sync hooks
  - Dynmap
  - BlueMap
  - Pl3xMap
  - Squaremap

  # Protection compatibility providers
  - WorldEdit
  - WorldGuard
  - GriefPrevention
  - GriefDefender
  - PlotSquared
  - Towny
  - Residence
  - Lands

  # Gameplay integrations
  - mcMMO
  - Jobs

  # Optional market / shop integrations exposed through the local market hub
  - QuickShop
  - Shopkeepers
  - ChestShop
  - ExcellentShop

commands:
  aegis:
    description: Player command for claims, plot management, groups, travel, and ClaimBlocks.
    usage: "/aegis <subcommand>"
    aliases: [ag, guard]
    permission: aegis.use

  aegisadmin:
    description: Staff command for administration, migration, diagnostics, recovery, and server zones.
    usage: "/aegisadmin <subcommand>"
    aliases: [agadmin, aga]
    permission: aegis.admin

permissions:
  # ---------------------------------------------------------------------------
  # Permission bundles
  # ---------------------------------------------------------------------------
  aegis.*:
    description: Grants every AegisGuard permission node.
    default: op
    children:
      aegis.user: true
      aegis.admin: true

      aegis.market.manage: true
      aegis.staff.co_owner: true
      aegis.staff.market_steward: true

      aegis.claimblocks.gift: true
      aegis.claimblocks.exchange: true
      aegis.claimblocks.buy: true
      aegis.claimblocks.sell: true
      aegis.claimblocks.exchange.bypass: true
      aegis.claimblocks.selllock.bypass: true
      aegisguard.claimblocks.selllock.bypass: true

      aegis.earn.blocks: true
      aegis.admin.migrate: true
      aegis.admin.blocks.view: true
      aegis.admin.blocks.manage: true
      aegis.admin.merge: true
      aegis.admin.doctor.repair: true
      aegis.admin.rentals: true
      aegis.admin.discovery: true
      aegis.admin.activity: true
      aegis.admin.world: true
      aegis.admin.audit: true
      aegis.admin.routes: true

  aegis.user:
    description: Recommended base permissions for regular players.
    default: true
    children:
      aegis.use: true
      aegis.menu: true
      aegis.wand: true
      aegis.claim: true
      aegis.notify: true
      aegis.rent: true
      aegis.discovery: true
      aegis.activity: true
      aegis.claimblocks.gift: true

  aegis.admin:
    description: Recommended administrative permissions.
    default: op
    children:
      aegis.admin.manage: true
      aegis.admin.bypass: true
      aegis.admin.bypass-limits: true
      aegis.serverzone.manage: true
      aegis.market.manage: true
      aegis.reload: true
      aegis.bypass: true
      aegis.consume: true
      aegis.convert: true
      aegis.setwarp: true
      aegis.admin.wand: true
      aegis.admin.migrate: true
      aegis.admin.blocks.view: true
      aegis.admin.blocks.manage: true
      aegis.admin.merge: true
      aegis.admin.doctor.repair: true
      aegis.admin.rentals: true
      aegis.admin.discovery: true
      aegis.admin.activity: true
      aegis.admin.world: true
      aegis.admin.audit: true
      aegis.admin.routes: true
      aegis.notify.bypass: true
      aegis.notify.others: true

  # ---------------------------------------------------------------------------
  # Core player permissions
  # ---------------------------------------------------------------------------
  aegis.use:
    description: Allows use of the main /aegis command.
    default: true

  aegis.menu:
    description: Allows opening the main AegisGuard player menu.
    default: true

  aegis.wand:
    description: Allows receiving and using the standard claim wand.
    default: true

  aegis.claim:
    description: Allows creating and managing personal claims.
    default: true

  aegis.notify:
    description: Allows changing personal AegisGuard notification preferences.
    default: true

  aegis.earn.blocks:
    description: Allows earning ClaimBlocks from supported reward systems.
    default: true

  aegis.rent:
    description: List owned plots for full-plot rental.
    default: true

  aegis.rent.bypass-limit:
    description: Ignore the configured active full-plot rental limit.
    default: op

  aegis.discovery:
    description: Browse public territories and manage plot discovery settings.
    default: true

  aegis.activity:
    description: View activity history for territories the player can manage.
    default: true

  # ---------------------------------------------------------------------------
  # Notification and preference permissions
  # ---------------------------------------------------------------------------
  aegis.notify.bypass:
    description: Receive claim notifications even when the server forces them off.
    default: op

  aegis.notify.others:
    description: Manage notification preferences for other players.
    default: op

  # ---------------------------------------------------------------------------
  # Staff and server-plot permissions
  # ---------------------------------------------------------------------------
  aegis.admin.manage:
    description: Manage plots owned by other players.
    default: op

  aegis.admin.world:
    description: Manage per-world claiming and default plot protection rules.
    default: op

  aegis.admin.bypass:
    description: Toggle runtime bypass mode for protection checks.
    default: op

  aegis.bypass:
    description: Bypass build and interaction protection checks entirely.
    default: op

  aegis.serverzone.manage:
    description: Manage server zones and other staff-owned protected areas.
    default: op

  aegis.market.manage:
    description: Manage public market or utility plots without full admin access.
    default: op

  aegis.staff.co_owner:
    description: Elevated co-owner style access used by configurable staff roles.
    default: false

  aegis.staff.market_steward:
    description: Elevated market steward style access used by configurable staff roles.
    default: false

  aegis.admin.bypass-limits:
    description: Ignore claim count, size, or radius limits where supported.
    default: op

  # ---------------------------------------------------------------------------
  # Economy, migration, and admin utility permissions
  # ---------------------------------------------------------------------------
  aegis.reload:
    description: Reload configuration and language packs.
    default: op

  aegis.convert:
    description: Convert or seize a plot into a server-controlled zone.
    default: op

  aegis.setwarp:
    description: Set server-managed warp points through AegisGuard features.
    default: op

  aegis.consume:
    description: Use administrative ClaimBlock consume tools.
    default: op

  aegis.admin.wand:
    description: Access the administrative wand tools.
    default: op

  aegis.admin.migrate:
    description: Import claims from supported external protection plugins.
    default: op

  aegis.admin.blocks.view:
    description: View another player's ClaimBlock balance.
    default: op

  aegis.admin.blocks.manage:
    description: Add, remove, or set another player's available ClaimBlocks.
    default: op

  aegis.admin.merge:
    description: Merge perfectly aligned adjacent server zones.
    default: op

  aegis.admin.doctor.repair:
    description: Apply confirmation-gated deterministic Doctor repairs.
    default: op

  aegis.admin.rentals:
    description: Cancel rental contracts and retry pending settlements.
    default: op

  aegis.admin.discovery:
    description: Feature or hide plots in public discovery.
    default: op

  aegis.admin.activity:
    description: View activity history for any territory.
    default: op

  aegis.admin.audit:
    description: View the staff Audit Ledger (snapshot restores, Doctor repairs, migrations, admin bypass toggles, and ClaimBlock adjustments).
    default: op

  aegis.admin.routes:
    description: Create and edit exploration routes with ordered checkpoints.
    default: op

  # ---------------------------------------------------------------------------
  # ClaimBlocks gift and exchange permissions
  # ---------------------------------------------------------------------------
  aegis.claimblocks.gift:
    description: Gift available ClaimBlocks to another player (/ag giftblocks or Gift GUI).
    default: true

  aegis.claimblocks.exchange:
    description: Access the ClaimBlocks exchange system.
    default: false

  aegis.claimblocks.buy:
    description: Buy ClaimBlocks with the configured economy provider.
    default: false

  aegis.claimblocks.sell:
    description: Sell ClaimBlocks through the configured exchange system.
    default: false

  aegis.claimblocks.exchange.bypass:
    description: Bypass ClaimBlocks exchange cooldowns and daily limits.
    default: op

  aegis.claimblocks.selllock.bypass:
    description: Bypass ClaimBlocks sell-lock restrictions.
    default: op

  aegisguard.claimblocks.selllock.bypass:
    description: Legacy compatibility node for older sell-lock bypass setups.
    default: op
