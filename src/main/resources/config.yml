# ==============================================================================
# 🛡️ AegisGuard v1.2.4 - Main Configuration
# ==============================================================================
# This file controls how AegisGuard behaves on your server:
# - Where and how claims are stored (YML vs SQL)
# - How much things cost (claims, flags, biomes, cosmetics)
# - Leveling, zoning, auctions, and more
#
# After editing, run:  /agadmin reload   or restart the server.
#
# ⚠️ YAML WARNING:
# - Indentation matters (spaces only, no tabs).
# - Inline maps like { key: value } are valid, but ONE missing space can break the file.
# - If the server prints "InvalidConfigurationException", the config did not parse.
# ==============================================================================


# ------------------------------------------------------------------------------
# ✅ COMPAT (Older code paths may still read these)
# ------------------------------------------------------------------------------
# Some legacy/compat utilities may still use these keys. Keeping them here prevents
# "missing key" surprises when older code reads from the config.
prefix: '&8[&bAegisGuard&8]&r '

language_styles:
  # Default language style for legacy systems (older GUI/messages paths)
  default: old_english

  # Styles/languages allowed in older selectors
  available:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar


# ==============================================================================
# 🌐 LOCALIZATION (Codex Language Engine)
# ==============================================================================
# What this does:
# - Controls your Codex language system (per-player language + fallback behavior).
# Player impact:
# - Players can switch language/style (if you provide a GUI/command for it).
# - Missing keys will fall back to another language (if configured).
localization:
  # Global chat prefix used when the plugin sends messages
  prefix: '&8[&bAegisGuard&8]&r '

  # Folder inside /plugins/AegisGuard/ that contains language files.
  #
  # IMPORTANT:
  # Your startup logs show the jar currently extracts to /plugins/AegisGuard/codex/
  # (Installed language resource: codex/codex.yml, codex/core.yml, etc.)
  #
  # ✅ Keep this as "codex" unless you have moved files or updated extraction to "lang".
  folder: 'codex'

  # Default language used if a player has no preference set
  default_language: old_english

  # Fallback language used if the selected language is missing a key
  fallback_language: modern_english

  # CodexEngine compatibility keys (some builds read *_style instead)
  default_style: old_english
  fallback_style: modern_english

  # Language pack bundle files (merged in this order)
  bundles:
    - guis.yml
    - system.yml
    - upgrades.yml
    - expansions.yml

  # Languages that appear in your language selector GUI (if you have one)
  available_languages:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar

  # If true, AegisGuard attempts to copy default language files from the jar
  # into /plugins/AegisGuard/<folder>/ on first run (or if missing).
  extract_defaults: true

  # If true, can print extra logs when keys are missing (useful for pack dev)
  debug_missing_keys: false


# ==============================================================================
# 🔌 PLUGIN HOOKS & INTEGRATIONS
# ==============================================================================
# What this does:
# - Enables optional integrations (maps, Discord, protection compatibility, etc.)
# Admin impact:
# - Turning these on/off changes what external plugins/services AegisGuard talks to.
hooks:

  # ---------------------------------------------------------------------------
  # 🌍 Web Map Integrations (Dynmap)
  # ---------------------------------------------------------------------------
  # What this does:
  # - Draws claim boundaries on Dynmap as a layer.
  # Player impact:
  # - Players can see claims visually via the web map.
  # Warning:
  # - Large servers with many claims should increase sync interval to reduce load.
  dynmap:
    enabled: true
    layer_name: "AegisGuard Plots"
    sync_interval_minutes: 5
    style:
      stroke_color: "00FF00"
      stroke_opacity: 0.8
      stroke_weight: 3
      fill_color: "00FF00"
      fill_opacity: 0.35

  # ---------------------------------------------------------------------------
  # 📣 Discord Webhook Integration
  # ---------------------------------------------------------------------------
  # What this does:
  # - Sends selected events (claim create/delete/admin actions) to a Discord channel.
  # Warning:
  # - Do NOT leak your webhook URL publicly.
  discord:
    enabled: true
    webhook_url: "https://discord.com/api/webhooks/..."
    events:
      claim_create: true
      claim_delete: true
      claim_merge: true
      admin_actions: true

  # ---------------------------------------------------------------------------
  # 🗺️ Other Map Plugins (Optional)
  # ---------------------------------------------------------------------------
  # What this does:
  # - Enables claim rendering/labels for other map plugins (if your build supports them).
  # Note:
  # - These are often auto-detected. Setting enabled=false prevents drawing even if detected.
  bluemap:
    enabled: true
    label: "Claims"
  pl3xmap:
    enabled: true

  # ---------------------------------------------------------------------------
  # 🧩 Protection Plugin Compatibility (NEW v1.2.4+)
  # ---------------------------------------------------------------------------
  # What this does:
  # - Prevents AegisGuard claims from overlapping other protection systems.
  # Player impact:
  # - Players will be blocked from claiming land inside protected areas from other plugins.
  # Warning:
  # - If you run multiple protection plugins, EXTERNAL_WINS is the safest policy.
  protection_compat:
    enabled: true

    # Policies:
    # - EXTERNAL_WINS: deny Aegis claims inside external regions/claims (recommended)
    # - AEGIS_WINS: ignore other plugins (dangerous unless you know what you're doing)
    # - DENY_IF_CONFLICT: strict deny on any overlap/conflict
    overlap_policy: EXTERNAL_WINS

    # If true, prints extra info about which hook blocked a location.
    debug_logging: false

    # Fine-grained control per hook
    plugins:
      worldguard:
        enabled: true
        priority: 100
      griefprevention:
        enabled: true
        priority: 90
      griefdefender:
        enabled: true
        priority: 90
      towny:
        enabled: true
        priority: 80
      residence:
        enabled: true
        priority: 70


# ==============================================================================
# 💾 DATA STORAGE
# ==============================================================================
# What this does:
# - Controls where plots, player data, and other persistent records are stored.
#
# Supported/Compatible Storage Options (typical setups):
# ✅ YML (Flat File):
#   - Storage type: "yml"
#   - Data is stored in YAML files on disk.
#   - Best for: small servers, testing, simple setups.
#   - Pros: easy backups, no DB needed.
#   - Cons: not ideal for very large servers or frequent writes.
#
# ✅ SQL (Database):
#   - Storage type: "MySQL" (or "mysql" depending on your implementation)
#   - Best for: medium/large servers, multi-server setups, heavier use.
#   - Pros: faster queries at scale, safer concurrency patterns, central storage.
#   - Cons: requires DB credentials and maintenance.
#
# ✅ SQLite (Local DB File):
#   - This is a "SQL database", but stored as a local file (no separate DB server).
#   - Some builds support SQLite using the database.file field below.
#   - If your build does NOT support SQLite, this file setting will be ignored.
#
# ⚠️ IMPORTANT:
# - If you change storage type on a live server, you can strand existing data.
# - Always backup /plugins/AegisGuard/ before switching storage modes.
storage:
  # Options (depending on your build):
  # - "yml"   → flat-file storage in the plugin folder
  # - "MySQL" → SQLDataStore (MySQL/MariaDB remote database)
  #
  # If you want SQLite and your build supports it, it typically runs under SQL mode
  # using the database.file setting (no remote host needed).
  type: "yml"

  database:
    # -------------------------------------------------------------------------
    # SQLite mode (Local .db file)
    # -------------------------------------------------------------------------
    # What this does:
    # - Stores data in a local database file.
    # Best for:
    # - People who want SQL behavior without hosting MySQL/MariaDB.
    # Warning:
    # - Not all builds enable SQLite. If unsupported, this does nothing.
    file: "aegisguard.db"

    # -------------------------------------------------------------------------
    # MySQL / MariaDB mode (Remote SQL)
    # -------------------------------------------------------------------------
    # What this does:
    # - Stores data in a remote database.
    # Best for:
    # - Larger servers, networks, or setups needing robust persistence.
    # Warning:
    # - Do NOT share credentials publicly. Use a restricted DB user.
    #
    # host: "localhost"
    # port: 3306
    # database: "aegisguard"
    # username: "root"
    # password: "password"
    # useSSL: false


# ==============================================================================
# 💱 CURRENCY MAPPING
# ==============================================================================
# What this does:
# - Chooses which economy/currency backend is used per feature category.
# Player impact:
# - Determines whether actions cost money/items/other currencies (depending on your system).
#
# Common types:
# - VAULT: uses Vault economy (requires Vault + an economy plugin)
# - ITEM:  (if supported) costs items instead of money
currencies:
  claiming: VAULT
  resizing: VAULT
  flight: VAULT
  biomes: VAULT
  teleport: VAULT
  leveling: VAULT


# ==============================================================================
# 💰 ECONOMY & PRICES
# ==============================================================================
# What this does:
# - Enables claim costs, resize costs, and paid unlocks.
# Player impact:
# - Players may need money/items to claim/upgrade/use features.
# Warning:
# - If use_vault=true, you MUST have Vault + an economy plugin installed.
economy:
  enabled: true
  use_vault: true

  # Base cost to claim a plot (if enabled by your claim logic)
  claim_cost: 100.0

  # Optional item-based cost pattern (if your build supports it in your claim logic)
  item_cost:
    type: DIAMOND
    amount: 5

  # Costs to enable certain paid flags/features
  flag_costs:
    fly: 5000.0
    shop-interact: 500.0

  # How much it costs per block when resizing/expanding
  resize_cost_per_block: 10.0

  # Refund behavior when unclaiming
  refund_on_unclaim: true
  refund_percent: 50.0


# ==============================================================================
# 🧱 CLAIMS & PER-WORLD RULES
# ==============================================================================
# What this does:
# - Controls base claim limits, allowed sizes, merge rules, and per-world overrides.
# Player impact:
# - Determines how many claims a player can have and how big they may be.
# Warnings:
# - Large max_area values can increase server workload depending on checks/holograms/maps.
claims:
  max_claims_per_player: 2
  min_radius: 5
  max_radius: 64
  max_area: 16000
  preview_seconds: 10

  # Whether claiming consumes the wand item
  consume_wand_on_claim: true

  # Whether admins keep wands even if normal players would consume them
  admin_keep_wand: true

  merging:
    enabled: true
    cost: 500.0
    require_alignment: true

  travel_system:
    enabled: true
    allow_home_teleport: true
    allow_visit_teleport: true

  # World-specific overrides (use your actual world folder names)
  per_world:
    world:
      allow_claims: true
      use_vault: true
      vault_cost: 100.0
      max_claims_per_player: 2
      max_radius: 64

    world_nether:
      allow_claims: true
      use_vault: false
      max_claims_per_player: 1
      max_radius: 32

    world_the_end:
      allow_claims: false


# ==============================================================================
# 🧱 CLAIM BLOCK ECONOMY (NEW v1.2.4)
# ==============================================================================
# What this does:
# - Enables a “claim blocks” progression economy.
# Player impact:
# - Players have a block budget that limits how much land they can claim.
# Why it’s good:
# - Prevents day-1 megaclaims and encourages fair growth over time.
claim_blocks:
  enabled: true

  # Starting budget given to new players
  starting_blocks: 1000

  # First-claim limiter: prevents first-time claims from being huge
  first_claim_limit:
    enabled: true
    max_area: 1000

  earn:
    # Passive earning over time
    playtime:
      enabled: true
      interval_minutes: 10
      blocks_per_interval: 50
      notify: true

    # Earn blocks on leveling up (if your leveling system triggers this)
    level_up:
      enabled: true
      per_level: 500


# ==============================================================================
# 📐 LAND EXPANSIONS (REQUESTS)
# ==============================================================================
# What this does:
# - Controls how expansion requests cost and scale.
# Player impact:
# - Expansions may get more expensive over time to prevent runaway growth.
expansions:
  cost_per_block: 10.0
  cost_multiplier: 1.1
  max_radius_global: 200
  buffer_zone: 5


# ==============================================================================
# 🏗️ ZONING (SUB-CLAIMS / RENTABLE ROOMS)
# ==============================================================================
# What this does:
# - Enables sub-claims inside a plot (rooms/shops/rentable spaces).
# Player impact:
# - Plot owners can create zones and potentially rent/manage them.
zoning:
  enabled: true
  max_zones_per_plot: 10
  landlord_gets_full_rent: true


# ==============================================================================
# 📈 PLOT LEVELING (RPG ASCENSION)
# ==============================================================================
# What this does:
# - Adds an RPG leveling progression system to plots.
# Player impact:
# - Players can level plots for effects, perks, member slots, and flags.
# Warning:
# - High-level perk stacking can affect balance. Tune rewards thoughtfully.
leveling:
  enabled: true
  base_cost: 1000.0
  cost_multiplier: 1.5
  max_level: 30

  # If true, the plot automatically expands when leveling (if implemented)
  expand_plot_on_levelup: false
  expansion_amount: 5

  # Rewards granted per level (format depends on your implementation)
  rewards:
    1:
