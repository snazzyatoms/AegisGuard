# ==============================================================================
# 🛡️ AegisGuard v1.2.4 - Main Configuration
# ==============================================================================
# This file controls how AegisGuard behaves on your server:
# - Where and how claims are stored (YML vs SQL)
# - How much things cost (claims, flags, biomes, cosmetics)
# - Leveling, zoning, auctions, and more
#
# After editing, run:  /agadmin reload   or restart the server.
# ==============================================================================


# ==============================================================================
# 🌐 LOCALIZATION (Codex Language Engine)
# ==============================================================================
localization:
  # Global chat prefix (previously how messages.yml handled it)
  prefix: '&8[&bAegisGuard&8]&r '

  # Folder inside /plugins/AegisGuard/ that contains language folders
  # Example: /plugins/AegisGuard/lang/old_english/guis.yml
  folder: 'lang'

  # Default language folder to use when a player has no preference set
  default_language: old_english

  # If a key is missing in the selected language, try this language next
  fallback_language: modern_english

  # The files that make up ONE language pack (loaded + merged in this order)
  bundles:
    - guis.yml
    - system.yml
    - upgrades.yml
    - expansions.yml

  # Optional: limit what shows in the language selector GUI
  available_languages:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar

  # When true, the plugin should copy default language files from the jar
  # into /plugins/AegisGuard/lang/ on first run (or if missing).
  extract_defaults: true

  # Debug helpers (optional)
  debug_missing_keys: false


# ==============================================================================
# 🔌 PLUGIN HOOKS & STORAGE BACKEND
# ==============================================================================
hooks:
  # ---------------------------------------------------------------------------
  # 🌍 Web Map Integrations
  # ---------------------------------------------------------------------------
  dynmap:
    enabled: true
    layer_name: "AegisGuard Plots"
    sync_interval_minutes: 5
    style:
      stroke_color: "00FF00"
      stroke_opacity: 0.8
      stroke_weight: 3
      fill_color: "00FF00"
      fill_opacity: 0.35

  # Dynmap is optional. If disabled, claims will not be drawn on the web map.

  # ---------------------------------------------------------------------------
  # 📣 Discord Webhook Integration
  # ---------------------------------------------------------------------------
  discord:
    enabled: true
    # Paste your Webhook URL here:
    #  - Discord Channel → Edit Channel → Integrations → Webhooks
    webhook_url: "https://discord.com/api/webhooks/..."
    # Choose which events send a notification to Discord:
    events:
      claim_create: true
      claim_delete: true
      claim_merge: true
      admin_actions: true

  # ---------------------------------------------------------------------------
  # 🗺️ Other Map Plugins (Auto-detected in Map Manager)
  # ---------------------------------------------------------------------------
  bluemap:
    enabled: true
    label: "Claims"
  pl3xmap:
    enabled: true

  # ---------------------------------------------------------------------------
  # 🧩 Protection Plugin Compatibility (NEW v1.2.4+)
  # ---------------------------------------------------------------------------
  # If enabled, AegisGuard will check other protection plugins (WorldGuard, Towny, etc.)
  # before claiming land, to avoid fighting over the same area.
  protection_compat:
    enabled: true

    # Policies:
    # - EXTERNAL_WINS: deny Aegis claims inside external regions/claims
    # - AEGIS_WINS: ignore other plugins (not recommended unless you know what you're doing)
    # - DENY_IF_CONFLICT: same as external wins for claim creation (strict)
    overlap_policy: EXTERNAL_WINS

    # If true, prints extra info about which hook blocked a location.
    debug_logging: false

    # Fine-grained control per hook
    plugins:
      worldguard:
        enabled: true
        priority: 100
      griefprevention:
        enabled: true
        priority: 90
      griefdefender:
        enabled: true
        priority: 90
      towny:
        enabled: true
        priority: 80
      residence:
        enabled: true
        priority: 70


# ------------------------------------------------------------------------------
# 💾 DATA STORAGE
# ------------------------------------------------------------------------------
storage:
  # Options: "yml" (local file) or "MySQL" (database via SQLDataStore)
  type: "yml"

  database:
    # SQLite mode (local .db file, no external SQL server required):
    file: "aegisguard.db"

    # If you want MySQL/MariaDB instead:
    # host: "localhost"
    # port: 3306
    # database: "aegisguard"
    # username: "root"
    # password: "password"
    # useSSL: false


# ==============================================================================
# 💱 CURRENCY MAPPING
# ==============================================================================
currencies:
  claiming: VAULT
  resizing: VAULT
  flight: VAULT
  biomes: VAULT
  teleport: VAULT
  leveling: VAULT


# ==============================================================================
# 💰 ECONOMY & PRICES
# ==============================================================================
economy:
  enabled: true
  use_vault: true
  claim_cost: 100.0

  item_cost:
    type: DIAMOND
    amount: 5

  flag_costs:
    fly: 5000.0
    shop-interact: 500.0

  resize_cost_per_block: 10.0

  refund_on_unclaim: true
  refund_percent: 50.0


# ==============================================================================
# 🧱 CLAIMS & PER-WORLD RULES
# ==============================================================================
claims:
  max_claims_per_player: 2
  min_radius: 5
  max_radius: 64
  max_area: 16000
  preview_seconds: 10

  consume_wand_on_claim: true
  admin_keep_wand: true

  merging:
    enabled: true
    cost: 500.0
    require_alignment: true

  travel_system:
    enabled: true
    allow_home_teleport: true
    allow_visit_teleport: true

  per_world:
    world:
      allow_claims: true
      use_vault: true
      vault_cost: 100.0
      max_claims_per_player: 2
      max_radius: 64

    world_nether:
      allow_claims: true
      use_vault: false
      max_claims_per_player: 1
      max_radius: 32

    world_the_end:
      allow_claims: false


# ==============================================================================
# 🧱 CLAIM BLOCK ECONOMY (NEW v1.2.4)
# ==============================================================================
claim_blocks:
  enabled: true

  starting_blocks: 1000

  first_claim_limit:
    enabled: true
    max_area: 1000

  earn:
    playtime:
      enabled: true
      interval_minutes: 10
      blocks_per_interval: 50
      notify: true

    level_up:
      enabled: true
      per_level: 500


# ==============================================================================
# 📐 LAND EXPANSIONS (REQUESTS)
# ==============================================================================
expansions:
  cost_per_block: 10.0
  cost_multiplier: 1.1
  max_radius_global: 200
  buffer_zone: 5


# ==============================================================================
# 🏗️ ZONING (SUB-CLAIMS / RENTABLE ROOMS)
# ==============================================================================
zoning:
  enabled: true
  max_zones_per_plot: 10
  landlord_gets_full_rent: true


# ==============================================================================
