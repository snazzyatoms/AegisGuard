# ==============================================================================
# 🛡️ AegisGuard v1.2.4 - Main Configuration
# ==============================================================================
# This file controls how AegisGuard behaves on your server:
# - Where and how claims are stored (YML vs SQL)
# - How much things cost (claims, flags, biomes, cosmetics)
# - Leveling, zoning, auctions, and more
#
# After editing, run:  /agadmin reload   or restart the server.
#
# ⚠️ YAML WARNING:
# - Indentation matters (spaces only, no tabs).
# - Inline maps like { key: value } are valid, but ONE missing space can break the file.
# - If the server prints "InvalidConfigurationException", the config did not parse.
# ==============================================================================


# ------------------------------------------------------------------------------
# ✅ COMPAT (Older code paths may still read these)
# ------------------------------------------------------------------------------
prefix: '&8[&bAegisGuard&8]&r '

language_styles:
  # ✅ Optional but recommended: keep legacy default matching localization.default_language
  default: old_english

  # Styles/languages allowed in older selectors
  available:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar


# ==============================================================================
# 🌐 LOCALIZATION (Lang Primary + Codex Fallback)
# ==============================================================================
# What this does:
# - Controls CodexEngine language system (per-player language + fallback behavior).
# - Reads translations from /plugins/AegisGuard/lang/ first.
# - Uses /plugins/AegisGuard/codex/ ONLY as fallback (legacy safety net).
localization:
  prefix: '&8[&bAegisGuard&8]&r '

  # ✅ Primary language folder (split bundles expected):
  # plugins/AegisGuard/lang/<style>/guis.yml
  # plugins/AegisGuard/lang/<style>/system.yml
  # plugins/AegisGuard/lang/<style>/upgrades.yml
  # plugins/AegisGuard/lang/<style>/expansions.yml
  folder: "lang"

  # ✅ Fallback folder (legacy codex.yml + core.yml + old single-file styles supported)
  fallback_folder: "codex"

  # Default language used if a player has no preference set
  default_language: old_english

  # Fallback language used if the selected language is missing a key
  fallback_language: modern_english

  # CodexEngine compatibility keys (some builds read *_style instead)
  default_style: old_english
  fallback_style: modern_english

  # Language pack bundle files (merged in this order)
  bundles:
    - guis.yml
    - system.yml
    - upgrades.yml
    - expansions.yml

  # Languages that appear in your language selector GUI (if you have one)
  available_languages:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar

  # If true, AegisGuard attempts to copy default language files from the jar
  # into /plugins/AegisGuard/<folder>/ on first run (or if missing).
  #
  # NOTE:
  # Your CodexEngine already fails silently if a resource doesn't exist.
  # The WARN spam you saw is coming from AegisGuard.java's installer logger,
  # which we’ll patch next to only extract resources that exist in the jar.
  extract_defaults: true

  debug_missing_keys: false

  # Per-player language preferences stored here (UUID -> style id).
  # (CodexEngine will auto-create this section if missing, but defining it keeps config tidy.)
  player_styles: {}


# ==============================================================================
# 🔌 PLUGIN HOOKS & INTEGRATIONS
# ==============================================================================
hooks:
  dynmap:
    enabled: true
    layer_name: "AegisGuard Plots"
    sync_interval_minutes: 5
    style:
      stroke_color: "00FF00"
      stroke_opacity: 0.8
      stroke_weight: 3
      fill_color: "00FF00"
      fill_opacity: 0.35

  discord:
    enabled: true
    webhook_url: "https://discord.com/api/webhooks/..."
    events:
      claim_create: true
      claim_delete: true
      claim_merge: true
      admin_actions: true

  bluemap:
    enabled: true
    label: "Claims"

  pl3xmap:
    enabled: true

  protection_compat:
    enabled: true
    overlap_policy: EXTERNAL_WINS
    debug_logging: false
    plugins:
      worldguard:
        enabled: true
        priority: 100
      griefprevention:
        enabled: true
        priority: 90
      griefdefender:
        enabled: true
        priority: 90
      towny:
        enabled: true
        priority: 80
      residence:
        enabled: true
        priority: 70


# ==============================================================================
# 💾 DATA STORAGE
# ==============================================================================
storage:
  type: "yml"

  database:
    file: "aegisguard.db"
    # host: "localhost"
    # port: 3306
    # database: "aegisguard"
    # username: "root"
    # password: "password"
    # useSSL: false


# ==============================================================================
# 💱 CURRENCY MAPPING
# ==============================================================================
currencies:
  claiming: VAULT
  resizing: VAULT
  flight: VAULT
  biomes: VAULT
  teleport: VAULT
  leveling: VAULT


# ==============================================================================
# 💰 ECONOMY & PRICES
# ==============================================================================
economy:
  enabled: true
  use_vault: true

  claim_cost: 100.0

  item_cost:
    type: DIAMOND
    amount: 5

  flag_costs:
    fly: 5000.0
    shop-interact: 500.0

  resize_cost_per_block: 10.0

  refund_on_unclaim: true
  refund_percent: 50.0


# ==============================================================================
# 🧱 CLAIMS & PER-WORLD RULES
# ==============================================================================
claims:
  max_claims_per_player: 2
  min_radius: 5
  max_radius: 64
  max_area: 16000
  preview_seconds: 10

  consume_wand_on_claim: true
  admin_keep_wand: true

  merging:
    enabled: true
    cost: 500.0
    require_alignment: true

  travel_system:
    enabled: true
    allow_home_teleport: true
    allow_visit_teleport: true

  per_world:
    world:
      allow_claims: true
      use_vault: true
      vault_cost: 100.0
      max_claims_per_player: 2
      max_radius: 64

    world_nether:
      allow_claims: true
      use_vault: false
      max_claims_per_player: 1
      max_radius: 32

    world_the_end:
      allow_claims: false


# ==============================================================================
# 🧱 CLAIM BLOCK ECONOMY (NEW v1.2.4)
# ==============================================================================
claim_blocks:
  enabled: true

  starting_blocks: 1000

  first_claim_limit:
    enabled: true
    max_area: 1000

  earn:
    playtime:
      enabled: true
      interval_minutes: 10
      blocks_per_interval: 50
      notify: true

    level_up:
      enabled: true
      per_level: 500


# ==============================================================================
# 📐 LAND EXPANSIONS (REQUESTS)
# ==============================================================================
expansions:
  cost_per_block: 10.0
  cost_multiplier: 1.1
  max_radius_global: 200
  buffer_zone: 5


# ==============================================================================
# 🏗️ ZONING (SUB-CLAIMS / RENTABLE ROOMS)
# ==============================================================================
zoning:
  enabled: true
  max_zones_per_plot: 10
  landlord_gets_full_rent: true


# ==============================================================================
# 📈 PLOT LEVELING (RPG ASCENSION)
