# ==============================================================================
# 🛡️ AegisGuard v1.2.6 - Main Configuration
# ==============================================================================
# This file controls how AegisGuard behaves on your server:
# - Where and how claims are stored (YML vs SQL)
# - How much things cost (claims, flags, biomes, cosmetics)
# - Leveling, zoning, auctions, and more
#
# After editing, run:  /agadmin reload   or restart the server.
#
# ⚠️ YAML WARNING:
# - Indentation matters (spaces only, no tabs).
# - Inline maps like { key: value } are valid, but ONE missing space can break the file.
# - If the server prints "InvalidConfigurationException", the config did not parse.
# ==============================================================================


# ------------------------------------------------------------------------------
# ✅ COMPAT (Older code paths may still read these)
# ------------------------------------------------------------------------------
prefix: '&8[&bAegisGuard&8]&r '

language_styles:
  # ✅ Optional but recommended: keep legacy default matching localization.default_language
  default: old_english

  # Styles/languages allowed in older selectors
  available:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar


# ==============================================================================
# 🌐 LOCALIZATION (Lang Primary + Codex Fallback)
# ==============================================================================
# What this does:
# - Controls CodexEngine language system (per-player language + fallback behavior).
# - Reads translations from /plugins/AegisGuard/lang/ first.
# - Uses /plugins/AegisGuard/codex/ ONLY as fallback (legacy safety net).
localization:
  prefix: '&8[&bAegisGuard&8]&r '

  # ✅ Primary language folder (split bundles expected):
  # plugins/AegisGuard/lang/<style>/guis.yml
  # plugins/AegisGuard/lang/<style>/system.yml
  # plugins/AegisGuard/lang/<style>/upgrades.yml
  # plugins/AegisGuard/lang/<style>/expansions.yml
  folder: "lang"

  # ✅ Fallback folder (legacy codex.yml + core.yml + old single-file styles supported)
  fallback_folder: "codex"

  # Default language used if a player has no preference set
  default_language: old_english

  # Fallback language used if the selected language is missing a key
  fallback_language: modern_english

  # CodexEngine compatibility keys (some builds read *_style instead)
  default_style: old_english
  fallback_style: modern_english

  # Language pack bundle files (merged in this order)
  bundles:
    - guis.yml
    - system.yml
    - upgrades.yml
    - expansions.yml

  # Languages that appear in your language selector GUI (if you have one)
  available_languages:
    - old_english
    - hybrid_english
    - modern_english
    - spanish_mx
    - spanish_ar

  # If true, AegisGuard attempts to copy default language files from the jar
  # into /plugins/AegisGuard/<folder>/ on first run (or if missing).
  #
  # NOTE:
  # Your CodexEngine already fails silently if a resource doesn't exist.
  # The WARN spam you saw is coming from AegisGuard.java's installer logger,
  # which we'll patch next to only extract resources that exist in the jar.
  extract_defaults: true

  debug_missing_keys: false

  # Per-player language preferences stored here (UUID -> style id).
  # (CodexEngine will auto-create this section if missing, but defining it keeps config tidy.)
  player_styles: {}


# ==============================================================================
# 🔌 PLUGIN HOOKS & INTEGRATIONS
# ==============================================================================
hooks:
  dynmap:
    enabled: true
    layer_name: "AegisGuard Plots"
    sync_interval_minutes: 5
    style:
      stroke_color: "00FF00"
      stroke_opacity: 0.8
      stroke_weight: 3
      fill_color: "00FF00"
      fill_opacity: 0.35

  discord:
    enabled: true
    webhook_url: "https://discord.com/api/webhooks/..."
    events:
      claim_create: true
      claim_delete: true
      claim_merge: true
      admin_actions: true

  bluemap:
    enabled: true
    label: "Claims"

  pl3xmap:
    enabled: true

  protection_compat:
    enabled: true
    overlap_policy: EXTERNAL_WINS
    debug_logging: false
    plugins:
      worldguard:
        enabled: true
        priority: 100
      griefprevention:
        enabled: true
        priority: 90
      griefdefender:
        enabled: true
        priority: 90
      towny:
        enabled: true
        priority: 80
      residence:
        enabled: true
        priority: 70


# ==============================================================================
# 💾 DATA STORAGE
# ==============================================================================
storage:
  type: "yml"

  database:
    file: "aegisguard.db"
    # host: "localhost"
    # port: 3306
    # database: "aegisguard"
    # username: "root"
    # password: "password"
    # useSSL: false


# ==============================================================================
# 💱 CURRENCY MAPPING
# ==============================================================================
currencies:
  claiming: VAULT
  resizing: VAULT
  flight: VAULT
  biomes: VAULT
  teleport: VAULT
  leveling: VAULT


# ==============================================================================
# 💰 ECONOMY & PRICES
# ==============================================================================
economy:
  enabled: true

  # Legacy / existing toggle used throughout the plugin
  use_vault: true

  # NEW (Vault-aware control):
  # - If false, AegisGuard behaves as if Vault does not exist (even if installed).
  # - If true, AegisGuard may use Vault (if present) for any VAULT currency actions.
  vault:
    enabled: true

    # If Vault is disabled or missing, and an action supports blocks,
    # AegisGuard can fall back to claim block progression automatically.
    fallback_to_blocks: true

  claim_cost: 100.0

  item_cost:
    type: DIAMOND
    amount: 5

  flag_costs:
    fly: 5000.0
    shop-interact: 500.0

  resize_cost_per_block: 10.0

  refund_on_unclaim: true
  refund_percent: 50.0

  # ----------------------------------------------------------------------------
  # 💰 FAIR INITIAL PRICING (v1.2.5+)
  # ----------------------------------------------------------------------------
  # Revamps pricing so creating a massive initial claim doesn't bypass costs.
  #
  # OLD MODEL (flat):
  #   - Any claim costs $100 regardless of size
  #   - Players could claim huge areas cheaply, then expansion was expensive
  #
  # NEW MODEL (fair):
  #   - Base cost covers 1 chunk (256 blocks)
  #   - Extra blocks beyond that chunk = expansion rate per block
  #
  # FORMULA:
  #   totalCost = base_cost + max(0, area - base_area) * expansion_rate_per_block
  #
  # EXAMPLES (with defaults below):
  #   - Claim 256 blocks (1 chunk):   $100 + $0     = $100
  #   - Claim 512 blocks (2 chunks):  $100 + $2,560 = $2,660
  #   - Claim 1024 blocks (4 chunks): $100 + $7,680 = $7,780
  #   - Claim 4096 blocks (1 plot):   $100 + $38,400 = $38,500
  #
  # This creates a natural progression where players start small and expand,
  # rather than grabbing massive territory immediately for cheap.
  # ----------------------------------------------------------------------------
  fair_pricing:
    # Master toggle for the fair pricing system
    # If false, uses legacy flat claim_cost for all claims
    enabled: true

    # Base cost covers up to base_area blocks (default: 1 chunk = 256)
    # This is the minimum you pay for any claim
    base_cost: 100.0

    # How many blocks the base_cost covers (default: 16x16 = 256 = 1 chunk)
    # Claims at or under this size pay only base_cost
    base_area: 256

    # Cost per additional block BEYOND base_area
    # Uses resize_cost_per_block as default if not set
    expansion_rate_per_block: 10.0

    # If true: claims smaller than base_area pay proportionally less
    # If false: any claim pays at least base_cost (recommended)
    # Example with true: 128 blocks = $50 (half of base_cost)
    # Example with false: 128 blocks = $100 (full base_cost)
    scale_base_with_area: false

    # Minimum cost floor (prevents $0 claims if scale_base_with_area is true)
    minimum_cost: 10.0

    # --------------------------------------------------------------------------
    # CLAIM BLOCK INTEGRATION (if using claim blocks instead of Vault money)
    # --------------------------------------------------------------------------
    # Multiplier for claim blocks when area exceeds base_area
    # 1.0 = no multiplier (1 block = 1 claim block, as usual)
    # 1.5 = excess blocks cost 50% more claim blocks
    # 2.0 = excess blocks cost double claim blocks
    #
    # Example with 1.5 multiplier, claiming 1000 blocks:
    #   Base area: 256 claim blocks
    #   Extra: (1000 - 256) * 1.5 = 1116 claim blocks
    #   Total: 256 + 1116 = 1372 claim blocks
    claimblock_multiplier: 1.0


# ==============================================================================
# 🧱 CLAIMS & PER-WORLD RULES
# ==============================================================================
claims:
  max_claims_per_player: 2
  min_radius: 5
  max_radius: 64
  max_area: 16000
  preview_seconds: 10

  consume_wand_on_claim: true
  admin_keep_wand: true

  merging:
    enabled: true
    cost: 500.0
    require_alignment: true

  travel_system:
    enabled: true
    allow_home_teleport: true
    allow_visit_teleport: true

  per_world:
    world:
      allow_claims: true
      use_vault: true
      vault_cost: 100.0
      max_claims_per_player: 2
      max_radius: 64

    world_nether:
      allow_claims: true
      use_vault: false
      max_claims_per_player: 1
      max_radius: 32

    world_the_end:
      allow_claims: false


# ==============================================================================
# 🧱 CLAIM BLOCK ECONOMY (v1.2.4+) + EXCHANGE (v1.2.5)
# ==============================================================================
claim_blocks:
  enabled: true

  starting_blocks: 500

  first_claim_limit:
    enabled: true
    max_area: 100

  earn:
    playtime:
      enabled: true
      interval_minutes: 10
      blocks_per_interval: 50
      notify: true

      # Anti-AFK system to prevent idle players from earning blocks
      anti_afk:
        # Master toggle for anti-AFK detection
        enabled: true

        # Minimum active time (in seconds) required during each interval to earn blocks
        # Example: With 10 min intervals and 300 sec requirement, players must be active
        # for at least 5 minutes out of every 10 to earn blocks
        required_activity_seconds: 300

        # Consider player AFK after this many minutes of no activity
        # Players marked AFK will not earn blocks until they become active again
        afk_timeout_minutes: 5

        # What counts as "activity" for anti-AFK detection
        track_movement: true       # Walking, running, flying, swimming
        track_interactions: true   # Block breaking, placing, interactions
        track_combat: true         # Attacking entities/players

    level_up:
      enabled: true
      per_level: 600

  # ==============================================================================
  # 💱 CLAIMBLOCKS EXCHANGE (v1.2.5)
  # ==============================================================================
  # Buy / Sell ClaimBlocks using Vault money (with anti-abuse controls).
  #
  # Profiles:
  # - safe_small     = safest defaults for small/new servers
  # - balanced_mid   = recommended default for most servers
  # - fast_large     = higher throughput for large servers
  # - custom         = use the values in this section directly (ignore profiles)
  #
  # Requires:
  # - economy.use_vault = true
  # - economy.vault.enabled = true
  # - Vault installed + an Economy provider (EssentialsX, CMI, etc.)
  exchange:
    enabled: true

    # safe_small | balanced_mid | fast_large | custom
    profile: safe_small

    # Prevent "free exchange" when Vault exists but no economy provider is active.
    # (Relies on VaultHook being able to detect provider presence.)
    require_vault_provider: true

    # Optional gate: allow buy for everyone but restrict sell to a permission
    sell_requires_permission:
      enabled: false
      permission: "aegis.claimblocks.sell"

    # Optional: restrict exchange to certain worlds only
    worlds_allowed:
      enabled: false
      worlds:
        - world
        - world_nether

    # Permissions used by commands/GUI
    permissions:
      exchange: "aegis.claimblocks.exchange"
      buy: "aegis.claimblocks.buy"
      sell: "aegis.claimblocks.sell"
      bypass_limits: "aegis.claimblocks.exchange.bypass"
      bypass_sell_lock: "aegis.claimblocks.selllock.bypass"

    # Live rates (used when profile: custom OR as fallback if a profile omits a key)
    rates:
      buy_price_per_block: 10.0
      sell_price_per_block: 6.0

    # Anti-abuse limits (cooldown + hourly trade limit + daily caps)
    limits:
      cooldown_seconds: 10
      max_trades_per_hour: 30

      buy:
        min_blocks: 1
        max_blocks_per_trade: 5000
        max_blocks_per_day: 25000
        max_money_per_day: 0.0   # 0 = disabled

      sell:
        min_blocks: 1
        max_blocks_per_trade: 5000
        max_blocks_per_day: 15000
        max_money_per_day: 0.0   # 0 = disabled

    # Fees (money sink) to discourage arbitrage/abuse
    fees:
      buy:
        percent: 2.5
        flat: 0.0
      sell:
        percent: 5.0
        flat: 0.0

    # Sell-lock: prevents instant flip (buy -> sell)
    sell_lock:
      enabled: true
      hold_minutes: 30
      scope: EXCHANGE_PURCHASED_ONLY  # EXCHANGE_PURCHASED_ONLY | ALL
      max_locked_blocks: 0            # 0 = unlimited

    audit:
      enabled: true
      log_to_console: true

    # --------------------------------------------------------------------------
    # PRESET PROFILES (used when profile != custom)
    # --------------------------------------------------------------------------
    profiles:
      safe_small:
        rates:
          buy_price_per_block: 12.0
          sell_price_per_block: 6.0
        limits:
          cooldown_seconds: 15
          max_trades_per_hour: 18
          buy:
            min_blocks: 1
            max_blocks_per_trade: 2000
            max_blocks_per_day: 5000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 1500
            max_blocks_per_day: 2500
            max_money_per_day: 0.0
        fees:
          buy: { percent: 3.0, flat: 0.0 }
          sell: { percent: 8.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 60
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 0

      balanced_mid:
        rates:
          buy_price_per_block: 10.0
          sell_price_per_block: 6.0
        limits:
          cooldown_seconds: 10
          max_trades_per_hour: 30
          buy:
            min_blocks: 1
            max_blocks_per_trade: 5000
            max_blocks_per_day: 25000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 5000
            max_blocks_per_day: 15000
            max_money_per_day: 0.0
        fees:
          buy: { percent: 2.5, flat: 0.0 }
          sell: { percent: 5.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 30
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 0

      fast_large:
        rates:
          buy_price_per_block: 9.0
          sell_price_per_block: 6.5
        limits:
          cooldown_seconds: 5
          max_trades_per_hour: 60
          buy:
            min_blocks: 1
            max_blocks_per_trade: 10000
            max_blocks_per_day: 100000
            max_money_per_day: 0.0
          sell:
            min_blocks: 1
            max_blocks_per_trade: 10000
            max_blocks_per_day: 75000
            max_money_per_day: 0.0
        fees:
          buy: { percent: 2.0, flat: 0.0 }
          sell: { percent: 4.0, flat: 0.0 }
        sell_lock:
          enabled: true
          hold_minutes: 10
          scope: EXCHANGE_PURCHASED_ONLY
          max_locked_blocks: 25000


# ==============================================================================
# 📸 CLAIM SNAPSHOTS (ROLLBACK SYSTEM)
# ==============================================================================
# Snapshots capture plot state before risky operations (expansions, merges).
# Admins can rollback plots to previous states via the Admin GUI.
#
# Data stored in: plugins/AegisGuard/claim-snapshots.yml
snapshots:
  # Master toggle for the snapshot system
  enabled: true

  # Maximum number of snapshots to keep in memory/storage
  # Oldest snapshots are pruned when this limit is exceeded
  max_snapshots: 100

  # How long to keep snapshots (in minutes)
  # 10080 = 7 days, 1440 = 1 day, 0 = keep forever (only max_snapshots applies)
  keep_minutes: 10080

  # Automatic snapshot triggers
  auto_snapshot:
    # Create snapshot before plot expansions are applied
    before_expansion: true

    # Create snapshot before plot merges are applied
    before_merge: true

  # Admin GUI settings for snapshot viewer
  admin_gui:
    # Show snapshot age in human-readable format (e.g., "2d 5h" instead of timestamp)
    human_readable_age: true

    # Items per page in the snapshot browser
    items_per_page: 45

  # Console logging
  logging:
    # Log snapshot creation to console
    log_create: true

    # Log snapshot rollbacks to console
    log_rollback: true

    # Log snapshot deletions to console
    log_delete: true


# ==============================================================================
# 📐 LAND EXPANSIONS (REQUESTS)
# ==============================================================================
expansions:
  # Approval mode for expansion requests:
  # - QUEUE: players submit a request, admins approve/deny in the Admin GUI
  # - INSTANT: requests are auto-approved immediately (still recorded for audit)
  approval_mode: QUEUE

  # Snapshot integration for expansions
  # When enabled, a PRE_EXPANSION snapshot is created before applying any expansion
  # This allows admins to rollback expansions that cause issues
  snapshots:
    enabled: true

  # Optional audit trail controls (used by admin GUI / logs)
  audit:
    enabled: true
    keep_recent_minutes: 60
    include_in_admin_gui_history: true
    save_to_file: true
    log_to_console: true
    max_entries: 250

  # Admin notification settings (for INSTANT mode)
  approval:
    # Notify admins when an expansion is auto-approved (INSTANT mode only)
    notify_admins: true

    # Permission required to receive auto-approval notifications
    notify_permission: "aegis.admin"

  cost_per_block: 10.0
  cost_multiplier: 1.1
  max_radius_global: 200
  buffer_zone: 5


# ==============================================================================
# 🏗️ ZONING (SUB-CLAIMS / RENTABLE ROOMS)
# ==============================================================================
zoning:
  enabled: true
  max_zones_per_plot: 10
  landlord_gets_full_rent: true


# ==============================================================================
# 📈 PLOT LEVELING (RPG ASCENSION)
# ==============================================================================
leveling:
  enabled: true

  # Money upgrades (Vault or other economy types)
  base_cost: 1000.0
  cost_multiplier: 1.5
  max_level: 30

  expand_plot_on_levelup: false
  expansion_amount: 5

  # ---------------------------------------------------------------------------
  # ✅ NEW: UPGRADE PAYMENT METHODS (Vault-aware + blocks alternative)
  # ---------------------------------------------------------------------------
  upgrades:
    # If true and Vault is available/enabled, the GUI can show a "Pay Money" button.
    allow_vault_payment: true

    # If true, the GUI can show a "Spend Blocks" button using claim_blocks currency.
    allow_block_payment: true

    # If Vault is missing/disabled (or economy.use_vault = false, or economy.vault.enabled = false),
    # AegisGuard should hide/disable the money option and fall back to blocks.
    fallback_to_blocks_if_vault_unavailable: true

    # OPTION A (best control): explicit per-level block cost.
    # These values represent the block price to upgrade INTO that level.
    # Example: blocks_costs.2 is the cost to go from Level 1 -> Level 2.
    #
    # Formula used to generate this table (for reference only):
    # cost = (250 * level^2) - 250
