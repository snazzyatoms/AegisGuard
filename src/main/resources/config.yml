  enabled: false
  check_interval_hours: 24
  cost_per_plot: 50.0
  grace_period_days: 7


# ==============================================================================
# ⚖️ AUCTIONS
# ==============================================================================
auction:
  duration_days: 3
  min_bid_increase: 50.0
  owner_cut_percent: 50


# ==============================================================================
# 🌲 WILDERNESS REVERT
# ==============================================================================
wilderness_revert:
  enabled: true
  revert_after_hours: 2
  check_interval_minutes: 10
  revert_batch_size: 500


# ==============================================================================
# ⚙️ PROTECTION DEFAULTS & FLAGS
# ==============================================================================
protections:
  pvp_protection: true
  no_mobs_in_claims: true
  container_protection: true
  pets_protection: true
  entities_protection: true
  farm_protection: true
  tnt-damage: true
  fire-spread: true
  piston-use: true

  fly: false
  entry: true
  shop-interact: false


# ==============================================================================
# 🛡️ ACTIVE MOB BARRIER
# ==============================================================================
mob_barrier:
  enabled: true
  check_interval_ticks: 60
  remove_particles: true


# ==============================================================================
# 🎨 COSMETICS (PARTICLES & ENTRY EFFECTS)
# ==============================================================================
cosmetics:
  border_particles:
    flame:
      material: BLAZE_POWDER
      particle: FLAME
      display-name: "&6Flame Border"
      price: 1000.0
    heart:
      material: POPPY
      particle: HEART
      display-name: "&cHeart Border"
      price: 2500.0
    soul:
      material: SOUL_SAND
      particle: SOUL_FIRE_FLAME
      display-name: "&bSoul Flame Border"
      price: 5000.0
    enchant:
      material: ENCHANTING_TABLE
      particle: ENCHANTMENT_TABLE
      display-name: "&dEnchantment Border"
      price: 3000.0

  entry_effects:
    lightning:
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      particle: FLASH


# ==============================================================================
# 🔮 VISUAL TITLES & NOTIFICATIONS
# ==============================================================================
titles:


  # Claim entry/exit notifications (welcome/farewell title/subtitle + optional chat).
  # Server owners can disable these server-wide, or restrict them to certain groups via permissions.

  claim_enter_exit:
    enabled: true
    # Modes: PER_PLAYER (default), FORCE_ON, FORCE_OFF
    mode: PER_PLAYER

    # If set, only players with this permission will receive the enter/exit notifications.
    # Leave blank to allow everyone (subject to mode + player toggles).
    required_permission: ''

    # Players can toggle their own notifications with /ag notify (if mode is PER_PLAYER).
    allow_player_toggle: true
    default_player_setting: true
    toggle_permission: 'aegis.notify'

    # Users with this permission will still receive notifications even if mode is FORCE_OFF.
    bypass_permission: 'aegis.notify.bypass'

    show_titles: true
    show_chat: true

    show_enter: true
    show_exit: true
  enabled: true
  notification_location: ACTION_BAR
  fade_in: 10
  stay: 40
  fade_out: 10
# ==============================================================================
# 🆘 UNSTUCK COMMAND
# ==============================================================================
unstuck:
  enabled: true
  warmup_seconds: 5
  cooldown_seconds: 300


# ==============================================================================
# 🌿 BIOME CHANGING (BIOME GUI)
# ==============================================================================
biomes:
  enabled: true
  cost_per_change: 2000.0
  allowed:
    - PLAINS
    - FOREST
    - DESERT
    - JUNGLE
    - TAIGA
    - SWAMP
    - CHERRY_GROVE
    - BADLANDS
    - MUSHROOM_FIELDS
    - MEADOW
    - LUSH_CAVES


# ==============================================================================
# 👍 SOCIAL (LIKES / RATING)
# ==============================================================================
social:
  likes_enabled: true
  one_like_per_player: true


# ==============================================================================
# 🧩 ADMIN OPTIONS & SENTINEL'S SCEPTER
# ==============================================================================
admin:
  auto_remove_banned: false
  bypass_claim_limit: false
  broadcast_admin_actions: true
  unlimited_plots: true
  trust_operators: true

  wand:
    material: BLAZE_ROD
    name: "&c&lSentinel's Scepter"
    lore:
      - "&7A tool of absolute authority."
      - " "
      - "&eRight-Click: &fSelect Pos 1"
      - "&eLeft-Click: &fSelect Pos 2"
      - " "
      - "&c⚠ Creates SERVER ZONES directly."


# ==============================================================================
# 🔊 SOUND SCHEME
# ==============================================================================
sounds:
  global_enabled: true
  players: {}

  menu_open:
    sound: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.0

  menu_flip:
    sound: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

  menu_close:
    sound: BLOCK_CHEST_CLOSE
    volume: 0.7
    pitch: 1.0

  confirm:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.7
    pitch: 1.2

  error:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8

  claim_success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2

  unclaim:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 0.9


# ==============================================================================
# 💥 PROTECTION FEEDBACK (DENY EFFECTS)
# ==============================================================================
protection_effects:
  enabled: true

  defaults:
    deny_sound: BLOCK_NOTE_BLOCK_BASS
    deny_particle: SMOKE_NORMAL
    deny_volume: 1.0
    deny_pitch: 1.0

  pvp:
    deny_sound: ENTITY_ENDERMAN_TELEPORT
    deny_particle: REDSTONE
  containers:
    deny_sound: BLOCK_CHEST_LOCKED
    deny_particle: CRIT
  mobs:
    deny_sound: ENTITY_ZOMBIE_ATTACK_IRON_DOOR
    deny_particle: FLAME
  pets:
    deny_sound: ENTITY_CAT_HISS
    deny_particle: HEART
  entities:
    deny_sound: BLOCK_ANVIL_PLACE
    deny_particle: CRIT_MAGIC
  farm:
    deny_sound: BLOCK_CROP_BREAK
    deny_particle: VILLAGER_ANGRY


# ==============================================================================
# 👥 ROLE MANAGEMENT
# - icon: Material name used in GUIs (RolesGUI / Permissions views)
# - display: optional friendly display name used by GUIs (color codes supported)
# - priority: sorting weight (higher = more powerful)
# - permissions: your existing role permission list (unchanged)
# ==============================================================================
roles:
  owner:
    name: "&cOwner"
    display: "&cOwner"
    icon: "NETHERITE_HELMET"
    priority: 100
    permissions: [ "ALL" ]

  co_owner:
    name: "&6Co-Owner"
    display: "&6Co-Owner"
    icon: "DIAMOND_CHESTPLATE"
    priority: 90
    permissions: [ "MANAGE", "BUILD", "CONTAINER", "INTERACT" ]

  steward:
    name: "&dSteward"
    display: "&dSteward"
    icon: "BOOK"
    priority: 80
    permissions: [ "MANAGE", "BUILD" ]

  builder:
    name: "&aBuilder"
    display: "&aBuilder"
    icon: "IRON_PICKAXE"
    priority: 60
    permissions: [ "BUILD" ]

  member:
    name: "&bMember"
    display: "&bMember"
    icon: "CHEST"
    priority: 40
    permissions: [ "INTERACT", "CONTAINER" ]

  visitor:
    name: "&7Visitor"
    display: "&7Visitor"
    icon: "FEATHER"
    priority: 10
    permissions: [ "INTERACT" ]

