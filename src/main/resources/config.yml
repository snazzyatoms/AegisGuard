# ==============================================================================
# 💸 PLOT UPKEEP (RENT-LIKE TAX)
# ==============================================================================
# What this does:
# - Charges recurring costs for owning plots (optional “tax” system).
# Player impact:
# - Players who don’t pay may lose plots (depending on implementation).
# Warning:
# - Enable only if your community wants upkeep mechanics.
upkeep:
  enabled: false
  check_interval_hours: 24
  cost_per_plot: 50.0
  grace_period_days: 7


# ==============================================================================
# ⚖️ AUCTIONS
# ==============================================================================
# What this does:
# - Controls auction behavior (if your plugin has plot auctions).
# Player impact:
# - Players can bid on plots (depending on your auction GUI/commands).
auction:
  duration_days: 3
  min_bid_increase: 50.0
  owner_cut_percent: 50


# ==============================================================================
# 🌲 WILDERNESS REVERT
# ==============================================================================
# What this does:
# - Reverts wilderness changes after X hours (anti-grief / cleanup tool).
# Player impact:
# - Wilderness builds may disappear if built outside claims (if tracked by your system).
# Warning:
# - If you want “freebuild wilderness”, disable this.
wilderness_revert:
  enabled: true
  revert_after_hours: 2
  check_interval_minutes: 10
  revert_batch_size: 500


# ==============================================================================
# ⚙️ PROTECTION DEFAULTS & FLAGS
# ==============================================================================
# What this does:
# - Sets default protection behavior within claims.
# Player impact:
# - Determines what is allowed or denied in a claim unless a plot flag overrides it.
protections:
  pvp_protection: true
  no_mobs_in_claims: true
  container_protection: true
  pets_protection: true
  entities_protection: true
  farm_protection: true
  tnt-damage: true
  fire-spread: true
  piston-use: true

  # Example toggles/flags
  fly: false
  entry: true
  shop-interact: false


# ==============================================================================
# 🛡️ ACTIVE MOB BARRIER
# ==============================================================================
# What this does:
# - Actively removes or blocks mobs from entering claims (depending on implementation).
# Player impact:
# - Claims become “safer zones” from mob pressure.
# Warning:
# - Aggressive mob removal can affect farms. Tune to your community.
mob_barrier:
  enabled: true
  check_interval_ticks: 60
  remove_particles: true


# ==============================================================================
# 🎨 COSMETICS (PARTICLES & ENTRY EFFECTS)
# ==============================================================================
# What this does:
# - Cosmetic purchases like border particles and entry effects.
# Player impact:
# - Visual flair. Pure cosmetics (unless you intentionally make them functional).
cosmetics:
  border_particles:
    flame:
      material: BLAZE_POWDER
      particle: FLAME
      display-name: "&6Flame Border"
      price: 1000.0
    heart:
      material: POPPY
      particle: HEART
      display-name: "&cHeart Border"
      price: 2500.0
    soul:
      material: SOUL_SAND
      particle: SOUL_FIRE_FLAME
      display-name: "&bSoul Flame Border"
      price: 5000.0
    enchant:
      material: ENCHANTING_TABLE
      particle: ENCHANTMENT_TABLE
      display-name: "&dEnchantment Border"
      price: 3000.0

  entry_effects:
    lightning:
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      particle: FLASH


# ==============================================================================
# 🔮 VISUAL TITLES & NOTIFICATIONS
# ==============================================================================
# What this does:
# - Controls action bar/titles shown when entering claims, confirmations, etc.
# Player impact:
# - Better feedback, but too much can feel spammy.
titles:
  enabled: true

  # Where notifications display:
  # - ACTION_BAR (subtle, usually best)
  # - TITLE (big screen text, more dramatic)
  notification_location: ACTION_BAR

  fade_in: 10
  stay: 40
  fade_out: 10


# ==============================================================================
# 🆘 UNSTUCK COMMAND
# ==============================================================================
# What this does:
# - Allows players to escape being stuck (in claim walls, traps, etc.).
# Warning:
# - If teleport abuse is a concern, increase cooldown or add permissions.
unstuck:
  enabled: true
  warmup_seconds: 5
  cooldown_seconds: 300


# ==============================================================================
# 🌿 BIOME CHANGING (BIOME GUI)
# ==============================================================================
# What this does:
# - Allows changing a plot’s biome from a whitelist.
# Player impact:
# - Cosmetic/environmental changes (snow, grass color, mob spawns, etc. depending on biome).
# Warning:
# - Some biomes can affect mob spawns and server balance.
biomes:
  enabled: true
  cost_per_change: 2000.0
  allowed:
    - PLAINS
    - FOREST
    - DESERT
    - JUNGLE
    - TAIGA
    - SWAMP
    - CHERRY_GROVE
    - BADLANDS
    - MUSHROOM_FIELDS
    - MEADOW
    - LUSH_CAVES


# ==============================================================================
# 👍 SOCIAL (LIKES / RATING)
# ==============================================================================
# What this does:
# - Enables player likes/ratings on plots.
# Player impact:
# - Encourages discovery and “best plot” culture.
social:
  likes_enabled: true
  one_like_per_player: true


# ==============================================================================
# 🧩 ADMIN OPTIONS & SENTINEL'S SCEPTER
# ==============================================================================
# What this does:
# - Admin-level toggles, bypasses, and tools.
# Warning:
# - "unlimited_plots" can invalidate progression systems if used widely.
admin:
  auto_remove_banned: false
  bypass_claim_limit: false
  broadcast_admin_actions: true
  unlimited_plots: true
  trust_operators: true

  wand:
    material: BLAZE_ROD
    name: "&c&lSentinel's Scepter"
    lore:
      - "&7A tool of absolute authority."
      - " "
      - "&eRight-Click: &fSelect Pos 1"
      - "&eLeft-Click: &fSelect Pos 2"
      - " "
      - "&c⚠ Creates SERVER ZONES directly."


# ==============================================================================
# 🔊 SOUND SCHEME
# ==============================================================================
# What this does:
# - Defines named sound presets used by menus, confirms, errors, etc.
# Player impact:
# - Better feedback and “game feel”.
# YAML Safety:
# - Expanded mapping (below) is safer than inline { sound: X, volume: Y }.
sounds:
  global_enabled: true

  # Per-player overrides can be stored here if your system supports it.
  players: {}

  menu_open:
    sound: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.0

  menu_flip:
    sound: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

  menu_close:
    sound: BLOCK_CHEST_CLOSE
    volume: 0.7
    pitch: 1.0

  confirm:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.7
    pitch: 1.2

  error:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8

  claim_success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2

  unclaim:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 0.9


# ==============================================================================
# 💥 PROTECTION FEEDBACK (DENY EFFECTS)
# ==============================================================================
# What this does:
# - Plays particles/sounds when an action is denied (PVP blocked, container blocked, etc.)
# Player impact:
# - Players understand instantly WHY something didn’t work.
protection_effects:
  enabled: true

  defaults:
    deny_sound: BLOCK_NOTE_BLOCK_BASS
    deny_particle: SMOKE_NORMAL
    deny_volume: 1.0
    deny_pitch: 1.0

  pvp:
    deny_sound: ENTITY_ENDERMAN_TELEPORT
    deny_particle: REDSTONE
  containers:
    deny_sound: BLOCK_CHEST_LOCKED
    deny_particle: CRIT
  mobs:
    deny_sound: ENTITY_ZOMBIE_ATTACK_IRON_DOOR
    deny_particle: FLAME
  pets:
    deny_sound: ENTITY_CAT_HISS
    deny_particle: HEART
  entities:
    deny_sound: BLOCK_ANVIL_PLACE
    deny_particle: CRIT_MAGIC
  farm:
    deny_sound: BLOCK_CROP_BREAK
    deny_particle: VILLAGER_ANGRY


# ==============================================================================
# 👥 ROLE MANAGEMENT
# ==============================================================================
# What this does:
# - Defines roles used within a plot (owner/member/visitor).
# Player impact:
# - Determines what actions each role can do inside a claim.
# Warning:
# - If you remove a permission here, players may suddenly lose abilities.
roles:
  owner:
    name: "&cOwner"
    priority: 100
    permissions:
      - ALL

  member:
    name: "&aMember"
    priority: 50
    permissions:
      - BLOCK_BREAK
      - BLOCK_PLACE
      - INTERACT
      - CONTAINER

  visitor:
    name: "&7Visitor"
    priority: 0
    permissions:
      - USE_DOORS
      - USE_BUTTONS
