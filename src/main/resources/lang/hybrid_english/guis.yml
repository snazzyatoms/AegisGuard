# ============================================================
# Expansion Admin GUI (Missing keys added for auto-audit)
# ============================================================

# Paged title used by ExpansionRequestAdminGUI
expansion_admin_title_paged: '&6&lPending Requests &7({PAGE}/{PAGES})'

# Queue item (per-request)
expansion_request_item_name: '&bRequest: &f{PLAYER}'
expansion_request_item_lore:
  - '&7World: &f{WORLD}'
  - '&7Status: {STATUS}'
  - '&7Age: &f{AGE}'
  - '{PENDING_LINE}'
  - '{DECISION_LINE}'
  - '&7Radius: &e{CUR} &7→ &a{REQ}'
  - '&7Cost Due: &6{COST}'
  - '{DECISION_AGE_LINE}'
  - ' '
  - '&eLeft-click: &7Approve request.'
  - '&cRight-click: &7Deny request.'

# These are inserted into the lore above
expansion_request_item_lore_pending_line: '&7Pending For: &f{AGE}'
expansion_request_item_lore_decision_line: '&7Decision: &f{ACTOR}'

# Decider labels (used by the admin audit display)
expansion_decided_by_none: '&7Awaiting review'
expansion_decided_by_auto: '&bAuto-Approval'
expansion_decided_by_console: '&7Console'
expansion_decided_by_unknown: '&7Unknown'

# Make sure this supports placeholders (admin GUI passes {MODE} / {HINT})
expansion_admin_view_toggle: '&bView: &f{MODE}'

# ============================================================
# Claim Snapshots Admin GUI
# ============================================================

snapshots_admin_title: '&6&lClaim Snapshots &7({PAGE}/{PAGES})'

snapshots_none_title: '&cNo Snapshots Found'
snapshots_none_lore:
  - '&7There are no claim snapshots'
  - '&7available to review.'

snapshot_item_name: '&bSnapshot: &f{SNAPSHOT_ID}'
snapshot_item_lore:
  - '&7Owner: &f{PLOT_OWNER}'
  - '&7Plot ID: &f{PLOT_ID}'
  - '&7World: &f{WORLD}'
  - '&7Type: &f{TYPE}'
  - '&7Age: &f{AGE}'
  - '&7Radius: &f{RADIUS}'
  - '&7Reason: &f{REASON}'
  - '&7Actor: &f{ACTOR}'
  - ' '
  - '&eLeft-click: &7Rollback to this snapshot.'
  - '&cRight-click: &7Delete this snapshot.'
