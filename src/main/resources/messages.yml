# ======================================
# AegisGuard v1.2.4 - Legacy Messages
# Core/system feedback only.
# GUI & lore text is now handled by the Aegis Codex engine.
# ======================================
prefix: '&8[&bAegisGuard&8]&r '

language_styles:
  default: old_english
  available:
    - old_english
    - hybrid_english
    - modern_english

