name: AegisGuard
main: com.aegisguard.AegisGuard
version: 1.2.6
api-version: "1.20"
prefix: AegisGuard
description: Lightweight, friendly land protection with roles, safe zones, and polished GUIs.
authors: [snazzyatoms]
website: https://discord.gg/Y2NpuR7UZE
folia-supported: true

softdepend:
  # Economy / Utilities
  - Vault
  - PlaceholderAPI
  - CoreProtect

  # Maps / Visualization
  - Dynmap

  # Regions / Protection (compatibility layer yields to these when present)
  - WorldEdit
  - WorldGuard
  - GriefPrevention
  - GriefDefender
  - PlotSquared
  - Towny
  - Residence
  - Lands

  # Gameplay hooks (non-protection, but safe as optional integrations)
  - mcMMO
  - Jobs

commands:
  aegis:
    description: Main AegisGuard command.
    usage: /aegis <help|menu|wand|claim|cost|unclaim|resize|merge|setspawn|home|welcome|farewell|notify|market|sell|unsell|auction|visit|zone|level|like|rename|setdesc|stuck|consume|ledger|blocks>
    aliases: [ag, guard]
    permission: aegis.use
  aegisadmin:
    description: Admin management tools.
    usage: /aegisadmin <menu|reload|bypass|blocks|migrate>
    aliases: [agadmin, aga]
    permission: aegis.admin

permissions:
  # --- GROUPS ---
  aegis.*:
    description: Wildcard for all plugin permissions.
    default: op
    children:
      aegis.user: true
      aegis.admin: true

      # ClaimBlocks Exchange (all)
      aegis.claimblocks.exchange: true
      aegis.claimblocks.buy: true
      aegis.claimblocks.sell: true
      aegis.claimblocks.exchange.bypass: true
      aegis.claimblocks.selllock.bypass: true

      # Backward compat node (older configs/servers)
      aegisguard.claimblocks.selllock.bypass: true

      # ClaimBlocks earning
      aegis.earn.blocks: true

      # Migration (1.2.6+)
      aegis.admin.migrate: true

  aegis.user:
    description: Recommended permissions for default players.
    default: true
    children:
      aegis.use: true
      aegis.menu: true
      aegis.wand: true
      aegis.claim: true
      aegis.unclaim: true
      aegis.resize: true
      aegis.merge: true
      aegis.home: true
      aegis.spawn: true
      aegis.setspawn: true
      aegis.welcome: true
      aegis.farewell: true
      aegis.notify: true
      aegis.rename: true
      aegis.setdesc: true
      aegis.stuck: true
      aegis.visit: true
      aegis.ledger: true

      # ClaimBlocks earning (playtime task checks this)
      aegis.earn.blocks: true

      # ClaimBlocks Exchange (player-facing)
      aegis.claimblocks.exchange: true
      aegis.claimblocks.buy: true
      aegis.claimblocks.sell: true

      # Features
      aegis.market: true
      aegis.sell: true
      aegis.unsell: true
      aegis.auction: true
      aegis.zone: true
      aegis.level: true
      aegis.biome: true
      aegis.like: true

      # Moderation (owner tools)
      aegis.kick: true
      aegis.ban: true
      aegis.unban: true


  # Claim entry/exit notification toggle
  aegis.notify:
    description: Toggle claim entry/exit notifications for thyself.
    default: true
  aegis.notify.others:
    description: Toggle claim entry/exit notifications for another player.
    default: op
    children:
      aegis.notify: true
  aegis.notify.bypass:
    description: Receive claim entry/exit notifications even if server-wide disabled.
    default: op
  aegis.admin:
    description: Administrative permissions.
    default: op
    children:
      aegis.admin.manage: true
      aegis.admin.bypass-limits: true
      aegis.reload: true
      aegis.bypass: true
      aegis.consume: true
      aegis.setwarp: true
      aegis.delwarp: true
      aegis.convert: true
      aegis.admin.wand: true
      aegis.admin.migrate: true

      # ClaimBlocks Exchange Admin / bypass
      aegis.claimblocks.exchange.bypass: true
      aegis.claimblocks.selllock.bypass: true

      # Backward compat (keep OPs safe if they used old node)
      aegisguard.claimblocks.selllock.bypass: true

  # --- CORE PERMISSIONS ---
  aegis.use:
    description: Ability to use the /aegis command.
    default: true
  aegis.menu:
    description: Open the main GUI.
    default: true
  aegis.wand:
    description: Receive and use the claim wand.
    default: true
  aegis.claim:
    description: Claim land.
    default: true
  aegis.unclaim:
    description: Unclaim land.
    default: true
  aegis.resize:
    description: Resize land.
    default: true
  aegis.merge:
    description: Merge adjacent plots.
    default: true
  aegis.home:
    description: Teleport to plot spawn.
    default: true
  aegis.spawn:
    description: Teleport to world spawn using /ag spawn.
    default: true
  aegis.setspawn:
    description: Set plot spawn.
    default: true
  aegis.visit:
    description: Open travel menu.
    default: true
  aegis.stuck:
    description: Use unstuck command.
    default: true
  aegis.ledger:
    description: View your claim block ledger (/aegis ledger or /aegis blocks).
    default: true

  # --- CLAIMBLOCKS (EARNING) ---
  aegis.earn.blocks:
    description: Earn claim blocks via playtime rewards.
    default: true

  # --- CLAIMBLOCKS EXCHANGE ---
  aegis.claimblocks.exchange:
    description: Access the ClaimBlocks exchange (view/use exchange features).
    default: true
  aegis.claimblocks.buy:
    description: Buy ClaimBlocks using Vault money.
    default: true
  aegis.claimblocks.sell:
    description: Sell ClaimBlocks for Vault money (if sell gate enabled).
    default: true
  aegis.claimblocks.exchange.bypass:
    description: Bypass exchange cooldowns, hourly limits, and daily caps.
    default: op
  aegis.claimblocks.selllock.bypass:
    description: Bypass the ClaimBlocks sell lock hold timer.
    default: op

  # Backward compatibility (older node name)
  aegisguard.claimblocks.selllock.bypass:
    description: (Compat) Bypass the ClaimBlocks sell lock hold timer.
    default: op

  # --- IDENTITY & SOCIAL ---
  aegis.welcome:
    description: Set welcome message.
    default: true
  aegis.farewell:
    description: Set farewell message.
    default: true
  aegis.rename:
    description: Set plot alias title.
    default: true
  aegis.setdesc:
    description: Set plot description.
    default: true
  aegis.like:
    description: Give reputation to plots.
    default: true

  # --- ADVANCED FEATURES ---
  aegis.zone:
    description: Manage sub-zones.
    default: true
  aegis.level:
    description: Access leveling menu.
    default: true
  aegis.biome:
    description: Access biome menu.
    default: true

  # --- MODERATION ---
  aegis.kick:
    description: Kick players from own plot.
    default: true
  aegis.ban:
    description: Ban players from own plot.
    default: true
  aegis.unban:
    description: Unban players from own plot.
    default: true

  # --- ECONOMY ---
  aegis.market:
    description: View marketplace.
    default: true
  aegis.sell:
    description: Put plot for sale.
    default: true
  aegis.unsell:
    description: Remove plot from sale.
    default: true
  aegis.auction:
    description: View auction house.
    default: true

  # --- ADMIN NODES ---
  aegis.reload:
    description: Reload configuration.
    default: op
  aegis.bypass:
    description: Bypass all protection checks (Build/Break anywhere).
    default: op
  aegis.admin.manage:
    description: Edit flags/roles of other players' plots.
    default: op
  aegis.admin.bypass-limits:
    description: Ignore max plot size/count limits.
    default: op
  aegis.convert:
    description: Seize a plot and convert to Server Zone.
    default: op
  aegis.setwarp:
    description: Set a plot as a Server Warp.
    default: op
  aegis.delwarp:
    description: Remove a Server Warp.
    default: op
  aegis.admin.wand:
    description: Get the Sentinel's Scepter.
    default: op
  aegis.consume:
    description: Manually dispose of a wand item.
    default: op

  # --- MIGRATION (1.2.5+) ---
  aegis.admin.migrate:
    description: Import claims from other protection plugins (GriefPrevention, GriefDefender, Lands).
    default: op
