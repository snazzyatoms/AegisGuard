name: AegisGuard
main: com.aegisguard.AegisGuard
version: 1.2.6
api-version: "1.20"
prefix: AegisGuard
description: Lightweight, friendly land protection with roles, safe zones, and polished GUIs.
authors: [snazzyatoms]
website: https://discord.gg/Y2NpuR7UZE
folia-supported: true

softdepend:
  # Economy / Utilities
  - Vault
  - PlaceholderAPI
  - CoreProtect

  # Maps / Visualization
  - Dynmap

  # Regions / Protection (compatibility layer yields to these when present)
  - WorldEdit
  - WorldGuard
  - GriefPrevention
  - GriefDefender
  - PlotSquared
  - Towny
  - Residence
  - Lands

  # Gameplay hooks (non-protection, but safe as optional integrations)
  - mcMMO
  - Jobs

commands:
  aegis:
    description: Main AegisGuard command.
    usage: /aegis <help|menu|wand|claim|cost|unclaim|resize|merge|setspawn|home|welcome|farewell|notify|market|sell|unsell|auction|visit|zone|level|like|rename|setdesc|stuck|consume|ledger|blocks>
    aliases: [ag, guard]
    permission: aegis.use
  aegisadmin:
    description: Admin management tools.
    usage: /aegisadmin <menu|reload|bypass|blocks|migrate>
    aliases: [agadmin, aga]
    permission: aegis.admin

permissions:
  # --- GROUPS ---
  aegis.*:
    description: Wildcard for all plugin permissions.
    default: op
    children:
      aegis.user: true
      aegis.admin: true

      # ClaimBlocks Exchange (all)
      aegis.claimblocks.exchange: true
      aegis.claimblocks.buy: true
      aegis.claimblocks.sell: true
      aegis.claimblocks.exchange.bypass: true
      aegis.claimblocks.selllock.bypass: true

      # Backward compat node (older configs/servers)
      aegisguard.claimblocks.selllock.bypass: true

      # ClaimBlocks earning
      aegis.earn.blocks: true

      # Migration (1.2.6+)
      aegis.admin.migrate: true

  aegis.user:
    description: Recommended permissions for default players.
    default: true
    children:
      aegis.use: true
      aegis.menu: true
      aegis.wand: true
      aegis.claim: true

  aegis.admin:
    description: Administrative permissions.
    default: op
    children:
      aegis.admin.manage: true
      aegis.serverzone.manage: true
      aegis.admin.bypass-limits: true
      aegis.admin.bypass: true
      aegis.reload: true
      aegis.bypass: true
      aegis.consume: true
      aegis.convert: true
      aegis.setwarp: true
      aegis.admin.wand: true
      aegis.admin.migrate: true

  # --- NODES ---
  aegis.use:
    description: Allows using /aegis
    default: true

  aegis.menu:
    description: Allows opening the AegisGuard menu.
    default: true

  aegis.wand:
    description: Allows using the claim wand.
    default: true

  aegis.claim:
    description: Allows claiming land.
    default: true

  aegis.reload:
    description: Reload config and language packs.
    default: op

  aegis.bypass:
    description: Bypass all protection checks (Build/Break anywhere).
    default: op

  aegis.admin.manage:
    description: Edit flags/roles of other players' plots.
    default: op

  aegis.admin.bypass:
    description: Toggle runtime bypass mode (Master Key Mode).
    default: op

  aegis.serverzone.manage:
    description: Manage server plots without full admin.
    default: op

  aegis.admin.bypass-limits:
    description: Ignore max plot size/count limits.
    default: op

  aegis.convert:
    description: Seize a plot and convert to Server Zone.
    default: op

  aegis.setwarp:
    description: Set a warp point.
    default: op

  aegis.consume:
    description: Consume claim blocks.
    default: op

  aegis.admin.wand:
    description: Access the admin wand tools.
    default: op

  aegis.admin.migrate:
    description: Import claims from other protection plugins.
    default: op
